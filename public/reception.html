<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reception · Waiting Guest</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/reception.css">
</head>
<body>
<div id="topbar"></div>
<div class="rc-wrap">
  <main class="rc-main">
    <div class="search-box" role="search">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <label for="q" class="sr-only">Search</label>
      <input id="q" type="search" placeholder="Confirmation number, guest name or WG number" autocomplete="off" inputmode="search" autofocus>
      <kbd>/</kbd>
    </div>
    <div class="hint muted" id="hint">New arrival: type the <b>confirmation number</b>. Guest returning: search by name, confirmation or <b>WG number</b>.</div>
    <div id="results" aria-live="polite"></div>
    <div id="work"></div>
  </main>
  <aside class="rc-side">
    <div class="side-head">
      <h2 class="serif">Waiting guests</h2>
      <div class="seg" role="tablist"><button role="tab" data-tab="active" class="on">Active</button><button role="tab" data-tab="completed">Completed</button></div>
    </div>
    <div id="list"></div>
  </aside>
</div>
<script src="/js/common.js"></script>
<script src="/js/reception.js"></script>
</body>
</html>
