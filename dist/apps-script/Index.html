'use strict';
/* Reception: fast search, auto-filled reservation, four manual fields, QR; later verify and complete. */
WG.views.reception = function (root, user) {
  const S = { roomTypes: {}, active: [], completed: [], tab: 'active', selectedId: null, searchTimer: null, seq: 0 };
  const typeName = (c) => S.roomTypes[c] || c;
  const ASSOCIATE_KEY = 'wg-associate';

  root.innerHTML = `<div id="topbar"></div>
  <div class="rc-wrap">
    <main class="rc-main">
      <div class="search-box" role="search">
        ${icon('search')}
        <label for="q" class="sr-only">Search</label>
        <input id="q" type="search" placeholder="Confirmation number, guest name, WG number, room or luggage tag" autocomplete="off" inputmode="search" autofocus>
        <kbd>/</kbd>
      </div>
      <div class="hint muted" id="hint">New arrival: type the <b>confirmation number</b>. Guest returning: search by name, confirmation or <b>WG number</b>. <button class="linkish" id="manualLink">Reservation not found? Enter it manually</button></div>
      <div id="results" aria-live="polite"></div>
      <div id="work"></div>
    </main>
    <aside class="rc-side">
      <div class="side-head"><h2 class="serif">Waiting guests</h2>
        <div class="seg" role="tablist"><button role="tab" data-tab="active" class="on">Active</button><button role="tab" data-tab="completed">Closed</button></div></div>
      <div id="list"></div>
    </aside>
  </div>`;
  mountTopbar(user, 'Reception');

  /* ---------- list (right column) ---------- */
  function rowHtml(g, sel) {
    const t = g.status === 'completed' ? `<span class="t">${fmtClock(g.timestamps.completed)}</span>`
      : g.status === 'cancelled' ? `<span class="t">${fmtClock(g.timestamps.cancelled)}</span>`
      : g.status === 'ready' || g.status === 'returned' ? `<span class="t">ready ${fmtClock(g.timestamps.roomReady)}</span>`
      : `<span class="t num" data-since="${esc(g.timestamps.created)}">0:00</span>`;
    return `<button class="row${sel ? ' sel' : ''}" data-wg="${g.id}"><div class="top"><span class="nm">${esc(g.guestName)}</span><span class="wg">${esc(g.wgNumber)}</span>${g.timestamps.qrOpened && !['completed', 'cancelled'].includes(g.status) ? '<span class="seen-dot" title="Guest opened their page" aria-label="Guest opened their page"></span>' : ''}</div>
      <div class="sub">${esc(g.confirmationNo)} · ${esc(g.roomType)} · ${esc(g.associate || '')}</div>
      <div class="end">${statusPill(g.status)}${t}</div></button>`;
  }
  function renderList() {
    const items = S.tab === 'active' ? S.active : S.completed;
    $('#list').innerHTML = items.length ? items.map((g) => rowHtml(g, g.id === S.selectedId)).join('')
      : `<div class="empty">${icon('queue')}<b>${S.tab === 'active' ? 'No active waiting guests' : 'Nothing closed yet'}</b>Guests you create will appear here and update live.</div>`;
    tickTimers();
  }
  async function loadList() {
    try {
      const d = await api('GET', '/api/waiting-guests');
      S.active = d.active; S.completed = d.completed;
      renderList();
      refreshScanState();
      if (S.selectedId) refreshSelected();
    } catch (e) { if (!e.offline && !e.silent) toast(e.message, 'err'); }
  }
  $('#list').addEventListener('click', (e) => { const r = e.target.closest('[data-wg]'); if (r) openWg(Number(r.dataset.wg)); });
  $$('.seg button').forEach((b) => b.addEventListener('click', () => {
    S.tab = b.dataset.tab; $$('.seg button').forEach((x) => x.classList.toggle('on', x === b)); renderList();
  }));

  /* ---------- search ---------- */
  const q = $('#q');
  q.addEventListener('input', () => { clearTimeout(S.searchTimer); S.searchTimer = setTimeout(() => runSearch(false), 220); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { clearTimeout(S.searchTimer); runSearch(true); }
    if (e.key === 'Escape') { q.value = ''; runSearch(false); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); q.select(); } });
  $('#manualLink').onclick = () => openManual(q.value.trim());

  async function runSearch(fromEnter) {
    const term = q.value.trim();
    const box = $('#results');
    const my = ++S.seq;
    if (term.length < 2) { box.innerHTML = ''; $('#hint').hidden = false; return; }
    $('#hint').hidden = true;
    try {
      const d = await api('GET', `/api/search?q=${encodeURIComponent(term)}`);
      if (my !== S.seq) return;
      const activeConf = new Set(d.waitingGuests.filter((w) => !['completed', 'cancelled'].includes(w.status)).map((w) => w.confirmationNo));
      const res = d.reservations.filter((r) => !activeConf.has(r.confirmationNo));
      let html = '';
      if (d.waitingGuests.length) html += `<div class="group-label">Waiting guests</div>` + d.waitingGuests.map((g) => rowHtml(g, g.id === S.selectedId)).join('');
      if (res.length) html += `<div class="group-label">Reservations</div>` + res.map((r) => `<button class="row res" data-res="${esc(r.confirmationNo)}"><div class="top"><span class="wg">${esc(r.confirmationNo)}</span><span class="nm">${esc(r.guestName)}</span></div>
        <div class="sub">${esc(typeName(r.roomType))} · ${pax(r)}${r.arrivalTime ? ' · arrives ' + esc(r.arrivalTime) : ''}</div><div class="end"><span class="type-pill">${esc(r.roomType)}</span></div></button>`).join('');
      if (!html) html = `<div class="card empty">${icon('search')}<b>No match</b>Check the confirmation number, or search a returning guest by name or WG number.<div style="margin-top:12px"><button class="btn btn-ghost btn-sm" id="manualBtn">Enter reservation manually</button></div></div>`;
      box.innerHTML = html; tickTimers();
      const mb = $('#manualBtn'); if (mb) mb.onclick = () => openManual(term);
      if (fromEnter === true && d.waitingGuests.length + res.length === 1) {
        if (d.waitingGuests.length) openWg(d.waitingGuests[0].id); else openReservation(res[0].confirmationNo);
      }
    } catch (e) { if (my === S.seq && !e.silent) box.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  }
  $('#results').addEventListener('click', (e) => {
    const w = e.target.closest('[data-wg]'), r = e.target.closest('[data-res]');
    if (w) openWg(Number(w.dataset.wg)); else if (r) openReservation(r.dataset.res);
  });

  /* ---------- shared operational fields ---------- */
  const rememberedAssociate = () => { try { return localStorage.getItem(ASSOCIATE_KEY) || ''; } catch (e) { return ''; } };
  const recentAssociates = () => { try { return JSON.parse(localStorage.getItem('wg-associates') || '[]').slice(0, 8); } catch (e) { return []; } };
  const rememberAssociate = (name) => {
    try {
      localStorage.setItem(ASSOCIATE_KEY, name);
      localStorage.setItem('wg-associates', JSON.stringify([name].concat(recentAssociates().filter((n) => n !== name)).slice(0, 8)));
    } catch (e) { /* storage unavailable: nothing to remember */ }
  };
  const tagChips = (selected = []) => `<div class="field full"><span>Quick tags <em class="opt">(optional, one tap)</em></span><div class="tagrow" role="group" aria-label="Quick tags">${Object.keys(TAG_LABEL).map((t) =>
    `<button type="button" class="tagbtn" data-tag="${t}" aria-pressed="${selected.includes(t)}">${esc(TAG_LABEL[t])}</button>`).join('')}</div></div>`;
  const readTags = (scope) => $$('.tagbtn[aria-pressed="true"]', scope).map((b) => b.dataset.tag);
  document.addEventListener('click', (e) => { const b = e.target.closest('.tagbtn'); if (b) b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); });
  const opFields = (associate, lang = 'en') => `<div class="form-grid">
    <label class="field"><span>Luggage tag <em class="opt">(optional)</em></span><input class="in" id="fTag" maxlength="40" autocomplete="off"></label>
    <label class="field"><span>Associate name</span><input class="in" id="fAssoc" maxlength="80" value="${esc(associate)}" autocomplete="off" list="assocList" required><datalist id="assocList">${recentAssociates().map((n) => `<option value="${esc(n)}"></option>`).join('')}</datalist><span class="field-error" id="assocErr" hidden>Enter your name</span></label>
    <label class="field full"><span>Guest language <em class="opt">(for their QR page)</em></span><select class="in" id="fLang">${langOptions(lang)}</select></label>
    ${tagChips()}
    <label class="field full"><span>Guest preferences <em class="opt">(optional)</em></span><textarea class="in" id="fPref" maxlength="500" rows="2" placeholder="For the room team, e.g. high floor, twin beds"></textarea></label>
    <label class="field full"><span>Remarks <em class="opt">(optional)</em></span><textarea class="in" id="fRem" maxlength="500" rows="2"></textarea></label></div>`;

  /* ---------- reservation -> create ---------- */
  async function openReservation(no) {
    S.selectedId = null; renderList();
    const work = $('#work');
    work.innerHTML = `<div class="card panel"><div class="skeleton" style="height:28px;width:40%"></div><div class="skeleton" style="height:90px;margin-top:16px"></div></div>`;
    try {
      const d = await api('GET', `/api/search?q=${encodeURIComponent(no)}`);
      const r = d.reservations.find((x) => x.confirmationNo === no);
      if (!r) throw new Error('Reservation not found');
      const associate = rememberedAssociate();
      work.innerHTML = `<form class="card panel" id="createForm" novalidate>
        <div class="panel-head"><div><div class="label">Reservation ${esc(r.confirmationNo)}</div><h2 class="serif">${esc(r.guestName)}</h2></div><span class="type-pill">${esc(r.roomType)} · ${esc(typeName(r.roomType))}</span></div>
        <div class="kv">
          <div><span>Arrival</span><b>${fmtDate(r.arrivalDate)}${r.arrivalTime ? ' · ' + esc(r.arrivalTime) : ''}</b></div>
          <div><span>Departure</span><b>${fmtDate(r.departureDate)}</b></div>
          <div><span>Guests</span><b>${pax(r)}</b></div>
          <div><span>Phone</span><b>${esc(r.phone || '-')}</b></div>
          <div><span>Email</span><b>${esc(r.email || '-')}</b></div>
          ${r.mealPlan ? `<div><span>Meal plan</span><b>${esc(r.mealPlan)}</b></div>` : ''}
          ${r.vipCode ? `<div><span>VIP</span><b>${esc(r.vipCode)}</b></div>` : ''}
          ${r.specialRequests ? `<div style="grid-column:1/-1"><span>Reservation requests</span><b>${esc(r.specialRequests)}</b></div>` : ''}
        </div><hr>
        <div class="auto-note">${icon('check')} Phone, email, Waiting Guest number and QR are filled in automatically.</div>
        ${opFields(associate, r.suggestedLanguage)}
        <div class="banner err" id="formErr" role="alert" hidden style="margin-top:14px"></div>
        <div class="actions"><button class="btn btn-primary" id="createBtn" type="submit">${icon('plus')} Create Waiting Guest</button><button class="btn btn-ghost" type="button" id="cancelBtn">Cancel</button></div>
      </form>`;
      S.formOpenedAt = Date.now(); // measured: time from opening the reservation to pressing Create
      (associate ? $('#fTag') : $('#fAssoc')).focus();
      $('#cancelBtn').onclick = clearWork;
      $('#createForm').addEventListener('submit', (e) => { e.preventDefault(); submitCreate(r.confirmationNo, null); });
      $('#createForm').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitCreate(r.confirmationNo, null); } });
      work.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (e) { if (!e.silent) work.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  }

  /* ---------- manual fallback (reservation missing from the imported arrivals) ---------- */
  function openManual(term) {
    S.selectedId = null; renderList();
    const today = new Date(), iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const tomorrow = new Date(today.getTime() + 86400000);
    const types = Object.keys(S.roomTypes).sort();
    const associate = rememberedAssociate();
    $('#work').innerHTML = `<form class="card panel" id="manualForm" novalidate>
      <div class="panel-head"><div><div class="label">Manual entry</div><h2 class="serif">Reservation not in the arrivals list</h2></div></div>
      <div class="banner info" style="margin-bottom:14px">${icon('alert')}<span>Use this only when the confirmation number is not found. Copy the details exactly from Opera. The record is marked <b>Manual entry</b>.</span></div>
      <div class="form-grid">
        <label class="field"><span>Confirmation number</span><input class="in" id="mConf" maxlength="30" value="${/^[A-Za-z0-9\-\/]+$/.test(term) ? esc(term) : ''}" autocomplete="off" required></label>
        <label class="field"><span>Guest name</span><input class="in" id="mName" maxlength="120" autocomplete="off" required></label>
        <label class="field"><span>Arrival date</span><input class="in" id="mArr" type="date" value="${iso(today)}" required></label>
        <label class="field"><span>Departure date</span><input class="in" id="mDep" type="date" value="${iso(tomorrow)}" required></label>
        <label class="field"><span>Room type</span><select class="in" id="mType" required><option value="">Select…</option>${types.map((c) => `<option value="${esc(c)}">${esc(c)} · ${esc(S.roomTypes[c])}</option>`).join('')}</select></label>
        <label class="field"><span>Arrival time <em class="opt">(optional)</em></span><input class="in" id="mTime" type="time"></label>
        <label class="field"><span>Adults</span><input class="in" id="mAd" type="number" min="1" max="20" value="2" required></label>
        <label class="field"><span>Children</span><input class="in" id="mCh" type="number" min="0" max="20" value="0"></label>
        <label class="field"><span>Phone <em class="opt">(optional)</em></span><input class="in" id="mPh" maxlength="40" autocomplete="off"></label>
        <label class="field"><span>Email <em class="opt">(optional)</em></span><input class="in" id="mEm" maxlength="120" autocomplete="off"></label>
      </div><hr>${opFields(associate)}
      <div class="banner err" id="formErr" role="alert" hidden style="margin-top:14px"></div>
      <div class="actions"><button class="btn btn-primary" id="createBtn" type="submit">${icon('plus')} Create Waiting Guest</button><button class="btn btn-ghost" type="button" id="cancelBtn">Cancel</button></div></form>`;
    $('#cancelBtn').onclick = clearWork;
    S.formOpenedAt = Date.now();
    (/^[A-Za-z0-9\-\/]+$/.test(term) ? $('#mName') : $('#mConf')).focus();
    $('#manualForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const manual = { guestName: $('#mName').value, arrivalDate: $('#mArr').value, departureDate: $('#mDep').value, roomType: $('#mType').value, arrivalTime: $('#mTime').value,
        adults: $('#mAd').value, children: $('#mCh').value, phone: $('#mPh').value, email: $('#mEm').value };
      submitCreate($('#mConf').value.trim(), manual);
    });
    $('#work').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function submitCreate(no, manual) {
    const assoc = $('#fAssoc').value.trim();
    $('#assocErr').hidden = !!assoc;
    $('#fAssoc').setAttribute('aria-invalid', assoc ? 'false' : 'true');
    if (!assoc) { $('#fAssoc').focus(); return; }
    const btn = $('#createBtn');
    if (btn.classList.contains('loading')) return; // guard against double clicks
    btn.classList.add('loading'); $('#formErr').hidden = true;
    try {
      rememberAssociate(assoc);
      const { waitingGuest: g } = await api('POST', '/api/waiting-guests', {
        confirmationNo: no, associate: assoc, luggageTag: $('#fTag').value, preferences: $('#fPref').value, remarks: $('#fRem').value, language: $('#fLang').value, tags: readTags($('#work')), createSeconds: S.formOpenedAt ? Math.round((Date.now() - S.formOpenedAt) / 1000) : null, manual,
      });
      S.selectedId = null; // keep the success panel; live refresh must not replace it
      await showQr(g, true);
      q.value = ''; $('#results').innerHTML = ''; $('#hint').hidden = false;
      await loadList();
      const row = $(`#list [data-wg="${g.id}"]`); if (row) row.classList.add('flash');
    } catch (e) {
      btn.classList.remove('loading');
      if (e.silent) return;
      if (e.status === 409 && e.data && e.data.waitingGuest) {
        $('#formErr').innerHTML = `${esc(e.message)}. <button type="button" class="text-btn" id="openExisting">Open ${esc(e.data.waitingGuest.wgNumber)}</button>`;
        $('#openExisting').onclick = () => openWg(e.data.waitingGuest.id);
      } else $('#formErr').textContent = e.message;
      $('#formErr').hidden = false;
    }
  }

  async function showQr(g, fresh) {
    $('#work').innerHTML = `<div class="card success">
      ${fresh ? `<div class="tick">${icon('check')}</div>` : ''}
      <div class="label">${fresh ? 'Waiting Guest created' : 'Guest QR'}</div>
      <div class="big-wg">${esc(g.wgNumber)}</div>
      <div><b>${esc(g.guestName)}</b> · ${esc(g.confirmationNo)}</div>
      <div class="muted" style="margin-top:6px">${fresh ? `Now in the Rooms Controller queue. Waiting timer started at ${fmtClock(g.timestamps.created)}.` : `Status: ${esc(STATUS_LABEL[g.status])}`}</div>
      <div class="qr" id="qrBox" aria-label="Guest QR code"><div class="skeleton" style="aspect-ratio:1"></div></div>
      <div class="scan-state" id="scanState" data-wg="${g.id}">${engagementHtml(g)}</div>
      <div class="muted" style="font-size:12.5px">The guest scans this QR to follow their room status in <b>${esc(langInfo(g.language).name)}</b>. No login or app needed.</div>
      <div class="link-row" id="qrActions"><button class="btn btn-primary btn-sm" id="nextBtn">${icon('plus')} New Waiting Guest</button></div></div>`;
    $('#nextBtn').onclick = () => { clearWork(); q.focus(); };
    try {
      const { url, svg } = await api('GET', `/api/waiting-guests/${g.id}/qr`);
      $('#qrBox').innerHTML = svg;
      $('#qrActions').insertAdjacentHTML('afterbegin', `<button class="btn btn-ghost btn-sm" id="copyBtn">${icon('copy')} Copy guest link</button><a class="btn btn-ghost btn-sm" href="${esc(url)}" target="_blank" rel="noopener">${icon('link')} Open guest page</a>`);
      $('#copyBtn').onclick = async () => toast((await copyText(url)) ? 'Guest link copied' : 'Could not copy. Use "Open guest page".', 'ok');
    } catch (e) { $('#qrBox').textContent = 'QR unavailable'; }
  }

  function clearWork() { $('#work').innerHTML = ''; S.selectedId = null; S.formOpenedAt = null; renderList(); }

  /** Keep the "has the guest scanned it?" line on the QR panel live. */
  function refreshScanState() {
    const el = $('#scanState');
    if (!el) return;
    const g = S.active.concat(S.completed).find((x) => x.id === Number(el.dataset.wg));
    if (g) { const html = engagementHtml(g); if (el.innerHTML !== html) el.innerHTML = html; }
  }

  /* ---------- existing waiting guest: verify + complete ---------- */
  async function openWg(id) {
    S.selectedId = id; renderList();
    $$('#results .row').forEach((r) => r.classList.toggle('sel', Number(r.dataset.wg) === id));
    await refreshSelected(true);
  }
  async function refreshSelected(scroll) {
    const id = S.selectedId;
    if (!id) return;
    try {
      const { waitingGuest: g, history } = await api('GET', `/api/waiting-guests/${id}`);
      if (id !== S.selectedId) return;
      if (document.querySelector('.modal-overlay')) return; // never redraw under an open dialog
      renderWg(g, history);
      if (scroll) $('#work').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (e) { if (!e.silent) $('#work').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  }

  function editDialog(g) {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `<form class="modal-box" style="max-width:480px" role="dialog" aria-modal="true" aria-labelledby="edT"><h2 id="edT">Edit ${esc(g.wgNumber)}</h2>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
      <label class="field"><span>Luggage tag</span><input class="in" id="eTag" maxlength="40" value="${esc(g.luggageTag)}"></label>
      <label class="field"><span>Associate name</span><input class="in" id="eAssoc" maxlength="80" value="${esc(g.associate)}" required></label>
      <label class="field"><span>Guest language (QR page)</span><select class="in" id="eLang">${langOptions(g.language)}</select></label>
      ${tagChips(g.tags || [])}
      <label class="field"><span>Guest preferences</span><textarea class="in" id="ePref" maxlength="500" rows="2">${esc(g.preferences)}</textarea></label>
      <label class="field"><span>Remarks</span><textarea class="in" id="eRem" maxlength="500" rows="2">${esc(g.remarks)}</textarea></label>
      <div class="banner err" id="edErr" hidden></div></div>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-r="0">Cancel</button><button class="btn btn-primary" type="submit" id="edGo">Save</button></div></form>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    $('[data-r="0"]', ov).onclick = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    ov.querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const b = $('#edGo', ov); b.classList.add('loading');
      try {
        await api('POST', `/api/waiting-guests/${g.id}/details`, { luggageTag: $('#eTag', ov).value, associate: $('#eAssoc', ov).value, language: $('#eLang', ov).value, tags: readTags(ov), preferences: $('#ePref', ov).value, remarks: $('#eRem', ov).value });
        close(); toast('Details updated'); await loadList();
      } catch (ex) { b.classList.remove('loading'); $('#edErr', ov).textContent = ex.message; $('#edErr', ov).hidden = false; }
    });
  }

  function renderWg(g, history) {
    const ready = g.status === 'ready' || g.status === 'returned', closed = ['completed', 'cancelled'].includes(g.status);
    const note = g.status === 'ready' ? `<div class="ready-note">${icon('key')} Room is ready. Verify the guest, then complete.</div>`
      : g.status === 'returned' ? `<div class="ready-note">${icon('key')} Guest is at the desk. Complete to finish.</div>`
      : g.status === 'completed' ? `<div class="banner info">Completed at ${fmtClock(g.timestamps.completed)}. Key activation and the final hotel transaction happen outside this system.</div>`
      : g.status === 'cancelled' ? `<div class="banner err">Cancelled at ${fmtClock(g.timestamps.cancelled)}: ${esc(g.cancelReason)}</div>`
      : `<div class="banner info">${icon('clock')}<span>Room is not ready yet (${esc(STATUS_LABEL[g.status])}). It cannot be completed until the Rooms Controller marks it ready.</span></div>`;
    $('#work').innerHTML = `<div class="card panel">
      <div class="panel-head"><div><div class="label">Waiting Guest · ${esc(g.wgNumber)}</div><h2 class="serif">${esc(g.guestName)}</h2></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${g.source === 'manual' ? '<span class="type-pill">Manual entry</span>' : ''}${statusPill(g.status)}</div></div>
      ${note}
      <div class="verify"><div class="label" style="margin-bottom:8px">Verify with the guest</div><div class="kv">
        <div><span>Guest name</span><b>${esc(g.guestName)}</b></div><div><span>Confirmation</span><b class="num">${esc(g.confirmationNo)}</b></div>
        <div><span>WG number</span><b class="num">${esc(g.wgNumber)}</b></div>${g.roomNumber && ready ? `<div><span>Room</span><b class="num">${esc(g.roomNumber)}</b></div>` : `<div><span>Stay</span><b>${fmtDate(g.arrivalDate)} → ${fmtDate(g.departureDate)}</b></div>`}</div></div>
      <div class="actions top">
        ${!closed ? `<button class="btn btn-primary" id="completeBtn" ${ready ? '' : 'disabled'}>${icon('check')} Complete Waiting Guest</button>` : ''}
        ${g.status === 'ready' ? `<button class="btn btn-ghost" id="returnedBtn">Guest is at the desk</button>` : ''}
      </div>
      <div class="actions sec">
        <button class="btn btn-ghost btn-sm" id="qrBtn">${icon('link')} Show QR</button>
        ${!closed ? `<button class="btn btn-ghost btn-sm" id="editBtn">Edit details</button><button class="btn btn-ghost btn-sm btn-danger" id="cancelWgBtn">Cancel record…</button>` : ''}
      </div>
      ${!closed ? `<div class="eng-line">${engagementHtml(g)}</div>` : ''}
      <hr>${detailGroupsHtml(g, typeName)}
      <hr><div class="section-label">Timeline</div>${timelineHtml(g, history)}
    </div>`;
    const cb = $('#completeBtn');
    if (cb && ready) cb.onclick = async () => {
      const ok = await confirmDialog({ title: `Complete ${g.wgNumber}?`, body: `Confirm you have verified <b>${esc(g.guestName)}</b> (${esc(g.confirmationNo)}). This closes the Waiting Guest record.`, confirmLabel: 'Complete' });
      if (!ok) return;
      cb.classList.add('loading');
      try { await api('POST', `/api/waiting-guests/${g.id}/status`, { status: 'completed' }); toast(`${g.wgNumber} completed`); await loadList(); }
      catch (e) { cb.classList.remove('loading'); if (!e.silent) toast(e.message, 'err'); await loadList(); }
    };
    const rb = $('#returnedBtn');
    if (rb) rb.onclick = async () => { rb.classList.add('loading'); try { await api('POST', `/api/waiting-guests/${g.id}/status`, { status: 'returned' }); toast('Marked as returned'); await loadList(); } catch (e) { rb.classList.remove('loading'); if (!e.silent) toast(e.message, 'err'); await loadList(); } };
    $('#qrBtn').onclick = () => { S.selectedId = null; showQr(g, false); };
    const eb = $('#editBtn'); if (eb) eb.onclick = () => editDialog(g);
    const xb = $('#cancelWgBtn');
    if (xb) xb.onclick = async () => {
      const reason = await dialog({ title: `Cancel ${g.wgNumber}?`, body: 'Use this when the record was created by mistake or the guest no longer waits. The guest page will stop showing room updates.', confirmLabel: 'Cancel Waiting Guest', cancelLabel: 'Keep', input: { label: 'Reason (required)', min: 3, error: 'Please give a short reason' } });
      if (!reason) return;
      try { await api('POST', `/api/waiting-guests/${g.id}/cancel`, { reason }); toast(`${g.wgNumber} cancelled`); await loadList(); } catch (e) { if (!e.silent) toast(e.message, 'err'); }
    };
  }

  /* ---------- boot ---------- */
  (async function init() {
    try {
      S.roomTypes = (await api('GET', '/api/meta')).roomTypes;
      $('#list').innerHTML = '<div class="skeleton" style="height:64px"></div><div class="skeleton" style="height:64px"></div>';
      await loadList();
      WG.stopLive = live(loadList, setLive);
    } catch (e) { if (!e.silent) toast(e.message, 'err'); }
  })();
};

/* ---- 30-controller.js ---- */
'use strict';
/* Rooms Controller: who is waiting, for how long, which room, and who needs attention.
   The queue is sorted by transparent priority; every reason is shown on the card. */
WG.views.controller = function (root, user) {
  const S = { roomTypes: {}, queue: [], filter: 'all', sort: 'priority', q: '', selectedId: null, seen: new Set(), first: true, cfg: { warn: 30, alert: 60 }, pendingRoom: null, detail: null };
  const typeName = (c) => S.roomTypes[c] || c;
  const LEVEL_RANK = { high: 0, attention: 1, normal: 2 };
  const FILTERS = [['all', 'All active'], ['attention', 'Needs attention'], ['waiting', 'Waiting'], ['room_assigned', 'Room assigned'], ['preparing', 'Being prepared'], ['ready', 'Ready, guest not back']];

  root.innerHTML = `<div id="topbar"></div>
    <div class="rc-shell">
      <div class="metrics" id="metrics" aria-label="Live figures"></div>
      <div class="toolbar">
        <div class="search-box compact" role="search">${icon('search')}<label for="cq" class="sr-only">Filter the queue</label>
          <input id="cq" type="search" placeholder="Name, WG number, confirmation, room, tag" autocomplete="off"><kbd>/</kbd></div>
        <div class="chips" id="filters" role="toolbar" aria-label="Filter queue"></div>
        <label class="sortsel"><span class="sr-only">Sort</span><select id="sortSel" class="in"><option value="priority">Priority first</option><option value="wait">Longest wait</option><option value="arrival">Arrival time</option></select></label>
      </div>
      <div class="rc-body"><main id="queue" aria-live="polite" aria-label="Waiting guest queue"></main><aside class="detail" id="detail" aria-label="Guest details"></aside></div>
    </div>`;
  mountTopbar(user, 'Rooms Controller');

  /* ---------- live figures ---------- */
  async function loadMetrics() {
    try {
      const m = await api('GET', '/api/metrics?range=today');
      const att = S.queue.filter((g) => priorityOf(g, S.cfg).level !== 'normal').length;
      $('#metrics').innerHTML = `
        <div class="metric"><span>Waiting for a room</span><b>${m.stillWaitingForRoom}</b></div>
        <div class="metric ${att ? 'hot' : ''}"><span>Need attention</span><b>${att}</b></div>
        <div class="metric"><span>Longest wait now</span><b>${m.stillWaitingForRoom ? fmtWait(m.longestActiveWaitSec) : '-'}</b></div>
        <div class="metric good"><span>Ready, guest not back</span><b>${m.readyAwaitingGuest}</b></div>
        <div class="metric"><span>Avg. wait to ready today</span><b>${m.avgWaitToReadySec == null ? '-' : fmtDuration(m.avgWaitToReadySec)}</b></div>`;
    } catch (e) { /* figures are secondary; the queue still works */ }
  }

  /* ---------- queue ---------- */
  const matches = (g) => {
    if (!S.q) return true;
    const hay = [g.guestName, g.wgNumber, g.confirmationNo, g.roomNumber, g.luggageTag, g.associate, g.roomType].join(' ').toLowerCase();
    return S.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
  };
  const inFilter = (g) => {
    if (S.filter === 'all') return true;
    if (S.filter === 'attention') return priorityOf(g, S.cfg).level !== 'normal';
    if (S.filter === 'ready') return g.status === 'ready' || g.status === 'returned';
    return g.status === S.filter;
  };

  function cardHtml(g, isNew) {
    const p = priorityOf(g, S.cfg);
    const ready = ['ready', 'returned'].includes(g.status);
    const since = ready ? g.timestamps.roomReady : g.timestamps.created;
    return `<button class="q s-${g.status} lvl-${p.level}${g.id === S.selectedId ? ' sel' : ''}${isNew ? ' q-new' : ''}" data-id="${g.id}" data-waitbox aria-label="${esc(g.wgNumber)}, ${esc(g.guestName)}, ${esc(STATUS_LABEL[g.status])}${p.level === 'high' ? ', high priority' : ''}">
      <span class="bar"></span>
      <div class="timer"><b class="num" data-since="${esc(since)}" ${ready ? '' : `data-levels="${S.cfg.warn},${S.cfg.alert}"`}>${fmtWait((nowMs() - Date.parse(since)) / 1000)}</b><small>${ready ? 'ready for' : 'waiting'}</small></div>
      <div class="main">
        <div class="l1">${p.level === 'high' ? '<span class="flag">High priority</span>' : ''}<span class="nm">${esc(g.guestName)}</span><span class="wg">${esc(g.wgNumber)}</span></div>
        <div class="l2"><span class="type-pill">${esc(g.roomType)}</span><span>${pax(g)}</span>${g.luggageTag ? `<span>${icon('bag')}${esc(g.luggageTag)}</span>` : ''}<span class="muted">Arr ${esc(g.arrivalTime || fmtClock(g.timestamps.guestArrival))}</span></div>
        ${p.reasons.length || g.preferences ? `<div class="l3">${reasonChips(p)}${g.preferences ? `<span class="note" title="${esc(g.preferences)}">${esc(g.preferences)}</span>` : ''}</div>` : ''}
      </div>
      <div class="side">${statusPill(g.status)}${g.roomNumber ? `<div class="room">${esc(g.roomNumber)}</div>` : '<div class="room none">No room</div>'}</div>
    </button>`;
  }

  function sortRows(rows) {
    const age = (g) => Date.parse(g.timestamps.created);
    return rows.sort((a, b) => {
      const ra = ['ready', 'returned'].includes(a.status), rb = ['ready', 'returned'].includes(b.status);
      if (ra !== rb) return ra ? 1 : -1; // guests still waiting for a room always come first
      if (S.sort === 'arrival') return String(a.arrivalTime || '99').localeCompare(String(b.arrivalTime || '99')) || age(a) - age(b);
      if (S.sort === 'priority') { const d = LEVEL_RANK[priorityOf(a, S.cfg).level] - LEVEL_RANK[priorityOf(b, S.cfg).level]; if (d) return d; }
      return age(a) - age(b);
    });
  }

  function renderFilters() {
    $('#filters').innerHTML = FILTERS.map(([k, l]) => {
      const n = S.queue.filter((g) => { const f = S.filter; S.filter = k; const r = inFilter(g); S.filter = f; return r; }).length;
      return `<button class="chip${S.filter === k ? ' on' : ''}${k === 'attention' && n ? ' warn' : ''}" data-f="${k}" aria-pressed="${S.filter === k}">${l}<i>${n}</i></button>`;
    }).join('');
  }

  function renderQueue() {
    renderFilters();
    const rows = sortRows(S.queue.filter((g) => inFilter(g) && matches(g)));
    const box = $('#queue');
    if (!rows.length) {
      const why = S.q ? ['No match', `Nothing in the active queue matches "${esc(S.q)}".`] : S.queue.length ? ['Nothing here', 'Try another filter.'] : ['No waiting guests', 'When Reception creates a Waiting Guest, it appears here within seconds.'];
      box.innerHTML = `<div class="card empty">${icon('door')}<b>${why[0]}</b>${why[1]}</div>`;
      return;
    }
    const waiting = rows.filter((g) => !['ready', 'returned'].includes(g.status));
    const ready = rows.filter((g) => ['ready', 'returned'].includes(g.status));
    box.innerHTML = (waiting.length ? `<h2 class="qhead">Waiting for a room <span>${waiting.length}</span></h2>${waiting.map((g) => cardHtml(g, !S.first && !S.seen.has(g.id))).join('')}` : '')
      + (ready.length ? `<h2 class="qhead">Room ready, guest not back yet <span>${ready.length}</span></h2>${ready.map((g) => cardHtml(g, !S.first && !S.seen.has(g.id))).join('')}` : '');
    tickTimers();
  }

  async function loadQueue() {
    try {
      const d = await api('GET', '/api/waiting-guests');
      const prev = new Set(S.queue.map((g) => g.id));
      S.queue = d.active;
      renderQueue();
      if (!S.first) for (const g of S.queue) if (!prev.has(g.id)) toast(`New waiting guest: ${g.guestName} (${g.wgNumber})`);
      for (const g of S.queue) S.seen.add(g.id);
      S.first = false;
      loadMetrics();
      if (S.selectedId) { if (S.queue.some((g) => g.id === S.selectedId)) loadDetail(S.selectedId, true); else closeDetail(); }
    } catch (e) { if (!e.offline && !e.silent) toast(e.message, 'err'); }
  }
  // re-sort every minute: waiting times cross thresholds even when nothing else changes
  setInterval(() => { if (!document.querySelector('.modal-overlay')) { renderQueue(); } }, 60000);

  $('#queue').addEventListener('click', (e) => { const c = e.target.closest('[data-id]'); if (c) selectGuest(Number(c.dataset.id)); });
  $('#filters').addEventListener('click', (e) => { const c = e.target.closest('[data-f]'); if (c) { S.filter = c.dataset.f; renderQueue(); } });
  $('#sortSel').addEventListener('change', (e) => { S.sort = e.target.value; renderQueue(); });
  $('#cq').addEventListener('input', (e) => { S.q = e.target.value.trim(); renderQueue(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#cq').focus(); }
    if (e.key === 'Escape' && !document.querySelector('.modal-overlay')) { if (document.activeElement === $('#cq') && S.q) { $('#cq').value = ''; S.q = ''; renderQueue(); } else closeDetail(); }
  });

  /* ---------- detail ---------- */
  function selectGuest(id) { S.selectedId = id; S.pendingRoom = null; $$('#queue .q').forEach((c) => c.classList.toggle('sel', Number(c.dataset.id) === id)); loadDetail(id); }
  function closeDetail() { S.selectedId = null; $('#detail').classList.remove('open'); renderDetailEmpty(); $$('#queue .q.sel').forEach((c) => c.classList.remove('sel')); }
  const renderDetailEmpty = () => { $('#detail').innerHTML = `<div class="card detail-empty empty">${icon('queue')}<b>Select a guest</b>Assign a room, update the status and see the full timeline.</div>`; };
  async function loadDetail(id, quiet) {
    const el = $('#detail');
    if (!quiet) { el.classList.add('open'); el.innerHTML = `<div class="card d-card"><div class="skeleton" style="height:30px;width:50%"></div><div class="skeleton" style="height:120px;margin-top:16px"></div></div>`; }
    try {
      const d = await api('GET', `/api/waiting-guests/${id}`);
      if (id !== S.selectedId || document.querySelector('.modal-overlay')) return;
      S.detail = d;
      renderDetail(d);
    } catch (e) { if (!e.silent) el.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  }

  function roomPicker(d, pending) {
    const g = d.waitingGuest;
    if (!d.rooms.length) return `<div class="banner info">${icon('alert')}<span>No rooms are available to assign. An admin can import rooms, or another guest's room must be released.</span></div>`;
    const btn = (r) => `<button class="rm hk-${r.hkStatus}${pending === r.roomNumber ? ' on' : ''}" data-room="${esc(r.roomNumber)}" aria-pressed="${pending === r.roomNumber}" title="${esc(r.roomType)} · ${esc(typeName(r.roomType))}${r.building ? ' · ' + esc(r.building) : ''}"><b>${esc(r.roomNumber)}</b><small>${r.matchesType ? '' : esc(r.roomType) + ' · '}${r.hkStatus === 'inspected' ? 'inspected' : esc(r.hkStatus)}</small></button>`;
    const same = d.rooms.filter((r) => r.matchesType), other = d.rooms.filter((r) => !r.matchesType);
    return `${same.length ? `<div class="rm-head">${esc(g.roomType)} rooms <span>${same.length}</span></div><div class="room-grid">${same.map(btn).join('')}</div>` : `<div class="muted" style="font-size:12.5px">No free ${esc(g.roomType)} rooms.</div>`}
      ${other.length ? `<details class="rm-other" ${same.length ? '' : 'open'}><summary>Other room types <span>${other.length}</span></summary><div class="room-grid">${other.map(btn).join('')}</div></details>` : ''}
      <p class="legend-note">Housekeeping status comes from the last rooms import, not live from Opera.</p>
      ${pending && pending !== g.roomNumber ? `<button class="btn btn-primary" id="assignBtn" style="width:100%">${g.roomNumber ? 'Change to' : 'Assign'} room ${esc(pending)}</button>` : `<p class="pick-hint">${g.roomNumber ? 'Tap another room to change it.' : 'Tap a room to assign it.'}</p>`}`;
  }

  function renderDetail(d) {
    const g = d.waitingGuest, ready = ['ready', 'returned'].includes(g.status), done = ['completed', 'cancelled'].includes(g.status);
    const p = priorityOf(g, S.cfg);
    const el = $('#detail');
    const pending = S.pendingRoom && S.pendingRoom.id === g.id ? S.pendingRoom.room : (g.roomNumber || null);
    const canPick = ['waiting', 'room_assigned', 'preparing'].includes(g.status);
    const scroll = el.scrollTop;
    const next = g.status === 'waiting' ? 'Assign a room'
      : g.status === 'room_assigned' ? 'Start preparation, or mark ready if the room is already clean'
      : g.status === 'preparing' ? 'Mark the room ready when it is inspected'
      : ready ? 'Waiting for the guest to return to Reception' : '';
    el.classList.add('open');
    el.innerHTML = `<div class="card d-card lvl-${p.level}" data-waitbox>
      <div class="d-head"><div><div class="label">${esc(g.wgNumber)}</div><h2>${esc(g.guestName)}</h2></div>
        <div class="d-head-r">${statusPill(g.status)}<button class="icon-btn detail-close" id="dClose" aria-label="Close details">✕</button></div></div>
      ${done ? '' : `<div class="d-time"><div><b class="num" data-since="${esc(ready ? g.timestamps.roomReady : g.timestamps.created)}" ${ready ? '' : `data-levels="${S.cfg.warn},${S.cfg.alert}"`}>-</b><span>${ready ? 'room ready for' : 'waiting'}</span></div>
        <div class="d-room"><span>Room</span><b>${esc(g.roomNumber || '-')}</b></div></div>`}
      ${p.reasons.length ? `<div class="d-why">${p.level === 'high' ? '<span class="flag">High priority</span>' : p.level === 'attention' ? '<span class="flag soft">Attention</span>' : ''}${reasonChips(p)}</div>` : ''}
      ${next ? `<div class="d-next">${icon('clock')}<span><b>Next:</b> ${next}</span></div>` : ''}
      ${g.preferences || g.remarks ? `<div class="d-notes">${g.preferences ? `<div class="pref-box"><span>Guest preferences</span>${esc(g.preferences)}</div>` : ''}${g.remarks ? `<div class="pref-box rem"><span>Remarks</span>${esc(g.remarks)}</div>` : ''}</div>` : ''}
      <div class="d-sec act">
        ${g.status === 'room_assigned' ? `<button class="btn btn-ghost" data-status="preparing">Start room preparation</button>` : ''}
        ${['room_assigned', 'preparing'].includes(g.status) ? `<button class="btn btn-ready" data-status="ready">${icon('key')} Mark room ${esc(g.roomNumber)} ready</button>` : ''}
        ${ready ? `<div class="eng-line">${engagementHtml(g)}</div>` : ''}
      </div>
      ${canPick ? `<div class="d-sec"><div class="section-label">${g.roomNumber ? 'Change room' : 'Assign a room'}</div>${roomPicker(d, pending)}</div>` : ''}
      <div class="d-sec">${detailGroupsHtml(g, typeName)}</div>
      <div class="d-sec"><div class="section-label">Timeline</div>${timelineHtml(g, d.history)}</div>
      ${!done ? `<div class="d-sec d-foot"><label class="toggle"><input type="checkbox" id="priTgl" ${g.priority ? 'checked' : ''}> Mark as priority</label><button class="btn btn-ghost btn-sm btn-danger" id="cancelWgBtn">Cancel record…</button></div>` : ''}
    </div>`;
    el.scrollTop = scroll;
    tickTimers();
    $('#dClose').onclick = closeDetail;
    $$('#detail .rm').forEach((b) => b.onclick = () => { S.pendingRoom = { id: g.id, room: b.dataset.room }; renderDetail(d); const again = $(`#detail .rm[data-room="${b.dataset.room}"]`); if (again) again.focus(); });
    const ab = $('#assignBtn');
    if (ab) ab.onclick = () => act(ab, () => api('POST', `/api/waiting-guests/${g.id}/assign-room`, { roomNumber: pending }), `Room ${pending} assigned to ${g.guestName}`, () => { S.pendingRoom = null; });
    $$('[data-status]').forEach((b) => b.onclick = async () => {
      const to = b.dataset.status;
      if (to === 'ready') {
        const ok = await confirmDialog({ title: `Room ${g.roomNumber} is ready?`, body: `${esc(g.guestName)}'s page will change to <b>Your room is ready</b> within a few seconds, asking them to return to Reception.`, confirmLabel: 'Yes, mark ready' });
        if (!ok) return;
      }
      act(b, () => api('POST', `/api/waiting-guests/${g.id}/status`, { status: to }), to === 'ready' ? `Room ${g.roomNumber} ready. ${g.guestName} is being notified on their page.` : 'Room preparation started');
    });
    const pt = $('#priTgl');
    if (pt) pt.onchange = () => act(pt, () => api('POST', `/api/waiting-guests/${g.id}/priority`, { priority: pt.checked }), pt.checked ? 'Marked as priority' : 'Priority removed');
    const xb = $('#cancelWgBtn');
    if (xb) xb.onclick = async () => {
      const reason = await dialog({ title: `Cancel ${g.wgNumber}?`, body: 'Use this only for a record created by mistake or a guest who no longer waits. Any assigned room is released.', confirmLabel: 'Cancel record', cancelLabel: 'Keep', input: { label: 'Reason (required)', min: 3, error: 'Please give a short reason' } });
      if (!reason) return;
      act(xb, () => api('POST', `/api/waiting-guests/${g.id}/cancel`, { reason }), `${g.wgNumber} cancelled`);
    };
  }

  async function act(btn, fn, okMsg, after) {
    if (btn.classList.contains('loading')) return;
    btn.classList.add('loading'); btn.disabled = true;
    try { await fn(); if (after) after(); toast(okMsg); await loadQueue(); }
    catch (e) {
      if (!e.silent) toast(e.status === 409 ? `${e.message}` : e.message, 'err');
      btn.classList.remove('loading'); btn.disabled = false; await loadQueue();
    }
  }

  (async function init() {
    try {
      const meta = await api('GET', '/api/meta');
      S.roomTypes = meta.roomTypes; S.cfg = { warn: meta.lateWarnMinutes || 30, alert: meta.lateAlertMinutes || 60 };
      renderDetailEmpty();
      $('#queue').innerHTML = '<div class="skeleton" style="height:84px"></div><div class="skeleton" style="height:84px;margin-top:10px"></div><div class="skeleton" style="height:84px;margin-top:10px"></div>';
      await loadQueue();
      WG.stopLive = live(loadQueue, setLive);
    } catch (e) { if (!e.silent) toast(e.message, 'err'); }
  })();
};

/* ---- 40-admin.js ---- */
'use strict';
/* Management: measured analytics, an illustrative business case, the guest page content,
   settings, data imports and staff users. Measured figures and assumptions are never mixed. */
WG.views.admin = function (root, user) {
  const S = { tab: 'analytics', range: 'today', users: [], roomTypes: {}, imp: null, settings: null, content: null, editId: null, editLang: 'en' };
  const TABS = [['analytics', 'Analytics'], ['records', 'Records'], ['guest', 'Guest page'], ['settings', 'Settings'], ['data', 'Data'], ['users', 'Users']];

  root.innerHTML = `<div id="topbar"></div>
    <div class="ad-wrap"><nav class="ad-tabs" role="tablist" id="adTabs">${TABS.map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="false">${l}</button>`).join('')}</nav>
    <main id="adBody" aria-live="polite"></main></div>`;
  mountTopbar(user, 'Management');

  $('#adTabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
  function go(tab) {
    S.tab = tab; S.imp = null;
    $$('#adTabs button').forEach((b) => { b.classList.toggle('on', b.dataset.tab === tab); b.setAttribute('aria-selected', b.dataset.tab === tab); });
    ({ analytics, records, guest: guestPage, settings, data: dataTab, users })[tab]();
  }
  const body = () => $('#adBody');
  const err = (e) => { if (!e.silent) toast(e.message, 'err'); };
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '-');
  const tile = (label, value, sub, cls = '') => `<div class="metric ${cls}"><span>${label}</span><b>${value}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;

  /* ---------- analytics (measured) ---------- */
  async function analytics(quiet) {
    if (!quiet) body().innerHTML = '<div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:240px;margin-top:14px"></div>';
    try {
      const [m, st, sum] = await Promise.all([api('GET', `/api/metrics?range=${S.range}`), api('GET', '/api/admin/settings'), api('GET', '/api/admin/summary')]);
      S.settings = st.values;
      const rangeName = { today: 'Today', '7d': 'Last 7 days', '30d': 'Last 30 days' }[S.range];
      const warn = [];
      if (!sum.rooms) warn.push('No rooms yet. Import rooms (Data tab) so the Rooms Controller can assign them.');
      if (!sum.arrivalsToday) warn.push(`No reservations arriving today (${fmtDate(sum.today)}). Import today's arrivals (Data tab) so Reception can look guests up.`);
      if (st.placeholders && S.settings.guest_show_placeholders !== '0') warn.push(`${st.placeholders} resort sections on the guest page still show placeholder text. Edit them in the Guest page tab.`);
      body().innerHTML = `${warn.map((w) => `<div class="banner info">${icon('alert')}<span>${esc(w)}</span></div>`).join('')}
        <div class="ad-row"><h2 class="serif ad-h">Right now</h2></div>
        <div class="ad-cards">
          ${tile('Waiting for a room', m.stillWaitingForRoom)}
          ${tile('Longest wait now', m.stillWaitingForRoom ? fmtWait(m.longestActiveWaitSec) : '-', '', m.longestActiveWaitSec / 60 >= Number(S.settings.late_alert_minutes) ? 'hot' : '')}
          ${tile('Ready, guest not back', m.readyAwaitingGuest, '', 'good')}
          ${tile('Active records', m.active)}
        </div>
        <div class="ad-row"><h2 class="serif ad-h">${rangeName} <span class="measured">Measured</span></h2>
          <div class="seg" role="tablist" aria-label="Period">${[['today', 'Today'], ['7d', '7 days'], ['30d', '30 days']].map(([k, l]) => `<button role="tab" data-range="${k}" class="${S.range === k ? 'on' : ''}" aria-selected="${S.range === k}">${l}</button>`).join('')}</div></div>
        <div class="ad-cards">
          ${tile('Waiting guests', m.created, m.cancelled ? `${m.cancelled} cancelled, not counted` : '')}
          ${tile('Completed', m.completed)}
          ${tile('Avg. wait until room ready', fmtDuration(m.avgWaitToReadySec))}
          ${tile('Avg. room ready → guest back', fmtDuration(m.avgReadyToReturnSec))}
          ${tile('Guest saw "room ready"', m.readyCount ? `${fmtDuration(m.avgAwarenessSec)}` : '-', m.readyCount ? `avg. after ready · ${m.awareCount} of ${m.readyCount} guests looked` : 'no rooms ready yet')}
          ${tile('Guests who opened their QR page', pct(m.qrOpened, m.created), m.created ? `${m.qrOpened} of ${m.created}` : '')}
          ${tile('Avg. time to create a Waiting Guest', fmtDuration(m.avgCreateSec), 'Reception, from reservation to QR')}
          ${tile('Guest rating', m.feedbackCount ? `${m.avgRating} / 5` : '-', m.feedbackCount ? `${m.feedbackCount} response${m.feedbackCount === 1 ? '' : 's'} · status page helpful ${pct(m.helpfulYes, m.helpfulAnswered)}` : 'no feedback yet')}
        </div>
        <section class="card chart-card"><h3>Waiting guests by hour of arrival <small>${rangeName}, hotel time</small></h3>${barChart(m.hourly.map((v, h) => ({ label: String(h).padStart(2, '0') + ':00', short: h % 3 === 0 ? String(h).padStart(2, '0') : '', value: v })), 'hour')}</section>
        ${S.range !== 'today' ? `<section class="card chart-card"><h3>Waiting guests per day <small>${rangeName}</small></h3>${barChart(m.daily.map((d, i) => ({ label: fmtDate(d.date), short: (m.daily.length <= 7 || i % 5 === 0) ? new Date(d.date + 'T00:00:00').toLocaleDateString([], { day: 'numeric', month: 'short' }) : '', value: d.count })), 'day')}</section>` : ''}
        ${businessCase(m)}`;
      $$('[data-range]').forEach((b) => b.onclick = () => { S.range = b.dataset.range; analytics(); });
      wireCharts();
      wireBusinessCase(m);
    } catch (e) { err(e); }
  }

  /** Single-series column chart: thin bars from one baseline, peak labelled, hover tooltip, table view. */
  function barChart(points, unit) {
    // drawn at the real container width so bars and labels are never stretched
    const W = Math.max(300, Math.min(1080, (body().clientWidth || 720) - 40)), H = 190, padL = 30, padB = 24, padT = 16;
    const max = Math.max(1, ...points.map((p) => p.value));
    const step = max <= 5 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : max <= 50 ? 10 : Math.ceil(max / 5 / 10) * 10;
    const top = Math.ceil(max / step) * step;
    const y = (v) => padT + (H - padT - padB) * (1 - v / top);
    const slot = (W - padL) / points.length;
    const bw = Math.max(4, Math.min(24, slot - 2));
    const peak = points.reduce((a, p, i) => (p.value > points[a].value ? i : a), 0);
    const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
    const bars = points.map((p, i) => {
      const x = padL + slot * i + (slot - bw) / 2, h = y(0) - y(p.value), r = Math.min(4, h / 2);
      const path = p.value ? `M${x},${y(0)} V${y(p.value) + r} Q${x},${y(p.value)} ${x + r},${y(p.value)} H${x + bw - r} Q${x + bw},${y(p.value)} ${x + bw},${y(p.value) + r} V${y(0)} Z` : '';
      return `<g class="bar-g" data-tip="${esc(p.label)}: ${p.value} waiting guest${p.value === 1 ? '' : 's'}">
        <rect class="hit" x="${padL + slot * i}" y="${padT}" width="${slot}" height="${H - padT - padB}"></rect>
        ${path ? `<path class="bar" d="${path}"></path>` : ''}
        ${i === peak && p.value ? `<text class="peak" x="${x + bw / 2}" y="${y(p.value) - 5}" text-anchor="middle">${p.value}</text>` : ''}
        ${p.short ? `<text class="xl" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(p.short)}</text>` : ''}</g>`;
    }).join('');
    const total = points.reduce((a, p) => a + p.value, 0);
    return `<div class="chart" role="img" aria-label="${total} waiting guests, peak ${points[peak].value} at ${esc(points[peak].label)}">
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${ticks.map((v) => `<line class="grid" x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"></line><text class="yl" x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('')}${bars}</svg>
      <div class="tip" hidden></div></div>
      ${total ? '' : '<p class="muted chart-empty">No waiting guests in this period yet.</p>'}
      <details class="as-table"><summary>Show as table</summary><div class="table-wrap"><table class="tbl"><thead><tr><th>${unit === 'hour' ? 'Hour' : 'Day'}</th><th>Waiting guests</th></tr></thead><tbody>${points.map((p) => `<tr><td>${esc(p.label)}</td><td class="num">${p.value}</td></tr>`).join('')}</tbody></table></div></details>`;
  }
  function wireCharts() {
    $$('.chart').forEach((c) => {
      const tip = $('.tip', c);
      c.addEventListener('pointermove', (e) => {
        const g = e.target.closest('.bar-g');
        if (!g) { tip.hidden = true; return; }
        $$('.bar-g.hl', c).forEach((x) => x !== g && x.classList.remove('hl')); g.classList.add('hl');
        const r = c.getBoundingClientRect();
        tip.textContent = g.dataset.tip; tip.hidden = false;
        tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, e.clientX - r.left - tip.offsetWidth / 2)) + 'px';
        tip.style.top = Math.max(0, e.clientY - r.top - 40) + 'px';
      });
      c.addEventListener('pointerleave', () => { tip.hidden = true; $$('.bar-g.hl', c).forEach((x) => x.classList.remove('hl')); });
    });
  }

  /* ---------- business case (illustrative, from editable assumptions) ---------- */
  const BC = [
    ['bc_daily_checkins', 'Check-ins per day', ''],
    ['bc_waiting_pct', 'Share of check-ins that wait', '%'],
    ['bc_manual_minutes', 'Reception minutes per paper Waiting Card', 'min'],
    ['bc_digital_minutes', 'Reception minutes per digital Waiting Guest', 'min', 'blank = measured'],
    ['bc_print_pieces', 'Printed pieces per paper Waiting Card', ''],
    ['bc_print_cost', 'Cost per printed piece', 'AED'],
    ['bc_comm_minutes', 'Minutes of manual follow-up per waiting guest', 'min'],
    ['bc_qr_adoption_pct', 'Guests who follow the QR page', '%', 'blank = measured'],
  ];
  function bcCalc(v, m) {
    const n = (k) => (v[k] === '' || v[k] == null ? null : Number(v[k]));
    const measuredDigital = m.avgCreateSec != null ? m.avgCreateSec / 60 : null;
    const measuredAdoption = m.created ? (m.qrOpened / m.created) * 100 : null;
    const perDay = n('bc_daily_checkins') != null && n('bc_waiting_pct') != null ? n('bc_daily_checkins') * n('bc_waiting_pct') / 100 : null;
    const digital = n('bc_digital_minutes') != null ? n('bc_digital_minutes') : measuredDigital;
    const adoption = n('bc_qr_adoption_pct') != null ? n('bc_qr_adoption_pct') : measuredAdoption;
    const out = { perDay, digital, digitalMeasured: n('bc_digital_minutes') == null && measuredDigital != null, adoption, adoptionMeasured: n('bc_qr_adoption_pct') == null && measuredAdoption != null };
    out.deskMin = perDay != null && n('bc_manual_minutes') != null && digital != null ? perDay * Math.max(0, n('bc_manual_minutes') - digital) : null;
    out.printAed = perDay != null && n('bc_print_pieces') != null && n('bc_print_cost') != null ? perDay * n('bc_print_pieces') * n('bc_print_cost') : null;
    out.printPieces = perDay != null && n('bc_print_pieces') != null ? perDay * n('bc_print_pieces') : null;
    out.commMin = perDay != null && n('bc_comm_minutes') != null && adoption != null ? perDay * n('bc_comm_minutes') * adoption / 100 : null;
    return out;
  }
  const hrs = (min) => (min == null ? null : min >= 60 ? `${(min / 60).toFixed(min >= 600 ? 0 : 1)} h` : `${Math.round(min)} min`);
  const aed = (x) => (x == null ? null : 'AED ' + Math.round(x).toLocaleString());
  function bcOutputs(c) {
    const need = (what) => `<span class="need">Enter ${what}</span>`;
    const row = (label, day, fmt, needWhat) => `<tr><th scope="row">${label}</th>${day == null ? `<td colspan="3">${need(needWhat)}</td>` : `<td>${fmt(day)}</td><td>${fmt(day * 30)}</td><td>${fmt(day * 365)}</td>`}</tr>`;
    return `<table class="tbl bc-out"><thead><tr><th></th><th>Per day</th><th>Per month</th><th>Per year</th></tr></thead><tbody>
      ${row('Waiting guests (potential)', c.perDay, (x) => Math.round(x).toLocaleString(), 'check-ins and waiting share')}
      ${row('Reception time recovered', c.deskMin, hrs, 'minutes per paper card' + (c.digital == null ? ' and per digital record' : ''))}
      ${row('Follow-up time avoided', c.commMin, hrs, 'follow-up minutes' + (c.adoption == null ? ' and QR adoption' : ''))}
      ${row('Printed pieces avoided', c.printPieces, (x) => Math.round(x).toLocaleString(), 'printed pieces per card')}
      ${row('Printing cost avoided', c.printAed, aed, 'pieces per card and cost per piece')}
    </tbody></table>
    <p class="bc-basis">${c.digitalMeasured ? `Digital time uses the measured average (${c.digital.toFixed(1)} min). ` : ''}${c.adoptionMeasured ? `QR adoption uses the measured rate (${Math.round(c.adoption)}%). ` : ''}Months are 30 days.</p>`;
  }
  function businessCase(m) {
    const v = S.settings;
    return `<section class="card bc" id="bc"><div class="bc-head"><h2 class="serif">Business case</h2><span class="illustrative">Illustrative · based on current assumptions</span></div>
      <p class="muted">These figures are estimates from the assumptions below, not measured hotel results. Replace each assumption with the hotel's own numbers. Measured figures are shown above and never mixed in, except where an assumption is left blank and says "measured".</p>
      <div class="bc-grid">
        <form id="bcForm" class="bc-in">${BC.map(([k, label, unit, hint]) => `<label class="field"><span>${label}${hint ? ` <em class="opt">(${hint})</em>` : ''}</span><div class="unit-in"><input class="in num" id="${k}" name="${k}" inputmode="decimal" value="${esc(v[k])}" placeholder="${hint ? 'measured' : 'not set'}">${unit ? `<i>${unit}</i>` : ''}</div></label>`).join('')}
          <div class="actions"><button class="btn btn-primary" id="bcSave" type="submit">Save assumptions</button></div></form>
        <div class="bc-res" id="bcRes">${bcOutputs(bcCalc(v, m))}</div>
      </div>
      <p class="bc-note">No physical Waiting Card is printed in the new process. The printing figures show what the hotel no longer spends, once the real cost per piece is entered.</p></section>`;
  }
  function wireBusinessCase(m) {
    const form = $('#bcForm'); if (!form) return;
    const read = () => { const v = Object.assign({}, S.settings); BC.forEach(([k]) => { v[k] = $('#' + k).value.trim(); }); return v; };
    form.addEventListener('input', () => { $('#bcRes').innerHTML = bcOutputs(bcCalc(read(), m)); });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

  function modalForm(title, inner, submitLabel, onSubmit, danger) {
    const ov = document.createElement('div');

    document.body.appendChild(ov);
    const close = () => { ov.remove(); document.removeEventListener('keydown', key); };
    const key = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', key);
    $('[data-r="0"]', ov).onclick = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    ov.querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const b = $('#mfGo', ov); b.classList.add('loading'); $('#mfErr', ov).hidden = true;

    return ov;

  /* ---------- CSV import (arrivals or rooms) ---------- */
  function importer(kind, host) {
    const body = () => host;
    const isArr = kind === 'arrivals';
    const base = isArr ? '/api/import/arrivals' : '/api/import/rooms';
    S.imp = { csv: '', map: null, replaceAll: false };
    body().innerHTML = `<div class="card panel"><h2 class="serif">${isArr ? "Import today's arrivals" : 'Import rooms'}</h2>
      <p class="muted">${isArr ? 'Export the arrivals report from Opera and save it as <b>CSV</b> (in Excel: File → Save As → CSV). Dates are read day first (dd/mm/yyyy).' : 'Upload a CSV of rooms with room number, room type, and optionally building, floor and housekeeping status.'} Nothing is saved until you review the preview and confirm.</p>
      <div class="drop" id="drop"><input type="file" id="file" accept=".csv,.txt,text/csv" class="sr-only"><label for="file" class="btn btn-ghost">${icon('upload')} Choose CSV file</label><span class="muted" id="fname">or paste the contents below</span></div>
      <textarea class="in mono" id="paste" rows="5" placeholder="Paste CSV text here" spellcheck="false"></textarea>
      <div class="actions"><button class="btn btn-primary" id="previewBtn">Preview</button></div>
      <div id="impOut"></div></div>`;
    $('#file').addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 2_000_000) return toast('File is too large (max about 2 MB)', 'err');
      $('#paste').value = await f.text(); $('#fname').textContent = f.name;
    });
    $('#previewBtn').onclick = () => preview();
    async function preview(map) {
      const csv = $('#paste').value;
      if (!csv.trim()) return toast('Choose a file or paste CSV first', 'err');
      const b = $('#previewBtn'); b.classList.add('loading');
      try {
        S.imp.csv = csv; S.imp.map = map || null;
        const p = await api('POST', base + '/preview', { csv, map: map || undefined });
        renderPreview(p);
      } catch (e) { err(e); } finally { b.classList.remove('loading'); }
    }
    function renderPreview(p) {
      const sel = (f) => `<label class="field"><span>${esc(f.label)}${f.required ? ' *' : ''}</span><select class="in mapSel" data-key="${f.key}"><option value="">(not in file)</option>${p.headers.map((h, i) => `<option value="${i}" ${p.map[f.key] === i ? 'selected' : ''}>${esc(h || 'Column ' + (i + 1))}</option>`).join('')}</select></label>`;
      const canImport = !p.missing.length && p.validCount > 0;
      $('#impOut').innerHTML = `<hr><div class="section-label">Columns found (header on line ${p.headerLine})</div>
        <details ${p.missing.length ? 'open' : ''} class="map"><summary>${p.missing.length ? `<b style="color:var(--danger)">Required columns missing: ${p.missing.map(esc).join(', ')}. Match them below.</b>` : 'Review or change column matching'}</summary>
        <div class="form-grid" style="margin-top:12px">${p.fields.map(sel).join('')}</div><div class="actions"><button class="btn btn-ghost btn-sm" id="remap">Re-check with these columns</button></div></details>
        <div class="ad-cards" style="margin-top:12px"><div class="metric good"><span>Valid rows</span><b>${p.validCount}</b></div><div class="metric ${p.errorCount ? 'hot' : ''}"><span>Rows with errors</span><b>${p.errorCount}</b></div><div class="metric"><span>Warnings</span><b>${p.warningCount}</b></div></div>
        ${p.errorCount ? `<div class="banner err" style="margin-top:12px"><span><b>These rows will be skipped:</b><br>${p.errors.map((x) => `Line ${x.line}: ${esc(x.message)}`).join('<br>')}${p.errorCount > p.errors.length ? `<br>…and ${p.errorCount - p.errors.length} more` : ''}</span></div>` : ''}
        ${p.warningCount ? `<div class="banner info" style="margin-top:10px"><span>${p.warnings.map((x) => `Line ${x.line}: ${esc(x.message)}`).join('<br>')}</span></div>` : ''}
        ${p.sample.length ? `<div class="section-label" style="margin-top:14px">First rows as they will be saved</div><div style="overflow:auto"><table class="tbl"><thead><tr>${Object.keys(p.sample[0]).map((k) => `<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${p.sample.map((r) => `<tr>${Object.keys(r).map((k) => `<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
        ${isArr ? `<label class="toggle" style="margin-top:14px"><input type="checkbox" id="replaceAll"> Replace all existing reservations (removes older ones)</label>` : ''}
        <div class="actions"><button class="btn btn-primary" id="commitBtn" ${canImport ? '' : 'disabled'}>Import ${p.validCount} row${p.validCount === 1 ? '' : 's'}${p.errorCount ? ' (skip errors)' : ''}</button></div>`;
      const rm = $('#remap'); if (rm) rm.onclick = () => { const map = {}; $$('.mapSel').forEach((s) => { map[s.dataset.key] = s.value === '' ? -1 : Number(s.value); }); preview(map); };
      $('#commitBtn').onclick = async () => {
        const replaceAll = isArr && $('#replaceAll').checked;
        const ok = await confirmDialog({ title: `Import ${p.validCount} row${p.validCount === 1 ? '' : 's'}?`, body: replaceAll ? '<b>All existing reservations will be replaced.</b> Waiting Guests already created are not affected.' : 'Existing rows with the same key are updated; new ones are added.', confirmLabel: 'Import' });
        if (!ok) return;
        const b = $('#commitBtn'); b.classList.add('loading');
        try {
          const r = await api('POST', base, { csv: S.imp.csv, map: S.imp.map || undefined, allowErrors: true, replaceAll });
          toast(`Imported: ${r.added} added, ${r.updated} updated${r.skipped ? `, ${r.skipped} skipped` : ''}`);
          go('analytics');
        } catch (e) { b.classList.remove('loading'); err(e); }
      };
    }
  }

  /* ---------- users ---------- */
  async function users() {
    body().innerHTML = '<div class="skeleton" style="height:120px"></div>';
    try {
      S.users = (await api('GET', '/api/users')).users;
      body().innerHTML = `<div class="card panel"><h2 class="serif">Staff users</h2>
        <p class="muted">Passwords are generated for you and shown once. Share them privately; staff can change them from the top bar.</p>
        <div style="overflow:auto"><table class="tbl"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
        ${S.users.map((u) => `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td>${esc(ROLE_NAME[u.role] || u.role)}</td><td>${u.active ? '<span class="pill st-ready">Active</span>' : '<span class="pill st-completed">Inactive</span>'}</td>
          <td class="row-acts"><button class="btn btn-ghost btn-sm" data-uedit="${u.id}">Edit</button><button class="btn btn-ghost btn-sm" data-reset="${u.id}">Reset password</button><button class="btn btn-ghost btn-sm" data-active="${u.id}" data-to="${u.active ? 0 : 1}">${u.active ? 'Deactivate' : 'Activate'}</button>${u.id === user.id ? '' : `<button class="btn btn-ghost btn-sm btn-danger" data-udel="${u.id}">Delete</button>`}</td></tr>`).join('')}</tbody></table></div>
        <hr><h3 class="serif" style="font-size:18px">Add a user</h3>
        <form id="newUser" class="form-grid" style="margin-top:12px">
          <label class="field"><span>Full name</span><input class="in" id="nuName" maxlength="80" required></label>
          <label class="field"><span>Username</span><input class="in" id="nuUser" maxlength="32" autocapitalize="none" required></label>
          <label class="field"><span>Role</span><select class="in" id="nuRole"><option value="reception">Reception</option><option value="rooms_controller">Rooms Controller</option><option value="admin">Admin</option></select></label>
          <div class="field"><span>&nbsp;</span><button class="btn btn-primary" type="submit" id="nuGo">${icon('plus')} Create user</button></div></form></div>`;
      $('#newUser').addEventListener('submit', async (e) => {
        e.preventDefault(); const b = $('#nuGo'); b.classList.add('loading');
        try { const r = await api('POST', '/api/users', { name: $('#nuName').value, username: $('#nuUser').value, role: $('#nuRole').value }); await shownPassword(`User created: ${r.user.username}`, r.password); users(); }
        catch (ex) { b.classList.remove('loading'); err(ex); }
      });
      body().onclick = async (e) => {
        const r = e.target.closest('[data-reset]'), a = e.target.closest('[data-active]');
        const ue = e.target.closest('[data-uedit]'), ud = e.target.closest('[data-udel]');
        if (ue) {
          const u = S.users.find((x) => x.id === Number(ue.dataset.uedit));
          modalForm(`Edit ${u.username}`, `<div class="form-grid"><label class="field"><span>Full name</span><input class="in" id="uName" maxlength="80" value="${esc(u.name)}"></label>
            <label class="field"><span>Role</span><select class="in" id="uRole">${[['reception', 'Reception'], ['rooms_controller', 'Rooms Controller'], ['admin', 'Admin']].map(([k, l]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
            <p class="muted small">Changing the role signs this person out; the new role applies when they sign in again.</p>`,
          'Save', async (ov) => { await api('POST', `/api/users/${u.id}/update`, { name: $('#uName', ov).value, role: $('#uRole', ov).value }); toast('User updated'); users(); });
        }
        if (ud) {
          const u = S.users.find((x) => x.id === Number(ud.dataset.udel));
          modalForm(`Delete ${u.username}?`, `<p>This removes <b>${esc(u.name)}</b>'s login permanently. Their past actions stay in the records. To stop access temporarily, use <b>Deactivate</b> instead.</p>
            <label class="field"><span>Type ${esc(u.username)} to confirm</span><input class="in" id="udConf" autocomplete="off" autocapitalize="none"></label>`,
          'Delete user', async (ov) => {
            if ($('#udConf', ov).value.trim().toLowerCase() !== u.username.toLowerCase()) throw new Error(`Type ${u.username} to confirm`);
            await api('POST', `/api/users/${u.id}/delete`, {}); toast(`${u.username} deleted`); users();
          }, true);
        }
        if (r) {
          const u = S.users.find((x) => x.id === Number(r.dataset.reset));
          if (!(await confirmDialog({ title: `Reset password for ${u.username}?`, body: 'Their current password stops working and they are signed out.', confirmLabel: 'Reset' }))) return;
          try { const out = await api('POST', `/api/users/${u.id}/reset-password`, {}); await shownPassword(`New password for ${u.username}`, out.password); } catch (ex) { err(ex); }
        }
        if (a) { try { await api('POST', `/api/users/${a.dataset.active}/active`, { active: a.dataset.to === '1' }); users(); } catch (ex) { err(ex); } }
      };
    } catch (e) { err(e); }
  }
  function shownPassword(title, pw) {
    return dialog({ title, body: `<p>Copy this password now. It is <b>not shown again</b>.</p><div class="pw-box" id="pwShow">${esc(pw)}</div>`, confirmLabel: 'I have copied it', cancelLabel: '' });
  }

  /* ---------- export ---------- */
  function exportView(host) {
    const body = () => host;
    body().innerHTML = `<div class="card panel"><h2 class="serif">Export Waiting Guests</h2>
      <p class="muted">Every Waiting Guest with all timestamps (created, room assigned, preparation started, room ready, guest notified, guest returned, completed). Use it to compare the digital process with the old manual one. Contains guest names: handle it as confidential.</p>
      <div class="actions"><button class="btn btn-primary" id="exGo">${icon('download')} Download CSV</button></div></div>`;
    $('#exGo').onclick = async () => {
      const b = $('#exGo'); b.classList.add('loading');
      try {
        const { csv } = await api('GET', '/api/export/waiting-guests');
        const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
        const a = document.createElement('a'); a.href = url; a.download = `waiting-guests-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch (e) { err(e); } finally { b.classList.remove('loading'); }
    };
  }

  (async function init() {
    try { S.roomTypes = (await api('GET', '/api/meta')).roomTypes; } catch (e) { err(e); }
    go('analytics');
    WG.stopLive = live(() => { if (S.tab === 'analytics' && !document.querySelector('#bcForm:focus-within')) analytics(true); }, setLive, { baseMs: 8000 });
  })();
};
