<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Waiting Guest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>

/* Design tokens are inherited from Room Guide (same hospitality product family). */
:root {
  --paper: #F7F5F1;
  --panel: #FFFFFF;
  --ink: #2B2118;
  --ink-soft: #6B5D4F;
  --line: #E6DFD3;
  --bronze: #6B4E33;
  --bronze-deep: #4F3A26;
  --bronze-soft: #EFE4D2;
  --gold-accent: #C9A24B;
  --shadow: 0 10px 28px rgba(43, 33, 24, 0.09);
  --shadow-sm: 0 3px 10px rgba(43, 33, 24, 0.08);
  --danger: #B0532E;
  --danger-soft: #F6E4DD;

  /* Waiting Guest status palette (evolved from Room Guide's room-type colours) */
  --s-waiting: #B57A12;   --s-waiting-bg: #FBF0D6;
  --s-assigned: #3D6FA8;  --s-assigned-bg: #E3EDF8;
  --s-preparing: #7A55A3; --s-preparing-bg: #EFE7F7;
  --s-ready: #2F7F5A;     --s-ready-bg: #DDF1E6;
  --s-returned: #23695C;  --s-returned-bg: #D9EEEA;
  --s-completed: #6E747B; --s-completed-bg: #ECEDEF;

  --radius: 12px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html[data-theme="dark"] {
  --paper: #191510; --panel: #221C15; --ink: #EEE7DC; --ink-soft: #AB9C8B; --line: #382E23;
  --bronze: #D2AC76; --bronze-deep: #E7C98F; --bronze-soft: #33291C; --gold-accent: #E3B23C;
  --shadow: 0 10px 28px rgba(0,0,0,.35); --shadow-sm: 0 3px 10px rgba(0,0,0,.3);
  --danger: #E08052; --danger-soft: #3A2419;
  --s-waiting: #E3B23C;   --s-waiting-bg: #3A2E14;
  --s-assigned: #7FAEE0;  --s-assigned-bg: #1D2C40;
  --s-preparing: #B995DC; --s-preparing-bg: #2E2340;
  --s-ready: #6FCB9C;     --s-ready-bg: #17372A;
  --s-returned: #63C2B0;  --s-returned-bg: #16332E;
  --s-completed: #A3A9B0; --s-completed-bg: #2B2E31;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); transition: background .2s ease, color .2s ease; }
body { font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
button { font-family: inherit; }
h1, h2, h3 { margin: 0; }
.serif { font-family: "Source Serif 4", Georgia, serif; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-soft); }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- Top bar (same structure as Room Guide) ---------- */
header.topbar { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; box-shadow: var(--shadow-sm); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 24px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo-chip { background: #fff; border-radius: 6px; padding: 4px 8px; display: flex; align-items: center; box-shadow: var(--shadow-sm); }
.logo-chip img { height: 26px; display: block; }
.brand .divider { width: 1px; height: 26px; background: var(--line); }
.wordmark { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 19px; letter-spacing: .01em; white-space: nowrap; }
.tagline { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; margin-top: 1px; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.user-chip { font-size: 12.5px; color: var(--ink-soft); padding-right: 4px; }
.user-chip b { color: var(--ink); font-weight: 700; }
.live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
.live-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--s-ready); box-shadow: 0 0 0 0 var(--s-ready); animation: pulse 2s infinite; }
.live-dot.off::before { background: var(--danger); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--s-ready) 55%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ---------- Buttons ---------- */
.text-btn, .icon-btn { border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; font-weight: 600; transition: border-color .15s, color .15s, background .15s, transform .1s; }
.text-btn { padding: 8px 14px; border-radius: 18px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.text-btn:hover, .icon-btn:hover { border-color: var(--bronze); color: var(--bronze-deep); }
.btn { border: 1px solid transparent; border-radius: 10px; padding: 11px 18px; min-height: 44px; font-size: 13.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .1s, box-shadow .15s, opacity .15s; text-decoration: none; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn-primary { background: var(--bronze); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--bronze-deep); }
html[data-theme="dark"] .btn-primary { color: #1b140c; }
.btn-ghost { background: var(--paper); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { border-color: var(--bronze); color: var(--bronze-deep); }
.btn-ready { background: var(--s-ready); color: #fff; }
.btn-ready:hover:not(:disabled) { filter: brightness(.92); }
html[data-theme="dark"] .btn-ready { color: #0d2418; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { min-height: 34px; padding: 6px 12px; font-size: 12.5px; border-radius: 9px; }
.btn.loading { position: relative; color: transparent !important; pointer-events: none; }
.btn.loading::after { content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid #fff; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span, .label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); }
.field .opt { font-weight: 500; text-transform: none; letter-spacing: 0; }
input.in, textarea.in, select.in { border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 11px 12px; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 500; width: 100%; min-height: 44px; transition: border-color .15s, box-shadow .15s; }
textarea.in { resize: vertical; min-height: 64px; }
.in:focus { outline: none; border-color: var(--bronze); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bronze) 18%, transparent); }
.in[aria-invalid="true"] { border-color: var(--danger); }
.field-error { font-size: 12px; color: var(--danger); }
.search-box { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 26px; padding: 4px 8px 4px 18px; background: var(--panel); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s; }
.search-box:focus-within { border-color: var(--bronze); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bronze) 16%, transparent); }
.search-box input { flex: 1; border: none; background: transparent; outline: none; font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); min-height: 46px; min-width: 0; }
.search-box input::placeholder { color: var(--ink-soft); font-weight: 400; }
kbd { font: inherit; font-size: 10px; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

/* ---------- Cards / pills / banners ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); }
.section-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 14px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-waiting { color: var(--s-waiting); background: var(--s-waiting-bg); }
.st-room_assigned { color: var(--s-assigned); background: var(--s-assigned-bg); }
.st-preparing { color: var(--s-preparing); background: var(--s-preparing-bg); }
.st-ready { color: var(--s-ready); background: var(--s-ready-bg); }
.st-returned { color: var(--s-returned); background: var(--s-returned-bg); }
.st-completed { color: var(--s-completed); background: var(--s-completed-bg); }
.type-pill { background: var(--bronze-soft); color: var(--bronze-deep); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; letter-spacing: .02em; }
.banner { padding: 10px 14px; border-radius: 10px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.banner.err { background: var(--danger-soft); color: var(--danger); }
.banner.info { background: var(--bronze-soft); color: var(--bronze-deep); }
.empty { text-align: center; padding: 36px 20px; color: var(--ink-soft); }
.empty svg { width: 40px; height: 40px; stroke-width: 1.5; opacity: .7; margin-bottom: 8px; }
.empty b { display: block; color: var(--ink); font-family: "Source Serif 4", Georgia, serif; font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.skeleton { background: linear-gradient(90deg, var(--line), color-mix(in srgb, var(--line) 40%, var(--panel)), var(--line)); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 18px; }
.kv > div > span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
.kv > div > b { font-weight: 600; font-size: 13.5px; word-break: break-word; }

/* ---------- Toast ---------- */
#toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(92vw, 420px); pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow); animation: toastIn .3s var(--ease); display: flex; gap: 10px; align-items: center; }
.toast.err { background: var(--danger); color: #fff; }
.toast.out { opacity: 0; transform: translateY(8px); transition: all .3s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.97); } }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(25, 20, 14, .5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade .2s; }
.modal-box { background: var(--panel); border-radius: 16px; padding: 26px; max-width: 420px; width: 100%; box-shadow: var(--shadow); animation: rise .25s var(--ease); }
.modal-box h2 { font-family: "Source Serif 4", Georgia, serif; font-size: 21px; font-weight: 600; margin-bottom: 6px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }

/* ---------- Auth ---------- */
.auth-gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-card { padding: 36px 34px 30px; width: 100%; max-width: 360px; text-align: center; animation: rise .4s var(--ease); }
.auth-logo { background: #fff; display: inline-flex; padding: 8px 14px; border-radius: 8px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
.auth-logo img { height: 32px; }
.auth-card h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 24px; margin-bottom: 4px; }
.auth-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 22px; }
.auth-card form { display: flex; flex-direction: column; gap: 14px; text-align: left; }

/* Admin + shared additions */
.linkish { background: none; border: none; padding: 0; font: inherit; color: var(--bronze-deep); font-weight: 700; text-decoration: underline; cursor: pointer; }
.btn-danger { color: var(--danger); }
.btn-danger:hover:not(:disabled) { border-color: var(--danger) !important; color: var(--danger) !important; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
code { background: var(--bronze-soft); padding: 1px 6px; border-radius: 5px; font-size: 12px; word-break: break-all; }
.ad-wrap { max-width: 1100px; margin: 0 auto; padding: 18px 24px 48px; }
.ad-tabs { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.ad-tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .13s; }
.ad-tabs button:hover { border-color: var(--bronze); }
.ad-tabs button.on { background: var(--bronze); border-color: var(--bronze); color: #fff; }
html[data-theme="dark"] .ad-tabs button.on { color: #1b140c; }
.ad-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ad-h { font-size: 19px; font-weight: 600; margin: 26px 0 10px; }
.panel { padding: 22px; animation: rise .3s var(--ease); }
.panel h2 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
.panel hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .ad-wrap { padding: 14px 16px 40px; } }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.drop { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 14px 0 10px; }
details.map summary { cursor: pointer; font-size: 13px; }
.pw-box { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 22px; font-weight: 700; letter-spacing: .04em; background: var(--bronze-soft); color: var(--bronze-deep); padding: 14px; border-radius: 10px; text-align: center; margin-top: 10px; user-select: all; word-break: break-all; }
.metrics-note { font-size: 12px; }
.metric { flex: 1 0 140px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow-sm); }
.metric span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.metric b { font-family: "Source Serif 4", Georgia, serif; font-size: 26px; font-weight: 600; line-height: 1.2; }
.metric.hot b { color: var(--danger); } .metric.good b { color: var(--s-ready); }

.rc-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; max-width: 1240px; margin: 0 auto; padding: 24px; align-items: start; }
.rc-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hint { font-size: 12.5px; padding: 0 6px; }
.rc-side { position: sticky; top: 84px; max-height: calc(100vh - 100px); display: flex; flex-direction: column; }
.side-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
.side-head h2 { font-size: 19px; font-weight: 600; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 2px; }
.seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
.seg button.on { background: var(--bronze); color: #fff; }
html[data-theme="dark"] .seg button.on { color: #1b140c; }
#list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 2px 8px; }

.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 14px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; color: inherit; font: inherit; transition: border-color .15s, box-shadow .15s, transform .15s; }
.row:hover { border-color: var(--bronze); box-shadow: var(--shadow-sm); }
.row.sel { border-color: var(--bronze); box-shadow: 0 0 0 2px color-mix(in srgb, var(--bronze) 25%, transparent); }
.row .top { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.row .wg { font-weight: 800; letter-spacing: .01em; }
.row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { grid-column: 1 / 2; font-size: 12px; color: var(--ink-soft); }
.row .end { grid-row: 1 / 3; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; justify-content: center; }
.row .t { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.row.res .wg { color: var(--bronze-deep); }
.row.flash { animation: flash 1.4s var(--ease); }
@keyframes flash { 0% { background: var(--bronze-soft); } }
.group-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 4px 4px 0; }
#results { display: flex; flex-direction: column; gap: 8px; }

.panel { padding: 22px; animation: rise .3s var(--ease); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.panel-head h2 { font-size: 24px; font-weight: 600; }
.panel hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.auto-note { font-size: 12px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; margin: 4px 0 14px; }
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.actions .btn-primary { flex: 1; min-width: 220px; font-size: 15px; min-height: 50px; }

.success { text-align: center; padding: 28px 22px 24px; animation: rise .35s var(--ease); }
.success .tick { width: 54px; height: 54px; border-radius: 50%; background: var(--s-ready-bg); color: var(--s-ready); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; animation: pop .5s var(--ease); }
.success .tick svg { width: 26px; height: 26px; stroke-width: 2.6; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.big-wg { font-family: "Source Serif 4", Georgia, serif; font-size: 52px; font-weight: 600; letter-spacing: .02em; line-height: 1.05; color: var(--bronze-deep); margin: 4px 0; }
.qr { width: 220px; max-width: 70vw; margin: 14px auto 6px; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); }
.qr svg { width: 100%; height: auto; display: block; }
.link-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }

.timeline { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0; }
.timeline li { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; padding: 6px 0; position: relative; font-size: 13px; }
.timeline li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--bronze); margin-top: 5px; box-shadow: 0 0 0 3px var(--bronze-soft); }
.timeline li::after { content: ""; position: absolute; left: 4px; top: 20px; bottom: -6px; width: 1px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline .when { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.verify { background: var(--bronze-soft); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.verify .kv > div > b { font-size: 15px; }
.ready-note { background: var(--s-ready-bg); color: var(--s-ready); padding: 10px 14px; border-radius: 10px; font-weight: 700; margin-bottom: 14px; display: flex; gap: 8px; align-items: center; }

@media (max-width: 960px) {
  .rc-wrap { grid-template-columns: 1fr; padding: 16px; }
  .rc-side { position: static; max-height: none; }
  .topbar-inner { padding: 10px 16px; }
}
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .big-wg { font-size: 42px; } }

.metrics { display: flex; gap: 10px; padding: 14px 24px 0; overflow-x: auto; scrollbar-width: none; max-width: 1500px; margin: 0 auto; }
.metrics::-webkit-scrollbar { display: none; }
.filters { display: flex; gap: 8px; padding: 12px 24px; flex-wrap: wrap; max-width: 1500px; margin: 0 auto; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); padding: 6px 13px; border-radius: 16px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .13s; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { border-color: var(--bronze); }
.chip.on { background: var(--bronze); border-color: var(--bronze); color: #fff; }
html[data-theme="dark"] .chip.on { color: #1b140c; }
.chip i { font-style: normal; opacity: .75; font-variant-numeric: tabular-nums; }

.rc-body { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; max-width: 1500px; margin: 0 auto; padding: 0 24px 40px; align-items: start; }
#queue { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* queue card: dense, timer-first */
.q { --c: var(--s-waiting); display: grid; grid-template-columns: 5px 118px minmax(0, 1fr) auto; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; width: 100%; color: inherit; font: inherit; padding: 0; box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s, transform .15s; animation: rise .3s var(--ease); }
.q:hover { border-color: var(--bronze); box-shadow: var(--shadow); }
.q.sel { border-color: var(--bronze); box-shadow: 0 0 0 2px color-mix(in srgb, var(--bronze) 30%, transparent), var(--shadow); }
.q.s-waiting { --c: var(--s-waiting); } .q.s-room_assigned { --c: var(--s-assigned); } .q.s-preparing { --c: var(--s-preparing); }
.q.s-ready { --c: var(--s-ready); } .q.s-returned { --c: var(--s-returned); }
.q .bar { background: var(--c); }
.q.pri .bar { background: repeating-linear-gradient(45deg, var(--danger) 0 6px, var(--c) 6px 12px); }
.q .timer { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 6px; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--c) 7%, var(--panel)); }
.q .timer b { font-family: "Source Serif 4", Georgia, serif; font-size: 30px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.q .timer small { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); margin-top: 5px; }
.q.late1 .timer b { color: var(--s-waiting); } .q.late2 .timer b { color: var(--danger); }
.q.s-ready .timer b, .q.s-returned .timer b { color: var(--s-ready); }
.q .main { padding: 10px 14px; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.q .l1 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.q .wg { font-weight: 800; font-size: 15px; letter-spacing: .01em; }
.q .nm { font-weight: 700; font-size: 15px; }
.q .l2 { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); align-items: center; }
.q .l2 span { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.q .l2 svg { width: 13px; height: 13px; }
.q .l3 { font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; }
.q .note { background: var(--bronze-soft); color: var(--bronze-deep); padding: 2px 8px; border-radius: 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q .note.rem { background: var(--s-waiting-bg); color: var(--s-waiting); }
.q .side { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 8px; padding: 10px 14px; }
.q .room { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 20px; }
.q .room.none { font-family: inherit; font-size: 12px; color: var(--ink-soft); font-weight: 500; }
.q .flag { color: var(--danger); font-weight: 800; font-size: 10.5px; letter-spacing: .08em; }
.q-new { animation: newrow 1.6s var(--ease); }
@keyframes newrow { 0% { background: var(--bronze-soft); transform: translateY(-6px); } }

/* detail column (mirrors Room Guide's right-hand detail panel) */
.detail { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; }
.d-card { padding: 20px; animation: rise .25s var(--ease); }
.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.d-head h2 { font-family: "Source Serif 4", Georgia, serif; font-size: 26px; font-weight: 600; }
.d-sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
.d-sec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.d-time { text-align: center; padding: 14px; border-radius: 12px; background: var(--bronze-soft); margin-bottom: 4px; }
.d-time b { font-family: "Source Serif 4", Georgia, serif; font-size: 38px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.d-time span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; }
.pref-box { background: var(--bronze-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 8px; }
.pref-box.rem { background: var(--s-waiting-bg); }
.pref-box span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.steps { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.step { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-soft); padding: 3px 0; }
.step .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); margin-left: 4px; }
.step.done { color: var(--ink); } .step.done .dot { background: var(--s-ready); border-color: var(--s-ready); }
.step.now { color: var(--ink); font-weight: 700; } .step.now .dot { border-color: var(--bronze); background: var(--bronze-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bronze) 20%, transparent); }
.step .ts { font-size: 12px; font-variant-numeric: tabular-nums; }
.act { display: flex; flex-direction: column; gap: 8px; }
.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; max-height: 240px; overflow-y: auto; padding: 2px; }
.rm { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 6px; cursor: pointer; text-align: center; font: inherit; color: inherit; transition: border-color .15s, background .15s; min-height: 44px; }
.rm:hover { border-color: var(--bronze); }
.rm.on { background: var(--bronze); border-color: var(--bronze); color: #fff; }
html[data-theme="dark"] .rm.on { color: #1b140c; }
.rm b { display: block; font-size: 15px; }
.rm small { display: block; font-size: 10px; opacity: .8; }
.rm.other { opacity: .75; }
.hk-dirty small { color: var(--danger); } .rm.on small { color: inherit; }
.legend-note { font-size: 11.5px; color: var(--ink-soft); margin: 6px 0 0; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.detail-empty { padding: 36px 20px; }

@media (max-width: 1100px) {
  .rc-body { grid-template-columns: 1fr; padding: 0 16px 40px; }
  .detail { position: fixed; inset: auto 0 0 0; max-height: 86vh; z-index: 60; border-radius: 18px 18px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.25); background: var(--panel); transform: translateY(105%); transition: transform .3s var(--ease); }
  .detail.open { transform: none; }
  .detail-close { display: inline-flex !important; }
  .metrics, .filters { padding-left: 16px; padding-right: 16px; }
}
@media (max-width: 640px) {
  .q { grid-template-columns: 5px 84px minmax(0, 1fr); }
  .q .side { grid-column: 3; flex-direction: row; justify-content: space-between; align-items: center; padding-top: 0; }
  .q .timer b { font-size: 24px; }
}
.detail-close { display: none; }

body { background: var(--paper); }
.g-shell { max-width: 520px; margin: 0 auto; padding: 0 16px calc(28px + env(safe-area-inset-bottom)); min-height: 100vh; display: flex; flex-direction: column; }
.g-top { display: flex; justify-content: center; padding: calc(18px + env(safe-area-inset-top)) 0 16px; }
.g-foot { text-align: center; color: var(--ink-soft); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-top: auto; padding-top: 28px; }

.hero { border-radius: 24px; padding: 30px 22px 26px; text-align: center; color: #fff; background: linear-gradient(155deg, #6B4E33 0%, #4F3A26 100%); box-shadow: var(--shadow); position: relative; overflow: hidden; transition: background .6s var(--ease); animation: rise .5s var(--ease); }
.hero::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(201,162,75,.35), transparent 65%); pointer-events: none; }
.hero.ready { background: linear-gradient(155deg, #2F7F5A 0%, #1F5B40 100%); }
.hero.ready::before { background: radial-gradient(circle, rgba(255,255,255,.28), transparent 65%); }
.hero.done { background: linear-gradient(155deg, #5c5f66, #43464c); }
.hero > * { position: relative; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.hero h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: clamp(30px, 9vw, 40px); line-height: 1.12; margin: 12px 0 10px; letter-spacing: .005em; text-transform: none; }
.hero p { margin: 0 auto; max-width: 34ch; font-size: 15px; line-height: 1.5; opacity: .95; }
.badge { width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); }
.badge svg { width: 30px; height: 30px; stroke-width: 2.2; }
.hero.ready .badge { animation: pop .7s var(--ease); background: rgba(255,255,255,.2); }
.hero:not(.ready):not(.done) .badge svg { animation: sway 3.2s ease-in-out infinite; }
@keyframes sway { 50% { transform: rotate(12deg) scale(1.06); } }
@keyframes pop { from { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.12); } }
.ref { margin-top: 20px; display: inline-flex; flex-direction: column; gap: 2px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); border-radius: 14px; padding: 10px 22px; }
.ref span { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; opacity: .8; font-weight: 700; }
.ref b { font-family: "Source Serif 4", Georgia, serif; font-size: 30px; letter-spacing: .04em; font-weight: 600; }

.g-card { padding: 18px 18px 8px; margin-top: 14px; }
.g-card .kv { grid-template-columns: 1fr 1fr; padding-bottom: 12px; }
.g-card h2, .sec-title { font-family: "Source Serif 4", Georgia, serif; font-size: 22px; font-weight: 600; }

.progress { display: flex; align-items: center; margin: 16px 4px 4px; }
.progress .p { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; width: 76px; font-size: 11px; font-weight: 600; color: var(--ink-soft); text-align: center; }
.progress .p i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); transition: all .4s var(--ease); }
.progress .p.on { color: var(--ink); } .progress .p.on i { background: var(--s-ready); border-color: var(--s-ready); }
.progress .p.cur i { border-color: var(--bronze); background: var(--bronze-soft); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bronze) 22%, transparent); animation: pulse2 2s infinite; }
.progress .ln { flex: 1; height: 2px; background: var(--line); margin-bottom: 22px; }
.progress .ln.on { background: var(--s-ready); }
@keyframes pulse2 { 50% { box-shadow: 0 0 0 7px transparent; } }

.wait-title { margin: 30px 4px 4px; }
.wait-sub { margin: 0 4px 14px; color: var(--ink-soft); font-size: 14px; }
.links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.link-btn { display: flex; flex-direction: column; gap: 6px; padding: 16px 14px; border-radius: 16px; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-sm); font-weight: 700; min-height: 88px; transition: transform .15s, border-color .15s; }
.link-btn:hover { border-color: var(--bronze); transform: translateY(-1px); }
.link-btn svg { width: 22px; height: 22px; color: var(--bronze); }
.link-btn small { font-weight: 500; color: var(--ink-soft); font-size: 12px; }
.link-btn.off { opacity: .6; pointer-events: none; }
.cards { display: flex; flex-direction: column; gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); overflow: hidden; }
.tile summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 16px; min-height: 60px; }
.tile summary::-webkit-details-marker { display: none; }
.tile .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--bronze-soft); color: var(--bronze-deep); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tile .ic svg { width: 22px; height: 22px; }
.tile .tt { font-weight: 700; font-size: 15.5px; flex: 1; }
.tile .chev { transition: transform .25s var(--ease); color: var(--ink-soft); }
.tile[open] .chev { transform: rotate(180deg); }
.tile .body { padding: 0 16px 16px 16px; padding-inline-start: 72px; padding-inline-end: 16px; color: var(--ink-soft); font-size: 14px; line-height: 1.55; animation: fade .3s; }
.tile .soon { display: inline-block; margin-top: 8px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--bronze-deep); background: var(--bronze-soft); padding: 2px 8px; border-radius: 6px; }
.notice { margin: 24px 4px 0; font-size: 12px; color: var(--ink-soft); text-align: center; }
.err-view { text-align: center; padding: 60px 20px; }
.err-view h1 { font-family: "Source Serif 4", Georgia, serif; font-size: 26px; margin-bottom: 8px; }
.conn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 18px; font-size: 12.5px; font-weight: 600; z-index: 20; }
@media (max-width: 360px) { .links { grid-template-columns: 1fr; } .progress .p { width: 64px; } }

/* language switcher */
.lang { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 0 0 14px; }
.lang button { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); padding: 7px 13px; min-height: 36px; border-radius: 18px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .13s; }
.lang button:hover { border-color: var(--bronze); }
.lang button.on { background: var(--bronze); border-color: var(--bronze); color: #fff; }
html[data-theme="dark"] .lang button.on { color: #1b140c; }

/* right-to-left (Arabic): joined letters must not be letter-spaced or upper-cased */
html[lang="ar"] .g-shell, html[lang="ar"] .g-shell * { letter-spacing: 0 !important; text-transform: none !important; font-family: "Noto Sans Arabic", "Plus Jakarta Sans", system-ui, sans-serif; }
html[lang="ar"] .hero h1, html[lang="ar"] .sec-title { line-height: 1.35; }
html[lang="ru"] .g-shell .hero h1 { font-size: clamp(28px, 8vw, 36px); }
html[dir="rtl"] .tile .chev { margin-inline-start: auto; }
html[dir="rtl"] .g-shell .kv > div { text-align: start; }

</style>

/* ---------- transport: Apps Script (google.script.run) or dev server (fetch) ---------- */
function transport(method, path, body) {
  const token = WG.token || '';
  if (window.google && window.google.script && window.google.script.run) {
    return new Promise((resolve) => {
      window.google.script.run
        .withSuccessHandler((r) => resolve(r && typeof r.status === 'number' ? r : { status: 500, body: { error: 'Unexpected reply from the server' } }))
        .withFailureHandler(() => resolve({ status: 0, body: { error: 'Cannot reach the server. Check your connection.' } }))
        .apiCall(token, method, path, body || null);
    });
  }
  return fetch('/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, method, path, body: body || null }) })
    .then((r) => r.json())
    .catch(() => ({ status: 0, body: { error: 'Cannot reach the server. Check your connection.' } }));
}

async function api(method, path, body) {
  const t0 = Date.now();
  const r = await transport(method, path, body);
  if (typeof r.t === 'number') WG.skew = r.t - (t0 + Date.now()) / 2; // assume symmetric latency
  if (r.status === 401 && path !== '/api/login') { forgetToken(); showLogin('Your session has ended. Please sign in again.'); throw Object.assign(new Error('Signed out'), { status: 401, silent: true }); }
  if (r.status === 0) throw Object.assign(new Error(r.body.error), { offline: true });
  if (r.status >= 400) throw Object.assign(new Error((r.body && r.body.error) || 'Something went wrong'), { status: r.status, data: r.body });
  return r.body;
}

function rememberToken(t) { WG.token = t; try { sessionStorage.setItem('wg-token', t); } catch (e) { /* storage blocked: stay signed in for this page only */ } }
function forgetToken() { WG.token = null; try { sessionStorage.removeItem('wg-token'); } catch (e) { /* ignore */ } if (WG.stopLive) { WG.stopLive(); WG.stopLive = null; } }
function storedToken() { try { return sessionStorage.getItem('wg-token'); } catch (e) { return null; } }

/* ---------- live sync: poll a tiny version counter, refetch only when it changes ---------- */
function live(onChange, onState = () => {}, { baseMs = 4000 } = {}) {
  let last = null, timer = null, fails = 0, stopped = false, busy = false;
  const tick = async () => {
    if (stopped || busy) return;
    if (document.hidden) { schedule(); return; }
    busy = true;
    try {
      const { version } = await api('GET', '/api/version');
      fails = 0; onState(true);
      if (last === null || version !== last) onChange(); // first tick also refreshes, so nothing changed since page load is missed
      last = version;
    } catch (e) { if (e.silent) { stopped = true; return; } fails++; onState(false); }
    busy = false; schedule();
  };
  const schedule = () => { clearTimeout(timer); if (!stopped) timer = setTimeout(tick, fails ? Math.min(30000, baseMs * (fails + 1)) : baseMs); };
  const onVis = () => { if (!document.hidden) { clearTimeout(timer); tick(); } };
  document.addEventListener('visibilitychange', onVis);
  tick();
  return () => { stopped = true; clearTimeout(timer); document.removeEventListener('visibilitychange', onVis); };
}

/* ---------- time ---------- */
function fmtDuration(sec) {
  if (sec == null || isNaN(sec)) return '-';
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}:${String(s).padStart(2, '0')}`;
}
const fmtClock = (t) => (t ? new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '-');
const fmtDate = (d) => (d ? new Date(d + 'T00:00:00').toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) : '-');
const pax = (g) => `${g.adults} adult${g.adults === 1 ? '' : 's'}${g.children ? `, ${g.children} child${g.children === 1 ? '' : 'ren'}` : ''}`;
function tickTimers() {
  const now = nowMs();
  for (const el of $$('[data-since]')) el.textContent = fmtDuration(((el.dataset.until ? Date.parse(el.dataset.until) : now) - Date.parse(el.dataset.since)) / 1000);
}
setInterval(tickTimers, 1000);

/* ---------- toasts, dialogs ---------- */
function toast(msg, type = '') {
  let box = $('#toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${type === 'err' ? icon('alert') : icon('check')}<span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, type === 'err' ? 5500 : 2600);
}

function dialog({ title, body, confirmLabel = 'Confirm', cancelLabel = 'Cancel', input = null }) {
  return new Promise((resolve) => {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">${esc(title)}</h2><div class="muted">${body || ''}</div>
      ${input ? `<label class="field" style="margin-top:14px"><span>${esc(input.label)}</span><input class="in" id="dlgIn" maxlength="200" autocomplete="off"></label><div class="field-error" id="dlgErr" hidden>${esc(input.error || 'Required')}</div>` : ''}
      <div class="modal-actions">${cancelLabel ? `<button class="btn btn-ghost" data-r="0">${esc(cancelLabel)}</button>` : ''}<button class="btn btn-primary" data-r="1">${esc(confirmLabel)}</button></div></div>`;
    const done = (v) => { ov.remove(); document.removeEventListener('keydown', key); resolve(v); };
    const submit = () => {
      if (!input) return done(true);
      const v = $('#dlgIn', ov).value.trim();
      if (v.length < (input.min || 1)) { $('#dlgErr', ov).hidden = false; return; }
      done(v);
    };
    const key = (e) => { if (e.key === 'Escape') done(false); if (e.key === 'Enter' && input) { e.preventDefault(); submit(); } };
    ov.addEventListener('click', (e) => { if (e.target === ov) return done(false); const r = e.target.closest('[data-r]'); if (r) r.dataset.r === '1' ? submit() : done(false); });
    document.addEventListener('keydown', key);
    document.body.appendChild(ov);
    (input ? $('#dlgIn', ov) : $('[data-r="1"]', ov)).focus();
  });
}
const confirmDialog = (o) => dialog(o);

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* iframe may block the clipboard API */ }
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

/* ---------- theme + top bar ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = $('#themeToggle');
  if (b) b.innerHTML = `<svg class="i" viewBox="0 0 24 24">${ICONS[t === 'dark' ? 'sun' : 'moon']}</svg>`;
}
(function initTheme() {
  let t = 'light';
  try { t = localStorage.getItem('wg-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) { /* default light */ }
  document.documentElement.dataset.theme = t;
})();

const ROLE_NAME = { reception: 'Reception', rooms_controller: 'Rooms Controller', admin: 'Admin' };

function mountTopbar(user, tagline) {
  $('#topbar').innerHTML = `<header class="topbar"><div class="topbar-inner">
    <div class="brand"><div class="logo-chip"><img src="${WG_ASSETS.logo}" alt="Rixos Bab Al Bahr"></div><div class="divider"></div>
      <div><div class="wordmark">Waiting Guest</div><div class="tagline">${esc(tagline)}</div></div></div>
    <div class="header-actions">
      <span class="live-dot" id="liveDot" title="Live connection">Live</span>
      <span class="user-chip"><b>${esc(user.name)}</b> · ${ROLE_NAME[user.role] || ''}</span>
      <button class="icon-btn" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
      <button class="text-btn" id="pwBtn" title="Change my password">Password</button>
      <button class="text-btn" id="logoutBtn">${icon('out')} Sign out</button>
    </div></div></header>`;
  applyTheme(document.documentElement.dataset.theme);
  $('#themeToggle').onclick = () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';

  };
  $('#logoutBtn').onclick = async () => { try { await api('POST', '/api/logout', {}); } catch (e) { /* ignore */ } forgetToken(); location.reload(); };

}
const setLive = (ok) => { const d = $('#liveDot'); if (d) { d.classList.toggle('off', !ok); d.textContent = ok ? 'Live' : 'Reconnecting'; } };

function changePasswordDialog() {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<form class="modal-box" role="dialog" aria-modal="true" aria-labelledby="pwT"><h2 id="pwT">Change password</h2>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
    <label class="field"><span>Current password</span><input class="in" id="pwCur" type="password" autocomplete="current-password" required></label>
    <label class="field"><span>New password (8+ characters)</span><input class="in" id="pwNew" type="password" autocomplete="new-password" required minlength="8"></label>
    <div class="banner err" id="pwErr" hidden></div></div>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" data-r="0">Cancel</button><button class="btn btn-primary" type="submit" id="pwGo">Save</button></div></form>`;
  document.body.appendChild(ov);
  $('#pwCur', ov).focus();
  const close = () => ov.remove();
  $('[data-r="0"]', ov).onclick = close;
  ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
  ov.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const b = $('#pwGo', ov); b.classList.add('loading'); $('#pwErr', ov).hidden = true;
    try { await api('POST', '/api/me/password', { current: $('#pwCur', ov).value, next: $('#pwNew', ov).value }); toast('Password changed'); close(); }
    catch (ex) { b.classList.remove('loading'); $('#pwErr', ov).textContent = ex.message; $('#pwErr', ov).hidden = false; }
  });
}

'use strict';

function showLogin(message) {
  $('#root').innerHTML = `<main class="auth-gate"><div class="card auth-card">
    <div class="auth-logo"><img src="${WG_ASSETS.logo}" alt="Rixos Bab Al Bahr"></div>
    <h1>Waiting Guest</h1><div class="auth-sub">Sign in to continue</div>
    <form id="loginForm">
      <label class="field"><span>Username</span><input class="in" id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" autofocus required></label>
      <label class="field"><span>Password</span><input class="in" id="lp" type="password" autocomplete="current-password" required></label>
      <div class="banner ${message ? 'info' : 'err'}" id="loginMsg" role="alert" ${message ? '' : 'hidden'}>${esc(message || '')}</div>
      <button class="btn btn-primary" id="loginGo" type="submit">Sign in</button>
    </form></div></main>`;
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const b = $('#loginGo'), msg = $('#loginMsg');
    b.classList.add('loading'); msg.hidden = true; msg.className = 'banner err';
    try {
      const out = await api('POST', '/api/login', { username: $('#lu').value.trim(), password: $('#lp').value });
      rememberToken(out.token);
