function mountForUser(user) {
  const view = user.role === 'reception' ? 'reception' : user.role === 'rooms_controller' ? 'controller' : 'admin';
  WG.views[view]($('#root'), user);
}

/* ---- 20-reception.js ---- */
'use strict';
/* Reception: fast search, auto-filled reservation, four manual fields, QR; later verify and complete. */
WG.views.reception = function (root, user) {
  const S = { roomTypes: {}, active: [], completed: [], tab: 'active', selectedId: null, searchTimer: null, seq: 0 };
  const typeName = (c) => S.roomTypes[c] || c;
  const ASSOCIATE_KEY = 'wg-associate';

  root.innerHTML = `<div id="topbar"></div>
  <div class="rc-wrap">
    <main class="rc-main">
      <div class="search-box" role="search">
        ${icon('search')}
        <label for="q" class="sr-only">Search</label>
        <input id="q" type="search" placeholder="Confirmation number, guest name or WG number" autocomplete="off" inputmode="search" autofocus>
        <kbd>/</kbd>
      </div>
      <div class="hint muted" id="hint">New arrival: type the <b>confirmation number</b>. Guest returning: search by name, confirmation or <b>WG number</b>. <button class="linkish" id="manualLink">Reservation not found? Enter it manually</button></div>
      <div id="results" aria-live="polite"></div>
      <div id="work"></div>
    </main>
    <aside class="rc-side">
      <div class="side-head"><h2 class="serif">Waiting guests</h2>
        <div class="seg" role="tablist"><button role="tab" data-tab="active" class="on">Active</button><button role="tab" data-tab="completed">Closed</button></div></div>
      <div id="list"></div>
    </aside>
  </div>`;
  mountTopbar(user, 'Reception');

  /* ---------- list (right column) ---------- */
  function rowHtml(g, sel) {
    const t = g.status === 'completed' ? `<span class="t">${fmtClock(g.timestamps.completed)}</span>`
      : g.status === 'cancelled' ? `<span class="t">${fmtClock(g.timestamps.cancelled)}</span>`
      : g.status === 'ready' || g.status === 'returned' ? `<span class="t">ready ${fmtClock(g.timestamps.roomReady)}</span>`
      : `<span class="t num" data-since="${esc(g.timestamps.created)}">0:00</span>`;
    return `<button class="row${sel ? ' sel' : ''}" data-wg="${g.id}"><div class="top"><span class="wg">${esc(g.wgNumber)}</span><span class="nm">${esc(g.guestName)}</span></div>
      <div class="sub">${esc(g.confirmationNo)} · ${esc(g.roomType)} · ${esc(g.associate || '')}</div>
      <div class="end">${statusPill(g.status)}${t}</div></button>`;
  }
  function renderList() {
    const items = S.tab === 'active' ? S.active : S.completed;
    $('#list').innerHTML = items.length ? items.map((g) => rowHtml(g, g.id === S.selectedId)).join('')
      : `<div class="empty">${icon('queue')}<b>${S.tab === 'active' ? 'No active waiting guests' : 'Nothing closed yet'}</b>Guests you create will appear here and update live.</div>`;
    tickTimers();
  }
  async function loadList() {
    try {
      const d = await api('GET', '/api/waiting-guests');
      S.active = d.active; S.completed = d.completed;
      renderList();
      if (S.selectedId) refreshSelected();
    } catch (e) { if (!e.offline && !e.silent) toast(e.message, 'err'); }
  }
  $('#list').addEventListener('click', (e) => { const r = e.target.closest('[data-wg]'); if (r) openWg(Number(r.dataset.wg)); });
  $$('.seg button').forEach((b) => b.addEventListener('click', () => {
    S.tab = b.dataset.tab; $$('.seg button').forEach((x) => x.classList.toggle('on', x === b)); renderList();
  }));

  /* ---------- search ---------- */
  const q = $('#q');
  q.addEventListener('input', () => { clearTimeout(S.searchTimer); S.searchTimer = setTimeout(() => runSearch(false), 220); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { clearTimeout(S.searchTimer); runSearch(true); }
    if (e.key === 'Escape') { q.value = ''; runSearch(false); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); q.select(); } });
  $('#manualLink').onclick = () => openManual(q.value.trim());

  async function runSearch(fromEnter) {
    const term = q.value.trim();
    const box = $('#results');
    const my = ++S.seq;
    if (term.length < 2) { box.innerHTML = ''; $('#hint').hidden = false; return; }
    $('#hint').hidden = true;
    try {
      const d = await api('GET', `/api/search?q=${encodeURIComponent(term)}`);
      if (my !== S.seq) return;
      const activeConf = new Set(d.waitingGuests.filter((w) => !['completed', 'cancelled'].includes(w.status)).map((w) => w.confirmationNo));
      const res = d.reservations.filter((r) => !activeConf.has(r.confirmationNo));
      let html = '';
      if (d.waitingGuests.length) html += `<div class="group-label">Waiting guests</div>` + d.waitingGuests.map((g) => rowHtml(g, g.id === S.selectedId)).join('');
      if (res.length) html += `<div class="group-label">Reservations</div>` + res.map((r) => `<button class="row res" data-res="${esc(r.confirmationNo)}"><div class="top"><span class="wg">${esc(r.confirmationNo)}</span><span class="nm">${esc(r.guestName)}</span></div>
        <div class="sub">${esc(typeName(r.roomType))} · ${pax(r)}${r.arrivalTime ? ' · arrives ' + esc(r.arrivalTime) : ''}</div><div class="end"><span class="type-pill">${esc(r.roomType)}</span></div></button>`).join('');
      if (!html) html = `<div class="card empty">${icon('search')}<b>No match</b>Check the confirmation number, or search a returning guest by name or WG number.<div style="margin-top:12px"><button class="btn btn-ghost btn-sm" id="manualBtn">Enter reservation manually</button></div></div>`;
      box.innerHTML = html; tickTimers();
      const mb = $('#manualBtn'); if (mb) mb.onclick = () => openManual(term);
      if (fromEnter === true && d.waitingGuests.length + res.length === 1) {
        if (d.waitingGuests.length) openWg(d.waitingGuests[0].id); else openReservation(res[0].confirmationNo);
      }
    } catch (e) { if (my === S.seq && !e.silent) box.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  }
  $('#results').addEventListener('click', (e) => {
    const w = e.target.closest('[data-wg]'), r = e.target.closest('[data-res]');
    if (w) openWg(Number(w.dataset.wg)); else if (r) openReservation(r.dataset.res);
  });

  /* ---------- shared operational fields ---------- */
  const rememberedAssociate = () => { try { return localStorage.getItem(ASSOCIATE_KEY) || ''; } catch (e) { return ''; } };
  const opFields = (associate, lang = 'en') => `<div class="form-grid">
    <label class="field"><span>Luggage tag <em class="opt">(optional)</em></span><input class="in" id="fTag" maxlength="40" autocomplete="off"></label>
    <label class="field"><span>Associate name</span><input class="in" id="fAssoc" maxlength="80" value="${esc(associate)}" autocomplete="off" required><span class="field-error" id="assocErr" hidden>Enter your name</span></label>
    <label class="field full"><span>Guest language <em class="opt">(for their QR page)</em></span><select class="in" id="fLang">${langOptions(lang)}</select></label>
    <label class="field full"><span>Guest preferences <em class="opt">(optional)</em></span><textarea class="in" id="fPref" maxlength="500" rows="2"></textarea></label>
    <label class="field full"><span>Remarks <em class="opt">(optional)</em></span><textarea class="in" id="fRem" maxlength="500" rows="2"></textarea></label></div>`;

  /* ---------- reservation -> create ---------- */
  async function openReservation(no) {
    S.selectedId = null; renderList();
    const work = $('#work');
    work.innerHTML = `<div class="card panel"><div class="skeleton" style="height:28px;width:40%"></div><div class="skeleton" style="height:90px;margin-top:16px"></div></div>`;
    try {
      const d = await api('GET', `/api/search?q=${encodeURIComponent(no)}`);
      const r = d.reservations.find((x) => x.confirmationNo === no);
      if (!r) throw new Error('Reservation not found');
      const associate = rememberedAssociate();
      work.innerHTML = `<form class="card panel" id="createForm" novalidate>
        <div class="panel-head"><div><div class="label">Reservation ${esc(r.confirmationNo)}</div><h2 class="serif">${esc(r.guestName)}</h2></div><span class="type-pill">${esc(r.roomType)} · ${esc(typeName(r.roomType))}</span></div>
        <div class="kv">
          <div><span>Arrival</span><b>${fmtDate(r.arrivalDate)}${r.arrivalTime ? ' · ' + esc(r.arrivalTime) : ''}</b></div>
          <div><span>Departure</span><b>${fmtDate(r.departureDate)}</b></div>
          <div><span>Guests</span><b>${pax(r)}</b></div>
          <div><span>Phone</span><b>${esc(r.phone || '-')}</b></div>
          <div><span>Email</span><b>${esc(r.email || '-')}</b></div>
          ${r.mealPlan ? `<div><span>Meal plan</span><b>${esc(r.mealPlan)}</b></div>` : ''}
          ${r.vipCode ? `<div><span>VIP</span><b>${esc(r.vipCode)}</b></div>` : ''}
          ${r.specialRequests ? `<div style="grid-column:1/-1"><span>Reservation requests</span><b>${esc(r.specialRequests)}</b></div>` : ''}
        </div><hr>
        <div class="auto-note">${icon('check')} Phone, email, Waiting Guest number and QR are filled in automatically.</div>
        ${opFields(associate, r.suggestedLanguage)}
        <div class="banner err" id="formErr" role="alert" hidden style="margin-top:14px"></div>
        <div class="actions"><button class="btn btn-primary" id="createBtn" type="submit">${icon('plus')} Create Waiting Guest</button><button class="btn btn-ghost" type="button" id="cancelBtn">Cancel</button></div>
      </form>`;
      (associate ? $('#fTag') : $('#fAssoc')).focus();
      $('#cancelBtn').onclick = clearWork;
      $('#createForm').addEventListener('submit', (e) => { e.preventDefault(); submitCreate(r.confirmationNo, null); });
      $('#createForm').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitCreate(r.confirmationNo, null); } });
      work.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (e) { if (!e.silent) work.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  }

  /* ---------- manual fallback (reservation missing from the imported arrivals) ---------- */
  function openManual(term) {
    S.selectedId = null; renderList();
    const today = new Date(), iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const tomorrow = new Date(today.getTime() + 86400000);
    const types = Object.keys(S.roomTypes).sort();
    const associate = rememberedAssociate();
    $('#work').innerHTML = `<form class="card panel" id="manualForm" novalidate>
      <div class="panel-head"><div><div class="label">Manual entry</div><h2 class="serif">Reservation not in the arrivals list</h2></div></div>
      <div class="banner info" style="margin-bottom:14px">${icon('alert')}<span>Use this only when the confirmation number is not found. Copy the details exactly from Opera. The record is marked <b>Manual entry</b>.</span></div>
      <div class="form-grid">
        <label class="field"><span>Confirmation number</span><input class="in" id="mConf" maxlength="30" value="${/^[A-Za-z0-9\-\/]+$/.test(term) ? esc(term) : ''}" autocomplete="off" required></label>
        <label class="field"><span>Guest name</span><input class="in" id="mName" maxlength="120" autocomplete="off" required></label>
        <label class="field"><span>Arrival date</span><input class="in" id="mArr" type="date" value="${iso(today)}" required></label>
        <label class="field"><span>Departure date</span><input class="in" id="mDep" type="date" value="${iso(tomorrow)}" required></label>
        <label class="field"><span>Room type</span><select class="in" id="mType" required><option value="">Select…</option>${types.map((c) => `<option value="${esc(c)}">${esc(c)} · ${esc(S.roomTypes[c])}</option>`).join('')}</select></label>
        <label class="field"><span>Arrival time <em class="opt">(optional)</em></span><input class="in" id="mTime" type="time"></label>
        <label class="field"><span>Adults</span><input class="in" id="mAd" type="number" min="1" max="20" value="2" required></label>
        <label class="field"><span>Children</span><input class="in" id="mCh" type="number" min="0" max="20" value="0"></label>
        <label class="field"><span>Phone <em class="opt">(optional)</em></span><input class="in" id="mPh" maxlength="40" autocomplete="off"></label>
        <label class="field"><span>Email <em class="opt">(optional)</em></span><input class="in" id="mEm" maxlength="120" autocomplete="off"></label>
      </div><hr>${opFields(associate)}
      <div class="banner err" id="formErr" role="alert" hidden style="margin-top:14px"></div>
      <div class="actions"><button class="btn btn-primary" id="createBtn" type="submit">${icon('plus')} Create Waiting Guest</button><button class="btn btn-ghost" type="button" id="cancelBtn">Cancel</button></div></form>`;
    $('#cancelBtn').onclick = clearWork;
    (/^[A-Za-z0-9\-\/]+$/.test(term) ? $('#mName') : $('#mConf')).focus();
    $('#manualForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const manual = { guestName: $('#mName').value, arrivalDate: $('#mArr').value, departureDate: $('#mDep').value, roomType: $('#mType').value, arrivalTime: $('#mTime').value,
        adults: $('#mAd').value, children: $('#mCh').value, phone: $('#mPh').value, email: $('#mEm').value };
      submitCreate($('#mConf').value.trim(), manual);
    });
    $('#work').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function submitCreate(no, manual) {
    const assoc = $('#fAssoc').value.trim();
    $('#assocErr').hidden = !!assoc;
    $('#fAssoc').setAttribute('aria-invalid', assoc ? 'false' : 'true');
    if (!assoc) { $('#fAssoc').focus(); return; }
    const btn = $('#createBtn');
    if (btn.classList.contains('loading')) return; // guard against double clicks
    btn.classList.add('loading'); $('#formErr').hidden = true;
    try {
      try { localStorage.setItem(ASSOCIATE_KEY, assoc); } catch (e) { /* ignore */ }
      const { waitingGuest: g } = await api('POST', '/api/waiting-guests', {
        confirmationNo: no, associate: assoc, luggageTag: $('#fTag').value, preferences: $('#fPref').value, remarks: $('#fRem').value, language: $('#fLang').value, manual,
      });
      S.selectedId = null; // keep the success panel; live refresh must not replace it
      await showQr(g, true);
      q.value = ''; $('#results').innerHTML = ''; $('#hint').hidden = false;
      await loadList();
      const row = $(`#list [data-wg="${g.id}"]`); if (row) row.classList.add('flash');
    } catch (e) {
      btn.classList.remove('loading');
      if (e.silent) return;
      if (e.status === 409 && e.data && e.data.waitingGuest) {
        $('#formErr').innerHTML = `${esc(e.message)}. <button type="button" class="text-btn" id="openExisting">Open ${esc(e.data.waitingGuest.wgNumber)}</button>`;
        $('#openExisting').onclick = () => openWg(e.data.waitingGuest.id);
      } else $('#formErr').textContent = e.message;
      $('#formErr').hidden = false;
    }
  }

  async function showQr(g, fresh) {
    $('#work').innerHTML = `<div class="card success">
      ${fresh ? `<div class="tick">${icon('check')}</div>` : ''}
      <div class="label">${fresh ? 'Waiting Guest created' : 'Guest QR'}</div>
      <div class="big-wg">${esc(g.wgNumber)}</div>
      <div><b>${esc(g.guestName)}</b> · ${esc(g.confirmationNo)}</div>
      <div class="muted" style="margin-top:6px">${fresh ? `Now in the Rooms Controller queue. Waiting timer started at ${fmtClock(g.timestamps.created)}.` : `Status: ${esc(STATUS_LABEL[g.status])}`}</div>
      <div class="qr" id="qrBox" aria-label="Guest QR code"><div class="skeleton" style="aspect-ratio:1"></div></div>
      <div class="muted" style="font-size:12.5px">The guest scans this QR to follow their room status in <b>${esc(langInfo(g.language).name)}</b>. No login needed. They can switch language on the page.</div>
      <div class="link-row" id="qrActions"><button class="btn btn-primary btn-sm" id="nextBtn">${icon('plus')} New Waiting Guest</button></div></div>`;
    $('#nextBtn').onclick = () => { clearWork(); q.focus(); };
    try {
      const { url, svg } = await api('GET', `/api/waiting-guests/${g.id}/qr`);
      $('#qrBox').innerHTML = svg;
      $('#qrActions').insertAdjacentHTML('afterbegin', `<button class="btn btn-ghost btn-sm" id="copyBtn">${icon('copy')} Copy guest link</button><a class="btn btn-ghost btn-sm" href="${esc(url)}" target="_blank" rel="noopener">${icon('link')} Open guest page</a>`);
      $('#copyBtn').onclick = async () => toast((await copyText(url)) ? 'Guest link copied' : 'Could not copy. Use "Open guest page".', 'ok');
    } catch (e) { $('#qrBox').textContent = 'QR unavailable'; }
  }

  function clearWork() { $('#work').innerHTML = ''; S.selectedId = null; renderList(); }

  /* ---------- existing waiting guest: verify + complete ---------- */
  async function openWg(id) {
    S.selectedId = id; renderList();
    $$('#results .row').forEach((r) => r.classList.toggle('sel', Number(r.dataset.wg) === id));
    await refreshSelected(true);
  }
  async function refreshSelected(scroll) {
    const id = S.selectedId;
    if (!id) return;
    try {
      const { waitingGuest: g, history } = await api('GET', `/api/waiting-guests/${id}`);
      if (id !== S.selectedId) return;
      if (document.querySelector('.modal-overlay')) return; // never redraw under an open dialog
      renderWg(g, history);
      if (scroll) $('#work').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (e) { if (!e.silent) $('#work').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  }

  function editDialog(g) {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `<form class="modal-box" style="max-width:480px" role="dialog" aria-modal="true" aria-labelledby="edT"><h2 id="edT">Edit ${esc(g.wgNumber)}</h2>
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
      <label class="field"><span>Luggage tag</span><input class="in" id="eTag" maxlength="40" value="${esc(g.luggageTag)}"></label>
      <label class="field"><span>Associate name</span><input class="in" id="eAssoc" maxlength="80" value="${esc(g.associate)}" required></label>
      <label class="field"><span>Guest language (QR page)</span><select class="in" id="eLang">${langOptions(g.language)}</select></label>
      <label class="field"><span>Guest preferences</span><textarea class="in" id="ePref" maxlength="500" rows="2">${esc(g.preferences)}</textarea></label>
      <label class="field"><span>Remarks</span><textarea class="in" id="eRem" maxlength="500" rows="2">${esc(g.remarks)}</textarea></label>
      <div class="banner err" id="edErr" hidden></div></div>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-r="0">Cancel</button><button class="btn btn-primary" type="submit" id="edGo">Save</button></div></form>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    $('[data-r="0"]', ov).onclick = close;
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    ov.querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const b = $('#edGo', ov); b.classList.add('loading');
      try {
        await api('POST', `/api/waiting-guests/${g.id}/details`, { luggageTag: $('#eTag', ov).value, associate: $('#eAssoc', ov).value, language: $('#eLang', ov).value, preferences: $('#ePref', ov).value, remarks: $('#eRem', ov).value });
        close(); toast('Details updated'); await loadList();
      } catch (ex) { b.classList.remove('loading'); $('#edErr', ov).textContent = ex.message; $('#edErr', ov).hidden = false; }
    });
  }

  function renderWg(g, history) {
    const ready = g.status === 'ready' || g.status === 'returned', closed = ['completed', 'cancelled'].includes(g.status);
    const note = g.status === 'ready' ? `<div class="ready-note">${icon('key')} Room is ready. Verify the guest, then complete.</div>`
      : g.status === 'returned' ? `<div class="ready-note">${icon('key')} Guest is at the desk. Complete to finish.</div>`
      : g.status === 'completed' ? `<div class="banner info">Completed at ${fmtClock(g.timestamps.completed)}. Key activation and the final hotel transaction happen outside this system.</div>`
      : g.status === 'cancelled' ? `<div class="banner err">Cancelled at ${fmtClock(g.timestamps.cancelled)}: ${esc(g.cancelReason)}</div>`
      : `<div class="banner info">${icon('clock')}<span>Room is not ready yet (${esc(STATUS_LABEL[g.status])}). It cannot be completed until the Rooms Controller marks it ready.</span></div>`;
    $('#work').innerHTML = `<div class="card panel">
      <div class="panel-head"><div><div class="label">Waiting Guest</div><h2 class="serif">${esc(g.wgNumber)}</h2></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${g.source === 'manual' ? '<span class="type-pill">Manual entry</span>' : ''}${statusPill(g.status)}</div></div>
      ${note}
      <div class="verify"><div class="label" style="margin-bottom:8px">Verify guest</div><div class="kv">
        <div><span>Guest name</span><b>${esc(g.guestName)}</b></div><div><span>Confirmation</span><b>${esc(g.confirmationNo)}</b></div>
        <div><span>WG number</span><b>${esc(g.wgNumber)}</b></div><div><span>Arrival → Departure</span><b>${fmtDate(g.arrivalDate)} → ${fmtDate(g.departureDate)}</b></div></div></div>
      <div class="kv">
        <div><span>Room type</span><b>${esc(g.roomType)} · ${esc(typeName(g.roomType))}</b></div><div><span>Guests</span><b>${pax(g)}</b></div>
        <div><span>Luggage tag</span><b>${esc(g.luggageTag || '-')}</b></div><div><span>Associate</span><b>${esc(g.associate || '-')}</b></div>
        <div><span>Guest language</span><b>${esc(langInfo(g.language).name)}</b></div>
        ${g.roomNumber && ready ? `<div><span>Assigned room</span><b>${esc(g.roomNumber)}</b></div>` : ''}
        ${g.preferences ? `<div style="grid-column:1/-1"><span>Preferences</span><b>${esc(g.preferences)}</b></div>` : ''}
        ${g.remarks ? `<div style="grid-column:1/-1"><span>Remarks</span><b>${esc(g.remarks)}</b></div>` : ''}
      </div>
      <hr><div class="section-label">History</div>
      <ul class="timeline">${history.map((h) => `<li><span>${esc(STATUS_LABEL[h.to] || h.to)}${h.note ? ` <span class="muted">(${esc(h.note)})</span>` : ''}<span class="muted"> · ${esc(h.by || '')}</span></span><span class="when">${fmtClock(h.at)}</span></li>`).join('')}</ul>
      <div class="actions">
        ${!closed ? `<button class="btn btn-primary" id="completeBtn" ${ready ? '' : 'disabled'}>${icon('check')} Complete Waiting Guest</button>` : ''}
        ${g.status === 'ready' ? `<button class="btn btn-ghost" id="returnedBtn">Guest returned</button>` : ''}
        <button class="btn btn-ghost" id="qrBtn">${icon('link')} Show QR</button>
        ${!closed ? `<button class="btn btn-ghost" id="editBtn">Edit details</button><button class="btn btn-ghost btn-danger" id="cancelWgBtn">Cancel</button>` : ''}
      </div></div>`;
    const cb = $('#completeBtn');
    if (cb && ready) cb.onclick = async () => {
      const ok = await confirmDialog({ title: `Complete ${g.wgNumber}?`, body: `Confirm you have verified <b>${esc(g.guestName)}</b> (${esc(g.confirmationNo)}). This closes the Waiting Guest record.`, confirmLabel: 'Complete' });
      if (!ok) return;
      cb.classList.add('loading');
      try { await api('POST', `/api/waiting-guests/${g.id}/status`, { status: 'completed' }); toast(`${g.wgNumber} completed`); await loadList(); }
      catch (e) { cb.classList.remove('loading'); if (!e.silent) toast(e.message, 'err'); await loadList(); }
    };
    const rb = $('#returnedBtn');
    if (rb) rb.onclick = async () => { rb.classList.add('loading'); try { await api('POST', `/api/waiting-guests/${g.id}/status`, { status: 'returned' }); toast('Marked as returned'); await loadList(); } catch (e) { rb.classList.remove('loading'); if (!e.silent) toast(e.message, 'err'); await loadList(); } };
    $('#qrBtn').onclick = () => { S.selectedId = null; showQr(g, false); };
    const eb = $('#editBtn'); if (eb) eb.onclick = () => editDialog(g);
    const xb = $('#cancelWgBtn');
    if (xb) xb.onclick = async () => {
      const reason = await dialog({ title: `Cancel ${g.wgNumber}?`, body: 'Use this when the record was created by mistake or the guest no longer waits. The guest page will stop showing room updates.', confirmLabel: 'Cancel Waiting Guest', cancelLabel: 'Keep', input: { label: 'Reason (required)', min: 3, error: 'Please give a short reason' } });
      if (!reason) return;
      try { await api('POST', `/api/waiting-guests/${g.id}/cancel`, { reason }); toast(`${g.wgNumber} cancelled`); await loadList(); } catch (e) { if (!e.silent) toast(e.message, 'err'); }
    };
  }

  /* ---------- boot ---------- */
  (async function init() {
    try {
      S.roomTypes = (await api('GET', '/api/meta')).roomTypes;
      $('#list').innerHTML = '<div class="skeleton" style="height:64px"></div><div class="skeleton" style="height:64px"></div>';
      await loadList();
      WG.stopLive = live(loadList, setLive);
    } catch (e) { if (!e.silent) toast(e.message, 'err'); }
  })();
};

/* ---- 30-controller.js ---- */
'use strict';
/* Rooms Controller: dense live queue, timer first, one-click operational actions. */
WG.views.controller = function (root, user) {
  const S = { roomTypes: {}, queue: [], filter: 'all', selectedId: null, seen: new Set(), first: true, late1: 30, late2: 60, pendingRoom: null };
  const typeName = (c) => S.roomTypes[c] || c;
  const FILTERS = [['all', 'All active'], ['waiting', 'Waiting'], ['room_assigned', 'Room Assigned'], ['preparing', 'Being Prepared'], ['ready', 'Ready (awaiting guest)']];
  const inFilter = (g) => S.filter === 'all' || g.status === S.filter || (S.filter === 'ready' && g.status === 'returned');

  root.innerHTML = `<div id="topbar"></div>
    <div class="metrics" id="metrics" aria-label="Live figures"></div>
    <div class="filters" id="filters" role="toolbar" aria-label="Filter queue"></div>
    <div class="rc-body"><main id="queue" aria-live="polite"></main><aside class="detail" id="detail" aria-label="Guest details"></aside></div>`;
  mountTopbar(user, 'Rooms Controller');

  async function loadMetrics() {
    try {
      const m = await api('GET', '/api/metrics');
      $('#metrics').innerHTML = `
        <div class="metric"><span>Active</span><b>${m.active}</b></div>
        <div class="metric"><span>Still waiting for a room</span><b>${m.stillWaitingForRoom}</b></div>
        <div class="metric good"><span>Ready, guest not back</span><b>${m.readyAwaitingGuest}</b></div>
        <div class="metric"><span>Completed</span><b>${m.completed}</b></div>
        <div class="metric"><span>Avg. wait to ready</span><b>${m.avgWaitToReadySec == null ? '-' : fmtDuration(m.avgWaitToReadySec)}</b></div>`;
    } catch (e) { /* metrics are non-critical */ }
  }

  function cls(g) {
    const c = ['q', `s-${g.status}`];
    if (g.priority) c.push('pri');
    if (!['ready', 'returned'].includes(g.status)) {
      const min = (nowMs() - Date.parse(g.timestamps.created)) / 60000;
      if (min >= S.late2) c.push('late2'); else if (min >= S.late1) c.push('late1');
    }
    if (g.id === S.selectedId) c.push('sel');
    return c.join(' ');
  }
  const timerHtml = (g) => ['ready', 'returned'].includes(g.status)
    ? `<div class="timer"><b class="num" data-since="${esc(g.timestamps.roomReady)}">0:00</b><small>Ready for</small></div>`
    : `<div class="timer"><b class="num" data-since="${esc(g.timestamps.created)}">0:00</b><small>Waiting</small></div>`;

  function cardHtml(g, isNew) {
    return `<button class="${cls(g)}${isNew ? ' q-new' : ''}" data-id="${g.id}" aria-label="${esc(g.wgNumber)} ${esc(g.guestName)}">
      <span class="bar"></span>${timerHtml(g)}
      <div class="main">
        <div class="l1"><span class="wg">${esc(g.wgNumber)}</span><span class="nm">${esc(g.guestName)}</span>${g.priority ? '<span class="flag">PRIORITY</span>' : ''}${g.source === 'manual' ? '<span class="type-pill">Manual</span>' : ''}${g.language && g.language !== 'en' ? `<span class="type-pill" title="Guest language">${esc(langInfo(g.language).name)}</span>` : ''}</div>
        <div class="l2"><span>${icon('key')}${esc(g.confirmationNo)}</span><span class="type-pill">${esc(g.roomType)}</span><span>${icon('user')}${g.adults}A${g.children ? ` ${g.children}C` : ''}</span>
          <span>${icon('clock')}Arr ${esc(g.arrivalTime || fmtClock(g.timestamps.guestArrival))}</span>${g.luggageTag ? `<span>${icon('bag')}${esc(g.luggageTag)}</span>` : ''}<span>${esc(g.associate || '')}</span></div>
        ${g.preferences || g.remarks ? `<div class="l3">${g.preferences ? `<span class="note" title="${esc(g.preferences)}">Pref: ${esc(g.preferences)}</span>` : ''}${g.remarks ? `<span class="note rem" title="${esc(g.remarks)}">Rem: ${esc(g.remarks)}</span>` : ''}</div>` : ''}
      </div>
      <div class="side">${statusPill(g.status)}${g.roomNumber ? `<div class="room">${esc(g.roomNumber)}</div>` : '<div class="room none">No room yet</div>'}</div>
    </button>`;
  }
  function renderFilters() {
    $('#filters').innerHTML = FILTERS.map(([k, l]) => {
      const n = S.queue.filter((g) => (k === 'all' ? true : k === 'ready' ? ['ready', 'returned'].includes(g.status) : g.status === k)).length;
      return `<button class="chip${S.filter === k ? ' on' : ''}" data-f="${k}">${l}<i>${n}</i></button>`;
    }).join('');
  }
  function renderQueue() {
    renderFilters();
    const rows = S.queue.filter(inFilter);
    const box = $('#queue');
    if (!rows.length) {
      box.innerHTML = `<div class="card empty">${icon('door')}<b>${S.queue.length ? 'Nothing in this filter' : 'No waiting guests'}</b>${S.queue.length ? 'Try another status filter.' : 'When Reception creates a Waiting Guest it appears here within seconds.'}</div>`;
      return;
    }
    const rank = { waiting: 0, room_assigned: 1, preparing: 2, ready: 3, returned: 4 };
    rows.sort((a, b) => Number(b.priority) - Number(a.priority) || rank[a.status] - rank[b.status] || Date.parse(a.timestamps.created) - Date.parse(b.timestamps.created));
    box.innerHTML = rows.map((g) => cardHtml(g, !S.first && !S.seen.has(g.id))).join('');
    tickTimers();
  }
  async function loadQueue() {
    try {
      const d = await api('GET', '/api/waiting-guests');
      const prev = new Set(S.queue.map((g) => g.id));
      S.queue = d.active;
      renderQueue();
      if (!S.first) for (const g of S.queue) if (!prev.has(g.id)) toast(`New waiting guest ${g.wgNumber}: ${g.guestName}`);
      for (const g of S.queue) S.seen.add(g.id);
      S.first = false;
      loadMetrics();
      if (S.selectedId) { if (S.queue.some((g) => g.id === S.selectedId)) loadDetail(S.selectedId, true); else closeDetail(); }
    } catch (e) { if (!e.offline && !e.silent) toast(e.message, 'err'); }
  }
  $('#queue').addEventListener('click', (e) => { const c = e.target.closest('[data-id]'); if (c) selectGuest(Number(c.dataset.id)); });
  $('#filters').addEventListener('click', (e) => { const c = e.target.closest('[data-f]'); if (c) { S.filter = c.dataset.f; renderQueue(); } });

  /* ---------- detail ---------- */
  function selectGuest(id) { S.selectedId = id; S.pendingRoom = null; $$('#queue .q').forEach((c) => c.classList.toggle('sel', Number(c.dataset.id) === id)); loadDetail(id); }
  function closeDetail() { S.selectedId = null; $('#detail').classList.remove('open'); renderDetailEmpty(); $$('#queue .q.sel').forEach((c) => c.classList.remove('sel')); }
  const renderDetailEmpty = () => { $('#detail').innerHTML = `<div class="card detail-empty empty">${icon('queue')}<b>Select a waiting guest</b>See preferences, assign a room and update status.</div>`; };
  async function loadDetail(id, quiet) {
    const el = $('#detail');
    if (!quiet) { el.classList.add('open'); el.innerHTML = `<div class="card d-card"><div class="skeleton" style="height:30px;width:50%"></div><div class="skeleton" style="height:120px;margin-top:16px"></div></div>`; }
    try {
      const d = await api('GET', `/api/waiting-guests/${id}`);
      if (id !== S.selectedId) return;
      if (document.querySelector('.modal-overlay')) return;
      renderDetail(d);
    } catch (e) { if (!e.silent) el.innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
  }

  function stepsHtml(g) {
    const t = g.timestamps;
    const items = [['waiting', 'Waiting Guest created', t.created], ['room_assigned', 'Room assigned', t.roomAssigned], ['preparing', 'Room being prepared', t.preparationStarted],
      ['ready', 'Room ready (guest notified via QR)', t.roomReady], ['returned', 'Guest returned', t.guestReturned], ['completed', 'Completed', t.completed]];
    const idx = STATUS_ORDER.indexOf(g.status);
    return `<div class="steps">${items.map(([k, l, ts], i) => `<div class="step ${ts ? 'done' : ''}${i === idx ? ' now' : ''}"><span class="dot"></span><span>${l}</span><span class="ts">${ts ? fmtClock(ts) : ''}</span></div>`).join('')}</div>`;
  }

  function renderDetail(d) {
    const g = d.waitingGuest, ready = ['ready', 'returned'].includes(g.status), done = ['completed', 'cancelled'].includes(g.status);
    const el = $('#detail');
    const pending = S.pendingRoom && S.pendingRoom.id === g.id ? S.pendingRoom.room : (g.roomNumber || null);
    const canPick = ['waiting', 'room_assigned', 'preparing'].includes(g.status);
    const scroll = el.scrollTop;
    el.classList.add('open');
    el.innerHTML = `<div class="card d-card">
      <div class="d-head"><div><div class="label">Waiting Guest</div><h2>${esc(g.wgNumber)}</h2></div><div style="display:flex;gap:8px;align-items:center">${statusPill(g.status)}<button class="icon-btn detail-close" id="dClose" aria-label="Close">✕</button></div></div>
      <div class="d-sub"><b style="color:var(--ink)">${esc(g.guestName)}</b> · ${esc(g.confirmationNo)}</div>
      ${done ? '' : `<div class="d-time"><b class="num" data-since="${esc(ready ? g.timestamps.roomReady : g.timestamps.created)}">0:00</b><span>${ready ? 'Room ready for' : 'Waiting'}</span></div>`}
      <div class="d-sec"><div class="kv">
        <div><span>Room type</span><b>${esc(g.roomType)} · ${esc(typeName(g.roomType))}</b></div><div><span>Guests</span><b>${pax(g)}</b></div>
        <div><span>Arrival</span><b>${fmtDate(g.arrivalDate)} ${esc(g.arrivalTime || '')}</b></div><div><span>Departure</span><b>${fmtDate(g.departureDate)}</b></div>
        <div><span>Luggage tag</span><b>${esc(g.luggageTag || '-')}</b></div><div><span>Associate</span><b>${esc(g.associate || '-')}</b></div>
        <div><span>Guest language</span><b>${esc(langInfo(g.language).name)}</b></div></div></div>
      ${g.preferences || g.remarks ? `<div class="d-sec">${g.preferences ? `<div class="pref-box"><span>Guest preferences</span>${esc(g.preferences)}</div>` : ''}${g.remarks ? `<div class="pref-box rem"><span>Remarks</span>${esc(g.remarks)}</div>` : ''}</div>` : ''}
      <div class="d-sec"><div class="section-label">Room</div>
        ${g.roomNumber ? `<div style="margin-bottom:10px"><span class="muted">Assigned:</span> <b class="serif" style="font-size:22px">${esc(g.roomNumber)}</b></div>` : ''}
        ${canPick ? (d.rooms.length ? `<div class="room-grid" id="roomGrid">${d.rooms.map((r) => `<button class="rm hk-${r.hkStatus}${r.matchesType ? '' : ' other'}${pending === r.roomNumber ? ' on' : ''}" data-room="${esc(r.roomNumber)}" title="${esc(r.roomType)} · ${esc(typeName(r.roomType))}"><b>${esc(r.roomNumber)}</b><small>${esc(r.roomType)} · ${r.hkStatus === 'inspected' ? 'insp.' : esc(r.hkStatus)}</small></button>`).join('')}</div>
          <p class="legend-note">Rooms of the guest's type (${esc(g.roomType)}) are listed first; faded rooms are a different type.</p>
          <button class="btn btn-primary" id="assignBtn" style="margin-top:10px;width:100%" ${pending && pending !== g.roomNumber ? '' : 'disabled'}>${g.roomNumber ? 'Change room' : 'Assign room'}${pending && pending !== g.roomNumber ? ' ' + esc(pending) : ''}</button>`
          : `<div class="banner info">${icon('alert')}<span>No rooms are available. An admin needs to import rooms, or a room must be released.</span></div>`) : ''}
      </div>
      <div class="d-sec"><div class="section-label">Status</div>${stepsHtml(g)}
        <div class="act">
          ${g.status === 'room_assigned' ? `<button class="btn btn-ghost" data-status="preparing">Room being prepared</button>` : ''}
          ${['room_assigned', 'preparing'].includes(g.status) ? `<button class="btn btn-ready" data-status="ready">${icon('key')} Mark room ready</button>` : ''}
          ${g.status === 'waiting' ? `<div class="muted" style="font-size:12.5px">Assign a room to continue.</div>` : ''}
          ${ready ? `<div class="muted" style="font-size:12.5px">Guest has been notified on their QR page. Reception completes the record when the guest returns.</div>` : ''}
          ${!done ? `<label class="toggle"><input type="checkbox" id="priTgl" ${g.priority ? 'checked' : ''}> Operational priority</label><button class="btn btn-ghost btn-sm btn-danger" id="cancelWgBtn" style="align-self:flex-start">Cancel this Waiting Guest</button>` : ''}
        </div></div>
      <div class="d-sec"><div class="section-label">History</div><div class="kv" style="grid-template-columns:1fr">${d.history.map((h) => `<div style="display:flex;justify-content:space-between;gap:10px"><b style="font-weight:600">${esc(STATUS_LABEL[h.to] || h.to)}${h.roomNumber ? ' · ' + esc(h.roomNumber) : ''}${h.note ? ` <span class="muted" style="font-weight:400">(${esc(h.note)})</span>` : ''}</b><span class="muted num">${fmtClock(h.at)} · ${esc(h.by || '')}</span></div>`).join('')}</div></div>
    </div>`;
    el.scrollTop = scroll;
    tickTimers();
    $('#dClose').onclick = closeDetail;
    $$('#roomGrid .rm').forEach((b) => b.onclick = () => { S.pendingRoom = { id: g.id, room: b.dataset.room }; renderDetail(d); });
    const ab = $('#assignBtn');
    if (ab) ab.onclick = () => act(ab, () => api('POST', `/api/waiting-guests/${g.id}/assign-room`, { roomNumber: pending }), `Room ${pending} assigned to ${g.wgNumber}`, () => { S.pendingRoom = null; });
    $$('[data-status]').forEach((b) => b.onclick = async () => {
      const to = b.dataset.status;
      if (to === 'ready') {
        const ok = await confirmDialog({ title: `Mark room ${g.roomNumber} ready?`, body: `${esc(g.guestName)} will see <b>Your room is ready</b> on their QR page within seconds.`, confirmLabel: 'Mark ready' });
        if (!ok) return;
      }
      act(b, () => api('POST', `/api/waiting-guests/${g.id}/status`, { status: to }), to === 'ready' ? `${g.wgNumber} is ready. Guest notified.` : `${g.wgNumber} updated`);
    });
    const p = $('#priTgl');
    if (p) p.onchange = () => act(p, () => api('POST', `/api/waiting-guests/${g.id}/priority`, { priority: p.checked }), p.checked ? 'Priority on' : 'Priority off');
    const xb = $('#cancelWgBtn');
    if (xb) xb.onclick = async () => {
      const reason = await dialog({ title: `Cancel ${g.wgNumber}?`, body: 'Use this when the record was created by mistake or the guest no longer waits. Any assigned room is released.', confirmLabel: 'Cancel Waiting Guest', cancelLabel: 'Keep', input: { label: 'Reason (required)', min: 3, error: 'Please give a short reason' } });
      if (!reason) return;
      act(xb, () => api('POST', `/api/waiting-guests/${g.id}/cancel`, { reason }), `${g.wgNumber} cancelled`);
    };
  }
  async function act(btn, fn, okMsg, after) {
    btn.classList.add('loading'); btn.disabled = true;
    try { await fn(); if (after) after(); toast(okMsg); await loadQueue(); }
    catch (e) { if (!e.silent) toast(e.message, 'err'); btn.classList.remove('loading'); btn.disabled = false; await loadQueue(); }
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.querySelector('.modal-overlay')) closeDetail(); });

  (async function init() {
    try {
      const meta = await api('GET', '/api/meta');
      S.roomTypes = meta.roomTypes; S.late1 = meta.lateWarnMinutes || 30; S.late2 = meta.lateAlertMinutes || 60;
      renderDetailEmpty();
      $('#queue').innerHTML = '<div class="skeleton" style="height:84px"></div><div class="skeleton" style="height:84px"></div><div class="skeleton" style="height:84px"></div>';
      await loadQueue();
      WG.stopLive = live(loadQueue, setLive);
    } catch (e) { if (!e.silent) toast(e.message, 'err'); }
  })();
};

/* ---- 40-admin.js ---- */
'use strict';
/* Admin: overview, arrivals/rooms import, users, export. */
WG.views.admin = function (root, user) {
  const S = { tab: 'overview', users: [], metrics: null, summary: null, roomTypes: {}, imp: null };

  root.innerHTML = `<div id="topbar"></div>
    <div class="ad-wrap"><nav class="ad-tabs" role="tablist" id="adTabs">
      <button role="tab" data-tab="overview">Overview</button><button role="tab" data-tab="arrivals">Import arrivals</button>
      <button role="tab" data-tab="rooms">Import rooms</button><button role="tab" data-tab="users">Users</button><button role="tab" data-tab="export">Export</button></nav>
    <main id="adBody" aria-live="polite"></main></div>`;
  mountTopbar(user, 'Admin');

  const tabs = $('#adTabs');
  tabs.addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
  function go(tab) {
    S.tab = tab; S.imp = null;
    $$('#adTabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    ({ overview, arrivals: () => importer('arrivals'), rooms: () => importer('rooms'), users, export: exportView })[tab]();
  }
  const body = () => $('#adBody');
  const err = (e) => { if (!e.silent) toast(e.message, 'err'); };

  /* ---------- overview ---------- */
  async function overview(quiet) {
    if (!quiet) body().innerHTML = '<div class="skeleton" style="height:120px"></div>';
    try {
      const [sum, m] = await Promise.all([api('GET', '/api/admin/summary'), api('GET', '/api/metrics')]);
      S.summary = sum; S.metrics = m;
      const warn = [];

  /* ---------- CSV import (arrivals or rooms) ---------- */
  function importer(kind) {
    const isArr = kind === 'arrivals';
    const base = isArr ? '/api/import/arrivals' : '/api/import/rooms';
    S.imp = { csv: '', map: null, replaceAll: false };
    body().innerHTML = `<div class="card panel"><h2 class="serif">${isArr ? "Import today's arrivals" : 'Import rooms'}</h2>
      <p class="muted">${isArr ? 'Export the arrivals report from Opera and save it as <b>CSV</b> (in Excel: File → Save As → CSV). Dates are read day first (dd/mm/yyyy).' : 'Upload a CSV of rooms with room number, room type, and optionally building, floor and housekeeping status.'} Nothing is saved until you review the preview and confirm.</p>
      <div class="drop" id="drop"><input type="file" id="file" accept=".csv,.txt,text/csv" class="sr-only"><label for="file" class="btn btn-ghost">${icon('upload')} Choose CSV file</label><span class="muted" id="fname">or paste the contents below</span></div>
      <textarea class="in mono" id="paste" rows="5" placeholder="Paste CSV text here" spellcheck="false"></textarea>
      <div class="actions"><button class="btn btn-primary" id="previewBtn">Preview</button></div>
      <div id="impOut"></div></div>`;
    $('#file').addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 2_000_000) return toast('File is too large (max about 2 MB)', 'err');
      $('#paste').value = await f.text(); $('#fname').textContent = f.name;
    });
    $('#previewBtn').onclick = () => preview();
    async function preview(map) {
      const csv = $('#paste').value;
      if (!csv.trim()) return toast('Choose a file or paste CSV first', 'err');
      const b = $('#previewBtn'); b.classList.add('loading');
      try {
        S.imp.csv = csv; S.imp.map = map || null;
        const p = await api('POST', base + '/preview', { csv, map: map || undefined });
        renderPreview(p);
      } catch (e) { err(e); } finally { b.classList.remove('loading'); }
    }
    function renderPreview(p) {
      const sel = (f) => `<label class="field"><span>${esc(f.label)}${f.required ? ' *' : ''}</span><select class="in mapSel" data-key="${f.key}"><option value="">(not in file)</option>${p.headers.map((h, i) => `<option value="${i}" ${p.map[f.key] === i ? 'selected' : ''}>${esc(h || 'Column ' + (i + 1))}</option>`).join('')}</select></label>`;
      const canImport = !p.missing.length && p.validCount > 0;
      $('#impOut').innerHTML = `<hr><div class="section-label">Columns found (header on line ${p.headerLine})</div>
        <details ${p.missing.length ? 'open' : ''} class="map"><summary>${p.missing.length ? `<b style="color:var(--danger)">Required columns missing: ${p.missing.map(esc).join(', ')}. Match them below.</b>` : 'Review or change column matching'}</summary>
        <div class="form-grid" style="margin-top:12px">${p.fields.map(sel).join('')}</div><div class="actions"><button class="btn btn-ghost btn-sm" id="remap">Re-check with these columns</button></div></details>
        <div class="ad-cards" style="margin-top:12px"><div class="metric good"><span>Valid rows</span><b>${p.validCount}</b></div><div class="metric ${p.errorCount ? 'hot' : ''}"><span>Rows with errors</span><b>${p.errorCount}</b></div><div class="metric"><span>Warnings</span><b>${p.warningCount}</b></div></div>
        ${p.errorCount ? `<div class="banner err" style="margin-top:12px"><span><b>These rows will be skipped:</b><br>${p.errors.map((x) => `Line ${x.line}: ${esc(x.message)}`).join('<br>')}${p.errorCount > p.errors.length ? `<br>…and ${p.errorCount - p.errors.length} more` : ''}</span></div>` : ''}
        ${p.warningCount ? `<div class="banner info" style="margin-top:10px"><span>${p.warnings.map((x) => `Line ${x.line}: ${esc(x.message)}`).join('<br>')}</span></div>` : ''}
        ${p.sample.length ? `<div class="section-label" style="margin-top:14px">First rows as they will be saved</div><div style="overflow:auto"><table class="tbl"><thead><tr>${Object.keys(p.sample[0]).map((k) => `<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${p.sample.map((r) => `<tr>${Object.keys(r).map((k) => `<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : ''}
        ${isArr ? `<label class="toggle" style="margin-top:14px"><input type="checkbox" id="replaceAll"> Replace all existing reservations (removes older ones)</label>` : ''}
        <div class="actions"><button class="btn btn-primary" id="commitBtn" ${canImport ? '' : 'disabled'}>Import ${p.validCount} row${p.validCount === 1 ? '' : 's'}${p.errorCount ? ' (skip errors)' : ''}</button></div>`;
      const rm = $('#remap'); if (rm) rm.onclick = () => { const map = {}; $$('.mapSel').forEach((s) => { map[s.dataset.key] = s.value === '' ? -1 : Number(s.value); }); preview(map); };
      $('#commitBtn').onclick = async () => {
        const replaceAll = isArr && $('#replaceAll').checked;
        const ok = await confirmDialog({ title: `Import ${p.validCount} row${p.validCount === 1 ? '' : 's'}?`, body: replaceAll ? '<b>All existing reservations will be replaced.</b> Waiting Guests already created are not affected.' : 'Existing rows with the same key are updated; new ones are added.', confirmLabel: 'Import' });
        if (!ok) return;
        const b = $('#commitBtn'); b.classList.add('loading');
        try {
          const r = await api('POST', base, { csv: S.imp.csv, map: S.imp.map || undefined, allowErrors: true, replaceAll });
          toast(`Imported: ${r.added} added, ${r.updated} updated${r.skipped ? `, ${r.skipped} skipped` : ''}`);
          go('overview');
        } catch (e) { b.classList.remove('loading'); err(e); }
      };
    }
  }

  /* ---------- users ---------- */
  async function users() {
    body().innerHTML = '<div class="skeleton" style="height:120px"></div>';
    try {
      S.users = (await api('GET', '/api/users')).users;
      body().innerHTML = `<div class="card panel"><h2 class="serif">Staff users</h2>
        <p class="muted">Passwords are generated for you and shown once. Share them privately; staff can change them from the top bar.</p>
        <div style="overflow:auto"><table class="tbl"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
        ${S.users.map((u) => `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td><td>${esc(ROLE_NAME[u.role] || u.role)}</td><td>${u.active ? '<span class="pill st-ready">Active</span>' : '<span class="pill st-completed">Inactive</span>'}</td>
          <td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" data-reset="${u.id}">Reset password</button> <button class="btn btn-ghost btn-sm" data-active="${u.id}" data-to="${u.active ? 0 : 1}">${u.active ? 'Deactivate' : 'Activate'}</button></td></tr>`).join('')}</tbody></table></div>
        <hr><h3 class="serif" style="font-size:18px">Add a user</h3>
        <form id="newUser" class="form-grid" style="margin-top:12px">
          <label class="field"><span>Full name</span><input class="in" id="nuName" maxlength="80" required></label>
          <label class="field"><span>Username</span><input class="in" id="nuUser" maxlength="32" autocapitalize="none" required></label>
          <label class="field"><span>Role</span><select class="in" id="nuRole"><option value="reception">Reception</option><option value="rooms_controller">Rooms Controller</option><option value="admin">Admin</option></select></label>
          <div class="field"><span>&nbsp;</span><button class="btn btn-primary" type="submit" id="nuGo">${icon('plus')} Create user</button></div></form></div>`;
      $('#newUser').addEventListener('submit', async (e) => {
        e.preventDefault(); const b = $('#nuGo'); b.classList.add('loading');
        try { const r = await api('POST', '/api/users', { name: $('#nuName').value, username: $('#nuUser').value, role: $('#nuRole').value }); await shownPassword(`User created: ${r.user.username}`, r.password); users(); }
        catch (ex) { b.classList.remove('loading'); err(ex); }
      });
      body().onclick = async (e) => {
        const r = e.target.closest('[data-reset]'), a = e.target.closest('[data-active]');
        if (r) {
          const u = S.users.find((x) => x.id === Number(r.dataset.reset));
          if (!(await confirmDialog({ title: `Reset password for ${u.username}?`, body: 'Their current password stops working and they are signed out.', confirmLabel: 'Reset' }))) return;
          try { const out = await api('POST', `/api/users/${u.id}/reset-password`, {}); await shownPassword(`New password for ${u.username}`, out.password); } catch (ex) { err(ex); }
        }
        if (a) { try { await api('POST', `/api/users/${a.dataset.active}/active`, { active: a.dataset.to === '1' }); users(); } catch (ex) { err(ex); } }
      };
    } catch (e) { err(e); }
  }
  function shownPassword(title, pw) {
    return dialog({ title, body: `<p>Copy this password now. It is <b>not shown again</b>.</p><div class="pw-box" id="pwShow">${esc(pw)}</div>`, confirmLabel: 'I have copied it', cancelLabel: '' });
  }

  /* ---------- export ---------- */
  function exportView() {
    body().innerHTML = `<div class="card panel"><h2 class="serif">Export Waiting Guests</h2>
      <p class="muted">Every Waiting Guest with all timestamps (created, room assigned, preparation started, room ready, guest notified, guest returned, completed). Use it to compare the digital process with the old manual one. Contains guest names: handle it as confidential.</p>
      <div class="actions"><button class="btn btn-primary" id="exGo">${icon('download')} Download CSV</button></div></div>`;
    $('#exGo').onclick = async () => {
      const b = $('#exGo'); b.classList.add('loading');
      try {
        const { csv } = await api('GET', '/api/export/waiting-guests');
        const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
        const a = document.createElement('a'); a.href = url; a.download = `waiting-guests-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch (e) { err(e); } finally { b.classList.remove('loading'); }
    };
  }

  (async function init() {
    try { S.roomTypes = (await api('GET', '/api/meta')).roomTypes; } catch (e) { err(e); }
    go('overview');
    WG.stopLive = live(() => { if (S.tab === 'overview') overview(true); }, setLive, { baseMs: 8000 });
  })();
};

    map: '<path d="M9 20l-6-3V5l6 3m0 12l6-3m-6 3V8m6 9l6 3V7l-6-3m0 15V5m0 0L9 8"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    hourglass: '<path d="M6 2h12M6 22h12M7 2v4a5 5 0 0 0 2 4l3 2-3 2a5 5 0 0 0-2 4v4M17 2v4a5 5 0 0 1-2 4l-3 2 3 2a5 5 0 0 1 2 4v4"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L21 2M16 7l3 3"/>',
    heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
    chev: '<path d="M6 9l6 6 6-6"/>',
  };
  const svg = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ''}</svg>`;
  const fmtD = (d) => (d ? new Date(d + 'T00:00:00').toLocaleDateString(langInfo(lang).locale, { weekday: 'short', day: 'numeric', month: 'short' }) : '-');
  const T = (k) => (WG_I18N[lang] && WG_I18N[lang][k]) || WG_I18N.en[k] || k;
  const pick = (o) => (o && (o[lang] || o.en)) || '';
  const HERO = {
    preparing: { cls: '', icon: 'hourglass', eyebrow: 'roomStatus', title: 'preparingTitle', text: null },
    ready: { cls: 'ready', icon: 'key', eyebrow: 'roomStatus', title: 'readyTitle', text: 'readyText' },
    completed: { cls: 'done', icon: 'heart', eyebrow: 'doneEyebrow', title: 'doneTitle', text: 'doneText' },
    cancelled: { cls: 'done', icon: 'info', eyebrow: 'cancelEyebrow', title: 'cancelTitle', text: 'cancelText' },
  };

  let lang = 'en';
  const storedLang = () => { try { const l = localStorage.getItem('wg-guest-lang'); return WG_LANGS.some((x) => x.code === l) ? l : null; } catch (e) { return null; } };
  function applyLang(l) {
    lang = l;
    const info = langInfo(l);
    document.documentElement.lang = l;
    document.documentElement.dir = info.dir;
  }

  let data = null, phase = null, version = null, timer = null, fails = 0;
  root.innerHTML = `<div class="g-shell"><header class="g-top"><div class="logo-chip"><img src="${WG_ASSETS.logo}" alt="Rixos Bab Al Bahr"></div></header>
    <main id="gApp" aria-live="polite"><div class="hero skeleton-hero"><div class="skeleton" style="height:22px;width:50%;margin:0 auto"></div><div class="skeleton" style="height:64px;margin-top:18px"></div></div></main>
    <footer class="g-foot">Rixos Bab Al Bahr</footer></div>`;
  const app = $('#gApp');

  function render() {
    const { waitingGuest: g, content: c } = data;
    const h = HERO[g.phase] || HERO.preparing;
    const welcome = pick(c.welcome);
    const idx = { preparing: 1, ready: 2, completed: 3, cancelled: 0 }[g.phase];
    const P = [T('stepReceived'), T('stepPreparing'), T('stepReady')];
    const prog = g.phase === 'cancelled' ? '' : `<div class="progress" aria-label="Progress">${P.map((l, i) => {
      const on = i < idx || (i === idx && g.phase !== 'preparing') || g.phase === 'completed';
      const cur = i === idx && g.phase === 'preparing';
      return `<div class="p ${on ? 'on' : ''} ${cur ? 'cur' : ''}"><i></i>${l}</div>${i < P.length - 1 ? `<div class="ln ${i < idx ? 'on' : ''}"></div>` : ''}`;
    }).join('')}</div><div style="height:14px"></div>`;
    const link = (l, ic, label, sub) => l && l.url
      ? `<a class="link-btn" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${svg(ic)}${esc(label)}<small>${esc(sub)}</small></a>`
      : `<div class="link-btn off" aria-disabled="true">${svg(ic)}${esc(label)}<small>${esc(T('comingSoon'))}</small></div>`;
    const showInfo = g.phase !== 'cancelled';
    const switcher = `<nav class="lang" aria-label="${esc(T('language'))}">${WG_LANGS.map((l) => `<button type="button" data-lang="${l.code}" lang="${l.code}" class="${l.code === lang ? 'on' : ''}" aria-pressed="${l.code === lang}">${l.name}</button>`).join('')}</nav>`;
    app.innerHTML = `${switcher}
      <section class="hero ${h.cls}" aria-labelledby="st">
        <div class="badge">${svg(h.icon)}</div><div class="eyebrow">${esc(T(h.eyebrow))}</div>
        <h1 id="st">${esc(T(h.title))}</h1><p>${esc(h.text ? T(h.text) : welcome)}</p>
        <div class="ref"><span>${esc(T('wgNumber'))}</span><b dir="ltr">${esc(g.wgNumber)}</b></div>
      </section>
      <section class="card g-card" aria-label="${esc(T('guest'))}"><div class="kv">
        <div><span>${esc(T('guest'))}</span><b>${esc(g.guestName)}</b></div><div><span>${esc(T('confirmation'))}</span><b dir="ltr" style="text-align:start">${esc(g.confirmationNo)}</b></div>
        <div><span>${esc(T('roomType'))}</span><b dir="ltr" style="text-align:start">${esc(g.roomType)}</b></div><div><span>${esc(T('arrival'))}</span><b>${fmtD(g.arrivalDate)}${g.arrivalTime ? ' · ' + esc(g.arrivalTime) : ''}</b></div></div>${prog}</section>
      ${showInfo ? `<h2 class="sec-title wait-title">${esc(g.phase === 'ready' ? T('around') : T('whileWait'))}</h2>
      <p class="wait-sub">${esc(g.phase === 'ready' ? T('aroundSub') : welcome)}</p>
      <div class="links">${link(c.links.map, 'map', T('map'), T('mapSub'))}${link(c.links.website, 'globe', T('website'), c.hotelName)}</div>
      <div class="cards">${c.sections.map((s) => `<details class="tile"><summary><span class="ic">${svg(s.icon)}</span><span class="tt">${esc(pick(s.title))}</span><span class="chev">${svg('chev')}</span></summary>
        <div class="body">${esc(pick(s.body))}${pick(s.note) ? `<div style="margin-top:8px;font-size:12.5px">${esc(pick(s.note))}</div>` : ''}${s.placeholder ? `<div><span class="soon">${esc(T('detailsSoon'))}</span></div>` : ''}</div></details>`).join('')}</div>
      <p class="notice">${esc(T('notice'))}</p>` : ''}`;
    $$('.lang button', app).forEach((b) => b.addEventListener('click', () => {
      try { localStorage.setItem('wg-guest-lang', b.dataset.lang); } catch (e) { /* remembered for this page only */ }
      const wasOpen = $$('details.tile', app).map((d) => d.open); // keep the cards the guest had opened
      applyLang(b.dataset.lang);
      render();
      $$('details.tile', app).forEach((d, i) => { d.open = !!wasOpen[i]; });
    }));
    if (phase && phase !== g.phase) {
      try { navigator.vibrate && navigator.vibrate(g.phase === 'ready' ? [120, 60, 120] : 40); } catch (e) { /* not supported */ }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    document.title = (g.phase === 'ready' ? T('tabTitleReady') : T('tabTitle')) + ' · Rixos Bab Al Bahr';
    phase = g.phase;
  }

  function conn(ok) {
    let el = document.getElementById('conn');
    if (ok) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'conn'; el.className = 'conn'; el.textContent = T('reconnecting'); document.body.appendChild(el); }
  }

  async function load() {
    try {
      const r = await transport('GET', `/api/guest/${encodeURIComponent(token)}${version !== null && data ? `?v=${version}&have=1` : ''}`);
      if (r.status === 404) { applyLang(storedLang() || 'en'); app.innerHTML = `<div class="err-view"><h1>${esc(T('invalidTitle'))}</h1><p class="muted">${esc(T('invalidText'))}</p></div>`; stop(); return; }
      if (r.status === 0 || r.status >= 500) throw new Error('unavailable');
      if (r.status >= 400) throw new Error('bad');
      fails = 0; conn(true);
      if (r.body.unchanged) return;
      version = r.body.version;
      const changed = !data || JSON.stringify(data.waitingGuest) !== JSON.stringify(r.body.waitingGuest);
      const firstLoad = !data;
      data = r.body;
      if (firstLoad) applyLang(storedLang() || data.waitingGuest.language || 'en'); // guest's own choice wins over Reception's
      if (changed || firstLoad) render(); // only redraw on a real change, so open cards and scroll position are left alone
    } catch (e) { fails++; if (fails >= 2) conn(false); }
  }
  function stop() { clearTimeout(timer); timer = null; }
  function loop() {
    stop();
    timer = setTimeout(async () => { if (!document.hidden) await load(); loop(); }, fails ? Math.min(30000, 6000 * (fails + 1)) : 6000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && timer !== null) load(); });
  load().then(loop);
};

/* ---- 99-boot.js ---- */
'use strict';
(async function boot() {
  const root = $('#root');
  if (WG.boot.mode === 'guest') return WG.views.guest(root, WG.boot.token);
  const t = storedToken();
  if (t) {
    WG.token = t;
    try { const { user } = await api('GET', '/api/me'); return mountForUser(user); } catch (e) { if (!e.silent) { forgetToken(); showLogin(); } return; }
  }
  showLogin();
})();

</script>
</body>
</html>
