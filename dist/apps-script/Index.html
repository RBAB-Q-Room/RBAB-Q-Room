<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Waiting Guest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>

/* Design tokens are inherited from Room Guide (same hospitality product family). */
:root {
  --paper: #F7F5F1;
  --panel: #FFFFFF;
  --ink: #2B2118;
  --ink-soft: #6B5D4F;
  --line: #E6DFD3;
  --bronze: #6B4E33;
  --bronze-deep: #4F3A26;
  --bronze-soft: #EFE4D2;
  --gold-accent: #C9A24B;
  --shadow: 0 10px 28px rgba(43, 33, 24, 0.09);
  --shadow-sm: 0 3px 10px rgba(43, 33, 24, 0.08);
  --danger: #B0532E;
  --danger-soft: #F6E4DD;

  /* Waiting Guest status palette (evolved from Room Guide's room-type colours) */
  --s-waiting: #B57A12;   --s-waiting-bg: #FBF0D6;
  --s-assigned: #3D6FA8;  --s-assigned-bg: #E3EDF8;
  --s-preparing: #7A55A3; --s-preparing-bg: #EFE7F7;
  --s-ready: #2F7F5A;     --s-ready-bg: #DDF1E6;
  --s-returned: #23695C;  --s-returned-bg: #D9EEEA;
  --s-completed: #6E747B; --s-completed-bg: #ECEDEF;

  --radius: 12px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
  font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html[data-theme="dark"] {
  --paper: #191510; --panel: #221C15; --ink: #EEE7DC; --ink-soft: #AB9C8B; --line: #382E23;
  --bronze: #D2AC76; --bronze-deep: #E7C98F; --bronze-soft: #33291C; --gold-accent: #E3B23C;
  --shadow: 0 10px 28px rgba(0,0,0,.35); --shadow-sm: 0 3px 10px rgba(0,0,0,.3);
  --danger: #E08052; --danger-soft: #3A2419;
  --s-waiting: #E3B23C;   --s-waiting-bg: #3A2E14;
  --s-assigned: #7FAEE0;  --s-assigned-bg: #1D2C40;
  --s-preparing: #B995DC; --s-preparing-bg: #2E2340;
  --s-ready: #6FCB9C;     --s-ready-bg: #17372A;
  --s-returned: #63C2B0;  --s-returned-bg: #16332E;
  --s-completed: #A3A9B0; --s-completed-bg: #2B2E31;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; } /* class display rules (banner, field-error) must not override the hidden attribute */
html, body { margin: 0; background: var(--paper); color: var(--ink); transition: background .2s ease, color .2s ease; }
body { font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
button { font-family: inherit; }
h1, h2, h3 { margin: 0; }
.serif { font-family: "Source Serif 4", Georgia, serif; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-soft); }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- Top bar (same structure as Room Guide) ---------- */
header.topbar { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 40; box-shadow: var(--shadow-sm); }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 24px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo-chip { background: #fff; border-radius: 6px; padding: 4px 8px; display: flex; align-items: center; box-shadow: var(--shadow-sm); }
.logo-chip img { height: 26px; display: block; }
.brand .divider { width: 1px; height: 26px; background: var(--line); }
.wordmark { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 19px; letter-spacing: .01em; white-space: nowrap; }
.tagline { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; margin-top: 1px; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.user-chip { font-size: 12.5px; color: var(--ink-soft); padding-right: 4px; }
.user-chip b { color: var(--ink); font-weight: 700; }
.live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
.live-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--s-ready); box-shadow: 0 0 0 0 var(--s-ready); animation: pulse 2s infinite; }
.live-dot.off::before { background: var(--danger); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--s-ready) 55%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ---------- Buttons ---------- */
.text-btn, .icon-btn { border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; font-weight: 600; transition: border-color .15s, color .15s, background .15s, transform .1s; }
.text-btn { padding: 8px 14px; border-radius: 18px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.text-btn:hover, .icon-btn:hover { border-color: var(--bronze); color: var(--bronze-deep); }
.btn { border: 1px solid transparent; border-radius: 10px; padding: 11px 18px; min-height: 44px; font-size: 13.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .1s, box-shadow .15s, opacity .15s; text-decoration: none; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn-primary { background: var(--bronze); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--bronze-deep); }
html[data-theme="dark"] .btn-primary { color: #1b140c; }
.btn-ghost { background: var(--paper); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { border-color: var(--bronze); color: var(--bronze-deep); }
.btn-ready { background: var(--s-ready); color: #fff; }
.btn-ready:hover:not(:disabled) { filter: brightness(.92); }
html[data-theme="dark"] .btn-ready { color: #0d2418; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { min-height: 34px; padding: 6px 12px; font-size: 12.5px; border-radius: 9px; }
.btn.loading { position: relative; color: transparent !important; pointer-events: none; }
.btn.loading::after { content: ""; position: absolute; width: 16px; height: 16px; border: 2px solid #fff; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span, .label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-soft); }
.field .opt { font-weight: 500; text-transform: none; letter-spacing: 0; }
input.in, textarea.in, select.in { border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 11px 12px; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 500; width: 100%; min-height: 44px; transition: border-color .15s, box-shadow .15s; }
textarea.in { resize: vertical; min-height: 64px; }
.in:focus { outline: none; border-color: var(--bronze); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bronze) 18%, transparent); }
.in[aria-invalid="true"] { border-color: var(--danger); }
.field-error { font-size: 12px; color: var(--danger); }
.search-box { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 26px; padding: 4px 8px 4px 18px; background: var(--panel); box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s; }
.search-box:focus-within { border-color: var(--bronze); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bronze) 16%, transparent); }
.search-box input { flex: 1; border: none; background: transparent; outline: none; font: inherit; font-size: 16px; font-weight: 500; color: var(--ink); min-height: 46px; min-width: 0; }
.search-box input::placeholder { color: var(--ink-soft); font-weight: 400; }
kbd { font: inherit; font-size: 10px; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }

/* ---------- Cards / pills / banners ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); }
.section-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 14px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-waiting { color: var(--s-waiting); background: var(--s-waiting-bg); }
.st-room_assigned { color: var(--s-assigned); background: var(--s-assigned-bg); }
.st-preparing { color: var(--s-preparing); background: var(--s-preparing-bg); }
.st-ready { color: var(--s-ready); background: var(--s-ready-bg); }
.st-returned { color: var(--s-returned); background: var(--s-returned-bg); }
.st-completed { color: var(--s-completed); background: var(--s-completed-bg); }
.type-pill { background: var(--bronze-soft); color: var(--bronze-deep); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; letter-spacing: .02em; }
.banner { padding: 10px 14px; border-radius: 10px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.banner.err { background: var(--danger-soft); color: var(--danger); }
.banner.info { background: var(--bronze-soft); color: var(--bronze-deep); }
.empty { text-align: center; padding: 36px 20px; color: var(--ink-soft); }
.empty svg { width: 40px; height: 40px; stroke-width: 1.5; opacity: .7; margin-bottom: 8px; }
.empty b { display: block; color: var(--ink); font-family: "Source Serif 4", Georgia, serif; font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.skeleton { background: linear-gradient(90deg, var(--line), color-mix(in srgb, var(--line) 40%, var(--panel)), var(--line)); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 18px; }
.kv > div > span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
.kv > div > b { font-weight: 600; font-size: 13.5px; word-break: break-word; }

/* ---------- Toast ---------- */
#toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(92vw, 420px); pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow); animation: toastIn .3s var(--ease); display: flex; gap: 10px; align-items: center; }
.toast.err { background: var(--danger); color: #fff; }
.toast.out { opacity: 0; transform: translateY(8px); transition: all .3s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.97); } }

/* ---------- Modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(25, 20, 14, .5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade .2s; }
.modal-box { background: var(--panel); border-radius: 16px; padding: 26px; max-width: 420px; width: 100%; box-shadow: var(--shadow); animation: rise .25s var(--ease); }
.modal-box h2 { font-family: "Source Serif 4", Georgia, serif; font-size: 21px; font-weight: 600; margin-bottom: 6px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }

/* ---------- Auth ---------- */
.auth-gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-card { padding: 36px 34px 30px; width: 100%; max-width: 360px; text-align: center; animation: rise .4s var(--ease); }
.auth-logo { background: #fff; display: inline-flex; padding: 8px 14px; border-radius: 8px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
.auth-logo img { height: 32px; }
.auth-card h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 24px; margin-bottom: 4px; }
.auth-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 22px; }
.auth-card form { display: flex; flex-direction: column; gap: 14px; text-align: left; }
@media (max-width: 900px) {
  .topbar-inner { padding: 10px 16px; flex-wrap: nowrap; }
  .user-chip, .brand .divider, .tagline { display: none; }
  .header-actions { flex-wrap: nowrap; gap: 6px; }
  #pwBtn { display: none; } /* still reachable on a wider screen; keeps the phone top bar on one line */
}

/* ================= Shared staff pieces (Reception + Rooms Controller) ================= */
/* priority reasons: plain words, never a mystery score */
.why { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--bronze-soft); color: var(--bronze-deep); white-space: nowrap; }
.why.strong { background: var(--danger-soft); color: var(--danger); }
.why.info { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); font-weight: 600; }
.why-wait:not(.strong) { background: var(--s-waiting-bg); color: var(--s-waiting); }
.flag { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--danger); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.flag.soft { background: var(--s-waiting-bg); color: var(--s-waiting); }
html[data-theme="dark"] .flag:not(.soft) { color: #1b140c; }

/* grouped details */
.groups { display: grid; gap: 14px; }
.groups section { display: grid; gap: 8px; }
.groups h3 { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
.groups dl { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
.groups dl div { min-width: 0; }
.groups dl div.wide { grid-column: 1 / -1; }
.groups dt { font-size: 11.5px; color: var(--ink-soft); }
.groups dd { margin: 0; font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl li { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 6px 0; position: relative; font-size: 13px; }
.tl li::before { content: ""; position: absolute; inset-inline-start: 58px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--bronze); box-shadow: 0 0 0 3px var(--panel); z-index: 1; }
.tl li::after { content: ""; position: absolute; inset-inline-start: 61.5px; top: 18px; bottom: -8px; width: 1px; background: var(--line); }
.tl li:last-child::after { display: none; }
.tl li.tl-guest::before { background: var(--s-ready); }
.tl time { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 12.5px; padding-top: 1px; }
.tl li > div { padding-inline-start: 18px; min-width: 0; display: grid; }
.tl b { font-weight: 600; }
.tl small { color: var(--ink-soft); font-size: 11.5px; }

/* guest engagement line */
.eng { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 7px; }
.eng::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.eng.ok { color: var(--s-ready); } .eng.ok::before { background: var(--s-ready); }
.eng.warn { color: var(--s-waiting); } .eng.warn::before { background: var(--s-waiting); }

.search-box.compact { padding: 2px 8px 2px 14px; box-shadow: none; border-radius: 22px; }
.search-box.compact input { min-height: 40px; font-size: 14px; }
.search-box.compact svg { opacity: .55; }

/* ================= Shared form/table bits + Management ================= */
.linkish { background: none; border: none; padding: 0; font: inherit; color: var(--bronze-deep); font-weight: 700; text-decoration: underline; cursor: pointer; }
.btn-danger { color: var(--danger); }
.btn-danger:hover:not(:disabled) { border-color: var(--danger) !important; color: var(--danger) !important; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
code { background: var(--bronze-soft); padding: 1px 6px; border-radius: 5px; font-size: 12px; word-break: break-all; }
.panel { padding: 22px; animation: rise .25s var(--ease); display: grid; gap: 14px; }
.panel > h2, .panel-head h2 { font-size: 24px; font-weight: 600; }
.panel hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.small { font-size: 12.5px; margin: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: start; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-weight: 700; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td, .tbl tr:last-child th { border-bottom: none; }
.tbl .num, .num { font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.drop { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
details.map summary { cursor: pointer; font-size: 13px; }
.pw-box { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 22px; font-weight: 700; letter-spacing: .04em; background: var(--bronze-soft); color: var(--bronze-deep); padding: 14px; border-radius: 10px; text-align: center; margin-top: 10px; user-select: all; word-break: break-all; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: none; background: transparent; padding: 7px 14px; min-height: 34px; border-radius: 16px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
.seg button.on { background: var(--bronze); color: #fff; }
html[data-theme="dark"] .seg button.on { color: #1b140c; }

.ad-wrap { max-width: 1120px; margin: 0 auto; padding-inline: 24px; padding-block: 18px 56px; display: grid; gap: 16px; }
#adBody { display: grid; gap: 14px; min-width: 0; }
.ad-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.ad-tabs button { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); padding: 0 16px; min-height: 40px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .13s; }
.ad-tabs button:hover { border-color: var(--bronze); }
.ad-tabs button.on { background: var(--bronze); border-color: var(--bronze); color: #fff; }
html[data-theme="dark"] .ad-tabs button.on { color: #1b140c; }
.ad-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.ad-h { font-size: 20px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px; }
.measured { font-family: "Plus Jakarta Sans", sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--s-ready); background: var(--s-ready-bg); padding: 3px 8px; border-radius: 6px; }
.illustrative { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--s-waiting); background: var(--s-waiting-bg); padding: 4px 9px; border-radius: 6px; }
.ad-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ad-cards .metric small, .metric small { display: block; font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.35; }
.metric { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.metric span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.metric b { font-family: "Source Serif 4", Georgia, serif; font-size: 26px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
.metric.hot b { color: var(--danger); } .metric.good b { color: var(--s-ready); }

/* chart */
:root { --chart: #A5652A; --chart-hl: #7E4B1C; }
html[data-theme="dark"] { --chart: #B87A30; --chart-hl: #D69A4E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --chart: #B87A30; --chart-hl: #D69A4E; } }
.chart-card { padding: 16px 18px 12px; display: grid; gap: 6px; }
.chart-card h3 { font-size: 14px; font-weight: 700; margin: 0; }
.chart-card h3 small { font-weight: 500; color: var(--ink-soft); font-size: 12px; margin-inline-start: 6px; }
.chart { position: relative; }
.chart { overflow-x: auto; }
.chart svg { max-width: none; height: 190px; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chart .yl, .chart .xl { fill: var(--ink-soft); font-size: 11px; font-family: "Plus Jakarta Sans", sans-serif; }
.chart .peak { fill: var(--ink); font-size: 11.5px; font-weight: 700; font-family: "Plus Jakarta Sans", sans-serif; }
.chart .bar { fill: var(--chart); transition: fill .12s; }
.chart .hit { fill: transparent; }
.chart .bar-g.hl .bar { fill: var(--chart-hl); }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 7px; white-space: nowrap; }
.chart-empty { margin: 0; font-size: 12.5px; }
.as-table summary { font-size: 12px; color: var(--ink-soft); cursor: pointer; }

/* business case */
.bc { padding: 20px 22px; display: grid; gap: 12px; }
.bc-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.bc-head h2 { font-size: 22px; font-weight: 600; }
.bc > .muted { margin: 0; font-size: 13px; max-width: 80ch; }
.bc-grid { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 22px; align-items: start; }
.bc-in { display: grid; gap: 10px; }
.unit-in { display: flex; align-items: center; gap: 8px; }
.unit-in input { max-width: 140px; }
.unit-in i { font-style: normal; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
.bc-res { min-width: 0; overflow-x: auto; }
.bc-out th[scope="row"] { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); font-weight: 600; white-space: normal; }
.bc-out td { font-family: "Source Serif 4", Georgia, serif; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bc-out .need { font-family: "Plus Jakarta Sans", sans-serif; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); font-style: italic; white-space: normal; }
.bc-basis, .bc-note { font-size: 12px; color: var(--ink-soft); margin: 6px 0 0; }

/* guest page editor */
.gp { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
.gp-list { padding: 18px; display: grid; gap: 8px; }
.gp-list h2 { font-size: 19px; font-weight: 600; }
.gp-list p { margin: 0; font-size: 12.5px; }
.gp-list ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.gp-list button { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 10px 12px; min-height: 44px; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer; text-align: start; }
.gp-list button:hover { background: var(--paper); }
.gp-list button.on { background: var(--bronze-soft); border-color: color-mix(in srgb, var(--bronze) 30%, transparent); }
.st { font-style: normal; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.st.ok { background: var(--s-ready-bg); color: var(--s-ready); }
.st.ph { background: var(--s-waiting-bg); color: var(--s-waiting); }
.st.off { background: var(--s-completed-bg); color: var(--s-completed); }
.gp-toggles { display: flex; gap: 8px 22px; flex-wrap: wrap; }
.st-group { border: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.st-group legend { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); padding: 0; margin-bottom: 8px; }
.st-group + .st-group { border-top: 1px solid var(--line); padding-top: 16px; }
.toggle.full { grid-column: 1 / -1; }
.data-seg { justify-self: start; }

@media (max-width: 900px) { .bc-grid, .gp { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .ad-wrap { padding-inline: 14px; } .ad-cards { grid-template-columns: 1fr 1fr; } }

/* records, danger zone */
.rec-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rec-tools .search-box { flex: 1 1 260px; max-width: 420px; }
.row-acts { white-space: nowrap; text-align: end; }
.row-acts .btn + .btn { margin-inline-start: 6px; }
.rec-tbl td { vertical-align: middle; }
.modal-box.wide { max-width: 620px; max-height: 90vh; overflow-y: auto; }
.mf-body { display: grid; gap: 12px; margin-top: 10px; }
.mf-body p { margin: 0; }
.btn-danger-solid { background: var(--danger); color: #fff; }
.btn-danger-solid:hover:not(:disabled) { filter: brightness(.92); }
html[data-theme="dark"] .btn-danger-solid { color: #1b140c; }
.danger-zone { border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.danger-zone p { margin: 0; max-width: 70ch; }

.rc-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; max-width: 1240px; margin: 0 auto; padding: 24px; align-items: start; }
.rc-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.hint { font-size: 12.5px; padding: 0 6px; }
.rc-side { position: sticky; top: 84px; max-height: calc(100vh - 100px); display: flex; flex-direction: column; }
.side-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
.side-head h2 { font-size: 19px; font-weight: 600; }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 2px; }
.seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
.seg button.on { background: var(--bronze); color: #fff; }
html[data-theme="dark"] .seg button.on { color: #1b140c; }
#list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 2px 8px; }

.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 14px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; color: inherit; font: inherit; transition: border-color .15s, box-shadow .15s, transform .15s; }
.row:hover { border-color: var(--bronze); box-shadow: var(--shadow-sm); }
.row.sel { border-color: var(--bronze); box-shadow: 0 0 0 2px color-mix(in srgb, var(--bronze) 25%, transparent); }
.row .top { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.row .wg { font-weight: 800; letter-spacing: .01em; }
.row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { grid-column: 1 / 2; font-size: 12px; color: var(--ink-soft); }
.row .end { grid-row: 1 / 3; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; justify-content: center; }
.row .t { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
.row.res .wg { color: var(--bronze-deep); }
.row.flash { animation: flash 1.4s var(--ease); }
@keyframes flash { 0% { background: var(--bronze-soft); } }
.group-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin: 4px 4px 0; }
#results { display: flex; flex-direction: column; gap: 8px; }

.panel { padding: 22px; animation: rise .3s var(--ease); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.panel-head h2 { font-size: 24px; font-weight: 600; }
.panel hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.auto-note { font-size: 12px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; margin: 4px 0 14px; }
.actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.actions .btn-primary { flex: 1; min-width: 220px; font-size: 15px; min-height: 50px; }

.success { text-align: center; padding: 28px 22px 24px; animation: rise .35s var(--ease); }
.success .tick { width: 54px; height: 54px; border-radius: 50%; background: var(--s-ready-bg); color: var(--s-ready); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; animation: pop .5s var(--ease); }
.success .tick svg { width: 26px; height: 26px; stroke-width: 2.6; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.big-wg { font-family: "Source Serif 4", Georgia, serif; font-size: 52px; font-weight: 600; letter-spacing: .02em; line-height: 1.05; color: var(--bronze-deep); margin: 4px 0; }
.qr { width: 220px; max-width: 70vw; margin: 14px auto 6px; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); }
.qr svg { width: 100%; height: auto; display: block; }
.link-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }

.verify { background: var(--bronze-soft); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.verify .kv > div > b { font-size: 15px; }
.ready-note { background: var(--s-ready-bg); color: var(--s-ready); padding: 10px 14px; border-radius: 10px; font-weight: 700; margin-bottom: 14px; display: flex; gap: 8px; align-items: center; }

@media (max-width: 960px) {
  .rc-wrap { grid-template-columns: 1fr; padding: 16px; }
  .rc-side { position: static; max-height: none; }
  .topbar-inner { padding: 10px 16px; }
}
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } .big-wg { font-size: 42px; } }

/* v1 additions */
.tagrow { display: flex; gap: 8px; flex-wrap: wrap; }
.tagbtn { border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); border-radius: 18px; padding: 0 14px; min-height: 38px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .13s; }
.tagbtn:hover { border-color: var(--bronze); }
.tagbtn[aria-pressed="true"] { background: var(--bronze-soft); border-color: var(--bronze); color: var(--bronze-deep); }
.tagbtn[aria-pressed="true"]::before { content: "✓ "; }
.seen-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--s-ready); flex-shrink: 0; align-self: center; }
.scan-state { margin: 4px 0 2px; }
.actions.top { margin-top: 0; }
.actions.top:empty { display: none; }
.actions.sec { margin-top: -6px; }
.eng-line { margin-top: -4px; }
.row .top { gap: 8px; align-items: center; }
.row .wg { font-size: 12px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.row .nm { font-weight: 700; }
.panel .groups { margin: 4px 0; }

/* ================= Rooms Controller ================= */
.rc-shell { max-width: 1500px; margin: 0 auto; padding-inline: 24px; padding-block: 14px 40px; display: grid; gap: 12px; }
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.metric { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 0; }
.metric span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.metric b { font-family: "Source Serif 4", Georgia, serif; font-size: 26px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.metric.hot b { color: var(--danger); } .metric.good b { color: var(--s-ready); }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar .search-box { flex: 1 1 260px; max-width: 380px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft); padding: 0 13px; min-height: 36px; border-radius: 18px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .13s; display: inline-flex; gap: 7px; align-items: center; }
.chip:hover { border-color: var(--bronze); color: var(--ink); }
.chip.on { background: var(--bronze); border-color: var(--bronze); color: #fff; }
.chip.warn:not(.on) { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
html[data-theme="dark"] .chip.on { color: #1b140c; }
.chip i { font-style: normal; opacity: .8; font-variant-numeric: tabular-nums; }
.sortsel select { min-height: 38px; padding: 6px 10px; font-size: 13px; width: auto; }

.rc-body { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 20px; align-items: start; }
#queue { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.qhead { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); margin: 8px 4px 2px; display: flex; gap: 8px; align-items: center; }
.qhead:first-child { margin-top: 0; }
.qhead span { background: var(--line); color: var(--ink); border-radius: 10px; padding: 1px 8px; font-size: 11px; }

/* queue card: timer first, then who, then why */
.q { --c: var(--s-waiting); display: grid; grid-template-columns: 4px 96px minmax(0, 1fr) auto; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: start; width: 100%; color: inherit; font: inherit; padding: 0; transition: border-color .15s, box-shadow .15s; }
.q:hover { border-color: var(--bronze); box-shadow: var(--shadow-sm); }
.q.sel { border-color: var(--bronze); box-shadow: 0 0 0 2px color-mix(in srgb, var(--bronze) 35%, transparent); }
.q.s-waiting { --c: var(--s-waiting); } .q.s-room_assigned { --c: var(--s-assigned); } .q.s-preparing { --c: var(--s-preparing); }
.q.s-ready, .q.s-returned { --c: var(--s-ready); }
.q .bar { background: var(--c); }
.q.lvl-high { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.q.lvl-high .bar { background: var(--danger); }
.q .timer { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 6px; border-inline-end: 1px solid var(--line); background: color-mix(in srgb, var(--c) 6%, var(--panel)); }
.q .timer b { font-family: "Source Serif 4", Georgia, serif; font-size: 22px; line-height: 1.05; font-weight: 600; color: var(--ink); text-align: center; white-space: nowrap; }
.q .timer small { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); margin-top: 4px; }
.q[data-wait="attention"] .timer b { color: var(--s-waiting); }
.q[data-wait="long"] .timer { background: color-mix(in srgb, var(--danger) 9%, var(--panel)); }
.q[data-wait="long"] .timer b { color: var(--danger); }
.q.s-ready .timer b, .q.s-returned .timer b { color: var(--s-ready); }
.q .main { padding: 10px 14px; min-width: 0; display: flex; flex-direction: column; gap: 5px; justify-content: center; }
.q .l1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.q .nm { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.q .wg { font-size: 12px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.q .l2 { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); align-items: center; }
.q .l2 span { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.q .l2 svg { width: 13px; height: 13px; }
.q .l3 { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; min-width: 0; }
.q .note { font-size: 12px; color: var(--ink-soft); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; }
.q .side { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px; padding: 10px 14px; }
.q .room { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.q .room.none { font-family: inherit; font-size: 12px; color: var(--ink-soft); font-weight: 500; }
.q-new { animation: newrow 1.4s var(--ease); }
@keyframes newrow { 0% { background: var(--bronze-soft); transform: translateY(-4px); } }

/* detail panel */
.detail { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; border-radius: 16px; }
.d-card { padding: 20px; display: grid; gap: 14px; animation: rise .2s var(--ease); }
.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.d-head h2 { font-family: "Source Serif 4", Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.d-head-r { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.d-time { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; background: var(--bronze-soft); }
.d-time b { font-family: "Source Serif 4", Georgia, serif; font-size: 32px; font-weight: 600; line-height: 1; display: block; }
.d-time span { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.d-card[data-wait="attention"] .d-time { background: var(--s-waiting-bg); }
.d-card[data-wait="attention"] .d-time b { color: var(--s-waiting); }
.d-card[data-wait="long"] .d-time { background: var(--danger-soft); }
.d-card[data-wait="long"] .d-time b { color: var(--danger); }
.d-room { text-align: end; }
.d-room b { font-size: 26px; }
.d-why { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.d-next { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-soft); }
.d-next b { color: var(--ink); }
.d-next svg { margin-top: 2px; }
.d-notes { display: grid; gap: 8px; }
.pref-box { background: var(--bronze-soft); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; overflow-wrap: anywhere; }
.pref-box.rem { background: var(--s-waiting-bg); }
.pref-box span { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }
.d-sec { padding-top: 14px; border-top: 1px solid var(--line); }
.d-sec.act { display: grid; gap: 8px; border-top: none; padding-top: 0; }
.d-sec.act:empty { display: none; }
.d-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.rm-head, .rm-other summary { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 2px 0 8px; display: flex; gap: 6px; align-items: center; }
.rm-head span, .rm-other summary span { background: var(--line); color: var(--ink); border-radius: 10px; padding: 0 7px; font-size: 11px; }
.rm-other { margin-top: 10px; }
.rm-other summary { cursor: pointer; }
.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.rm { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 7px 4px; cursor: pointer; text-align: center; font: inherit; color: inherit; transition: border-color .15s, background .15s; min-height: 48px; }
.rm:hover { border-color: var(--bronze); }
.rm.on { background: var(--bronze); border-color: var(--bronze); color: #fff; }
html[data-theme="dark"] .rm.on { color: #1b140c; }
.rm b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.rm small { display: block; font-size: 10px; opacity: .8; }
.hk-dirty small { color: var(--danger); opacity: 1; } .rm.on small { color: inherit; }
.pick-hint { margin: 0; font-size: 12.5px; color: var(--ink-soft); text-align: center; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; }
.legend-note { font-size: 11.5px; color: var(--ink-soft); margin: 8px 0 10px; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 36px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--bronze); }
.detail-empty { padding: 36px 20px; }
.detail-close { display: none; }
.eng-line { padding: 4px 2px; }

@media (max-width: 1180px) {
  .rc-body { grid-template-columns: 1fr; }
  .detail { position: fixed; inset: auto 0 0 0; max-height: 88vh; z-index: 60; border-radius: 18px 18px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.25); background: var(--panel); transform: translateY(105%); transition: transform .28s var(--ease); padding-bottom: env(safe-area-inset-bottom); }
  .detail.open { transform: none; }
  .detail .d-card { border: none; box-shadow: none; }
  .detail-close { display: inline-flex; }
  .metrics { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
}
@media (max-width: 700px) {
  .rc-shell { padding-inline: 12px; }
  .metrics { display: flex; overflow-x: auto; scrollbar-width: none; }
  .metrics .metric { flex: 0 0 150px; }
  .toolbar .search-box { max-width: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .q { grid-template-columns: 4px 76px minmax(0, 1fr); }
  .q .side { grid-column: 3; flex-direction: row; justify-content: space-between; align-items: center; padding-top: 0; }
  .q .timer b { font-size: 18px; }
  .groups dl { grid-template-columns: 1fr; }
}

/* ================= Guest page =================
   One calm column. The status is the only loud thing on the page; everything else
   is quiet paper and hairlines. Logical properties throughout so Arabic mirrors cleanly. */
:root {
  --hero-wait-a: #6B4E33; --hero-wait-b: #3F2E1F;
  --hero-ready-a: #2F7F5A; --hero-ready-b: #1B5139;
  --hero-quiet-a: #5D5A55; --hero-quiet-b: #3F3C38;
  --hero-ink: #FFFFFF;
  --gold: #D8B26A;
}
html[data-theme="dark"] { --hero-wait-a: #5A4129; --hero-wait-b: #2E2217; --hero-ready-a: #256B4B; --hero-ready-b: #143D2B; --gold: #E3BE78; }

.g-shell { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: calc(8px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; display: flex; flex-direction: column; gap: 14px; }
#gApp { display: grid; gap: 14px; }
.g-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 2px; }
.g-top .logo-chip img { height: 24px; }

/* language menu */
.lang { position: relative; }
.lang summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.lang summary::-webkit-details-marker { display: none; }
.lang summary svg { width: 16px; height: 16px; color: var(--bronze); }
.lang[open] summary { border-color: var(--bronze); }
.lang-list { position: absolute; inset-inline-end: 0; top: calc(100% + 6px); z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: grid; min-width: 160px; animation: rise .18s var(--ease); }
.lang-list button { border: none; background: transparent; color: var(--ink); text-align: start; padding: 11px 12px; min-height: 44px; border-radius: 9px; font-size: 15px; font-weight: 500; cursor: pointer; }
.lang-list button:hover { background: var(--paper); }
.lang-list button[aria-current="true"] { font-weight: 700; color: var(--bronze-deep); background: var(--bronze-soft); }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 34px 22px 24px; text-align: center; color: var(--hero-ink); background: radial-gradient(120% 90% at 50% 0%, var(--hero-wait-a) 0%, var(--hero-wait-b) 100%); box-shadow: 0 18px 40px rgba(43, 33, 24, .18); display: grid; gap: 10px; justify-items: center; transition: background .8s var(--ease); animation: rise .5s var(--ease); }
.hero.ready { background: radial-gradient(120% 90% at 50% 0%, var(--hero-ready-a) 0%, var(--hero-ready-b) 100%); }
.hero.done, .hero.quiet { background: radial-gradient(120% 90% at 50% 0%, var(--hero-quiet-a) 0%, var(--hero-quiet-b) 100%); }
.hero.quiet { padding-block: 40px 34px; }
.hero h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: clamp(30px, 8.6vw, 40px); line-height: 1.1; letter-spacing: .003em; text-wrap: balance; margin: 4px 0 0; }
.hero .lead { margin: 0; max-width: 32ch; font-size: 16px; line-height: 1.5; opacity: .92; text-wrap: pretty; }
.hero .note { margin: 0; font-size: 13.5px; opacity: .78; max-width: 34ch; min-height: 2.8em; }
.hero .small { margin: 0; font-size: 12.5px; opacity: .75; max-width: 32ch; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }

/* the mark: a slow breathing ring while waiting, a key when ready */
.mark { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); position: relative; }
.mark svg { width: 28px; height: 28px; }
.mark.breathing span { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 0 rgba(216,178,106,.55); animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 0% { transform: scale(.85); box-shadow: 0 0 0 0 rgba(216,178,106,.5); } 60% { transform: scale(1); box-shadow: 0 0 0 16px rgba(216,178,106,0); } 100% { transform: scale(.85); box-shadow: 0 0 0 0 rgba(216,178,106,0); } }

/* the room-ready moment */
.hero.arrive .mark { animation: keyIn .9s var(--ease) both; }
.hero.arrive .mark::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); animation: ripple 1.4s .25s ease-out both; }
.hero.arrive h1 { animation: rise .6s .15s var(--ease) both; }
.hero.arrive .lead { animation: rise .6s .3s var(--ease) both; }
@keyframes keyIn { 0% { transform: scale(.3) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.12) rotate(6deg); opacity: 1; } 100% { transform: none; } }
@keyframes ripple { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
.hero.step-change .note { animation: fade .6s var(--ease); }

/* progress */
.steps { list-style: none; margin: 10px 0 2px; padding: 0; width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); position: relative; }
.steps::before { content: ""; position: absolute; top: 7px; inset-inline: 12.5%; height: 2px; background: rgba(255,255,255,.18); }
.steps li { position: relative; display: grid; justify-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; opacity: .62; line-height: 1.25; padding-inline: 2px; }
.steps li i { width: 16px; height: 16px; border-radius: 50%; background: var(--hero-wait-b); border: 2px solid rgba(255,255,255,.35); position: relative; z-index: 1; transition: all .5s var(--ease); }
.hero.ready .steps li i { background: var(--hero-ready-b); }
.steps li.done { opacity: .95; }
.steps li.done i { background: var(--gold); border-color: var(--gold); }
.hero.ready .steps li.done i { background: #fff; border-color: #fff; }
.steps li.now { opacity: 1; }
.steps li.now i { border-color: var(--gold); box-shadow: 0 0 0 5px rgba(216,178,106,.25); }
.steps li.done + li::before, .steps li.done::after { content: none; }

/* reference: present, not shouting */
.ref { display: inline-flex; align-items: baseline; gap: 8px; margin-top: 6px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); font-size: 12px; }
.ref span { opacity: .75; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; font-size: 10.5px; }
.ref b { font-size: 15px; letter-spacing: .04em; font-weight: 700; font-variant-numeric: tabular-nums; }

/* stay details */
.stay dl { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; padding: 18px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
.stay dl div { min-width: 0; }
.stay dt { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 3px; }
.stay dd { margin: 0; font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }

/* feedback */
.fb { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; text-align: center; animation: rise .4s var(--ease); }
.fb h2 { font-family: "Source Serif 4", Georgia, serif; font-size: 20px; font-weight: 600; margin: 0; }
.stars { display: flex; justify-content: center; gap: 4px; direction: ltr; }
.stars button { width: 48px; height: 48px; border: none; background: transparent; color: var(--line); cursor: pointer; border-radius: 12px; display: grid; place-items: center; transition: transform .15s var(--ease), color .15s; }
.stars button svg { width: 32px; height: 32px; fill: currentColor; stroke: none; }
.stars button.on { color: var(--gold); }
.stars button:active { transform: scale(.9); }
.helpful { display: grid; gap: 10px; justify-items: center; }
.helpful p { margin: 0; font-size: 14px; color: var(--ink-soft); }
.yn { display: flex; gap: 8px; }
.yn button { min-width: 88px; min-height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; }
.yn button[aria-pressed="true"] { background: var(--bronze); border-color: var(--bronze); color: #fff; }
.send { min-height: 48px; padding: 0 22px; border-radius: 24px; border: none; background: var(--bronze); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
.send:disabled { opacity: .6; }
html[data-theme="dark"] .send, html[data-theme="dark"] .yn button[aria-pressed="true"] { color: #1b140c; }
.fb.done { display: flex; align-items: center; justify-content: center; gap: 10px; }
.fb.done svg { width: 22px; height: 22px; color: var(--bronze); }
.fb.done p { margin: 0; font-weight: 600; }
.fb-err { margin: 0; color: var(--danger); font-size: 13px; }

/* discover */
.discover { display: grid; gap: 12px; margin-top: 12px; }
.discover h2 { font-family: "Source Serif 4", Georgia, serif; font-size: 24px; font-weight: 600; margin: 0; padding-inline: 4px; }
.dsub { margin: -6px 0 0; padding-inline: 4px; color: var(--ink-soft); font-size: 14.5px; }
.today { background: var(--bronze-soft); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
.today .label { color: var(--bronze-deep); }
.today ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.today li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; font-weight: 600; color: var(--ink); }
.today li svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--bronze); margin-top: 2px; }
.qlinks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qlink { display: flex; align-items: center; gap: 12px; padding: 14px; min-height: 64px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-decoration: none; transition: border-color .15s, transform .15s; min-width: 0; }
.qlink:hover { border-color: var(--bronze); }
.qlink:active { transform: scale(.98); }
.qlink > svg:first-child { width: 22px; height: 22px; color: var(--bronze); flex-shrink: 0; }
.qlink span { display: grid; min-width: 0; flex: 1; }
.qlink b { font-size: 14.5px; }
.qlink small { font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qlink .out { width: 16px; height: 16px; color: var(--ink-soft); flex-shrink: 0; }
html[dir="rtl"] .qlink .out { transform: scaleX(-1); }
.qlinks .qlink:only-child { grid-column: 1 / -1; }
.xlist { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.x-item + .x-item { border-top: 1px solid var(--line); }
.x-item summary { list-style: none; display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 60px; cursor: pointer; }
.x-item summary::-webkit-details-marker { display: none; }
.x-item .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--bronze-soft); color: var(--bronze-deep); display: grid; place-items: center; flex-shrink: 0; }
.x-item .ic svg { width: 21px; height: 21px; }
.x-item .tt { font-weight: 700; font-size: 15.5px; flex: 1; }
.x-item .chev { width: 18px; height: 18px; color: var(--ink-soft); transition: transform .25s var(--ease); }
.x-item[open] .chev { transform: rotate(180deg); }
.x-item .body { padding-block: 0 16px; padding-inline: 70px 18px; color: var(--ink-soft); font-size: 14.5px; line-height: 1.55; animation: fade .25s; display: grid; gap: 8px; justify-items: start; }
.x-item .body p { margin: 0; }
.x-item .note2 { font-size: 13px; }
.soon { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--bronze-deep); background: var(--bronze-soft); padding: 3px 9px; border-radius: 6px; }

.g-foot { margin-top: auto; padding-top: 20px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--ink-soft); font-size: 12px; }
.live-note { display: inline-flex; align-items: center; gap: 7px; }
.live-note i { width: 7px; height: 7px; border-radius: 50%; background: var(--s-ready); }
.conn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 600; z-index: 40; }

/* Arabic: joined letters must not be letter-spaced or upper-cased; give lines more room */
html[lang="ar"] .g-shell, html[lang="ar"] .g-shell * { letter-spacing: 0 !important; text-transform: none !important; }
html[lang="ar"] .g-shell { font-family: "Noto Sans Arabic", "Plus Jakarta Sans", system-ui, sans-serif; }
html[lang="ar"] .hero h1, html[lang="ar"] .discover h2, html[lang="ar"] .fb h2 { font-family: "Noto Sans Arabic", system-ui, sans-serif; font-weight: 700; line-height: 1.35; }
html[lang="ru"] .hero h1, html[lang="de"] .hero h1 { font-size: clamp(27px, 7.6vw, 36px); }
@media (max-width: 360px) { .qlinks { grid-template-columns: 1fr; } .steps li { font-size: 10.5px; } .stay dl { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .mark.breathing span { animation: none; } }

</style>

/* ---------- transport: Apps Script (google.script.run) or dev server (fetch) ---------- */
function transport(method, path, body) {
  const token = WG.token || '';
  if (window.google && window.google.script && window.google.script.run) {
    return new Promise((resolve) => {
      window.google.script.run
        .withSuccessHandler((r) => resolve(r && typeof r.status === 'number' ? r : { status: 500, body: { error: 'Unexpected reply from the server' } }))
        .withFailureHandler(() => resolve({ status: 0, body: { error: 'Cannot reach the server. Check your connection.' } }))
        .apiCall(token, method, path, body || null);
    });
  }
  return fetch('/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, method, path, body: body || null }) })
    .then((r) => r.json())
    .catch(() => ({ status: 0, body: { error: 'Cannot reach the server. Check your connection.' } }));
}

async function api(method, path, body) {
  const t0 = Date.now();
  const r = await transport(method, path, body);
  if (typeof r.t === 'number') WG.skew = r.t - (t0 + Date.now()) / 2; // assume symmetric latency
  if (r.status === 401 && path !== '/api/login') { forgetToken(); showLogin('Your session has ended. Please sign in again.'); throw Object.assign(new Error('Signed out'), { status: 401, silent: true }); }
  if (r.status === 0) throw Object.assign(new Error(r.body.error), { offline: true });
  if (r.status >= 400) throw Object.assign(new Error((r.body && r.body.error) || 'Something went wrong'), { status: r.status, data: r.body });
  return r.body;
}

function rememberToken(t) { WG.token = t; try { sessionStorage.setItem('wg-token', t); } catch (e) { /* storage blocked: stay signed in for this page only */ } }
function forgetToken() { WG.token = null; try { sessionStorage.removeItem('wg-token'); } catch (e) { /* ignore */ } if (WG.stopLive) { WG.stopLive(); WG.stopLive = null; } }
function storedToken() { try { return sessionStorage.getItem('wg-token'); } catch (e) { return null; } }

/* ---------- live sync: poll a tiny version counter, refetch only when it changes ---------- */
function live(onChange, onState = () => {}, { baseMs = 4000 } = {}) {
  let last = null, timer = null, fails = 0, stopped = false, busy = false;
  const tick = async () => {
    if (stopped || busy) return;
    if (document.hidden) { schedule(); return; }
    busy = true;
    try {
      const { version } = await api('GET', '/api/version');
      fails = 0; onState(true);
      if (last === null || version !== last) onChange(); // first tick also refreshes, so nothing changed since page load is missed
      last = version;
    } catch (e) { if (e.silent) { stopped = true; return; } fails++; onState(false); }
    busy = false; schedule();
  };
  const schedule = () => { clearTimeout(timer); if (!stopped) timer = setTimeout(tick, fails ? Math.min(30000, baseMs * (fails + 1)) : baseMs); };
  const onVis = () => { if (!document.hidden) { clearTimeout(timer); tick(); } };
  document.addEventListener('visibilitychange', onVis);
  tick();
  return () => { stopped = true; clearTimeout(timer); document.removeEventListener('visibilitychange', onVis); };
}

/* ---------- time ---------- */
/** Averages and delays: "45 s", "12 min", "1h 05m". */
function fmtDuration(sec) {
  if (sec == null || isNaN(sec)) return '-';
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return `${sec} s`;
  const m = Math.floor(sec / 60);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
}
/** Live waiting timers for staff: minutes, not ticking seconds ("<1 min", "12 min", "1h 05m"). */
function fmtWait(sec) {
  if (sec == null || isNaN(sec)) return '-';
  const m = Math.floor(Math.max(0, sec) / 60);
  return m < 1 ? '<1 min' : m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
}
const fmtClock = (t) => (t ? new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }) : '-'); // hotel operations run on the 24-hour clock
const fmtDate = (d) => (d ? new Date(d + 'T00:00:00').toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) : '-');
const pax = (g) => `${g.adults} adult${g.adults === 1 ? '' : 's'}${g.children ? `, ${g.children} child${g.children === 1 ? '' : 'ren'}` : ''}`;
function tickTimers() {
  const now = nowMs();
  for (const el of $$('[data-since]')) {
    const sec = ((el.dataset.until ? Date.parse(el.dataset.until) : now) - Date.parse(el.dataset.since)) / 1000;
    const txt = fmtWait(sec);
    if (el.textContent !== txt) el.textContent = txt;
    // an element with data-levels="warn,alert" (minutes) gets its wait level as a class
    if (el.dataset.levels) {
      const [w, a] = el.dataset.levels.split(',').map(Number);
      const lvl = sec / 60 >= a ? 'long' : sec / 60 >= w ? 'attention' : 'normal';
      const host = el.closest('[data-waitbox]') || el;
      if (host.dataset.wait !== lvl) host.dataset.wait = lvl;
    }
  }
}
setInterval(tickTimers, 1000);

/* ---------- toasts, dialogs ---------- */
function toast(msg, type = '') {
  let box = $('#toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${type === 'err' ? icon('alert') : icon('check')}<span>${esc(msg)}</span>`;
  box.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, type === 'err' ? 5500 : 2600);
}

function dialog({ title, body, confirmLabel = 'Confirm', cancelLabel = 'Cancel', input = null }) {
  return new Promise((resolve) => {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">${esc(title)}</h2><div class="muted">${body || ''}</div>
      ${input ? `<label class="field" style="margin-top:14px"><span>${esc(input.label)}</span><input class="in" id="dlgIn" maxlength="200" autocomplete="off"></label><div class="field-error" id="dlgErr" hidden>${esc(input.error || 'Required')}</div>` : ''}
      <div class="modal-actions">${cancelLabel ? `<button class="btn btn-ghost" data-r="0">${esc(cancelLabel)}</button>` : ''}<button class="btn btn-primary" data-r="1">${esc(confirmLabel)}</button></div></div>`;
    const done = (v) => { ov.remove(); document.removeEventListener('keydown', key); resolve(v); };
    const submit = () => {
      if (!input) return done(true);
      const v = $('#dlgIn', ov).value.trim();
      if (v.length < (input.min || 1)) { $('#dlgErr', ov).hidden = false; return; }
      done(v);
    };
    const key = (e) => { if (e.key === 'Escape') done(false); if (e.key === 'Enter' && input) { e.preventDefault(); submit(); } };
    ov.addEventListener('click', (e) => { if (e.target === ov) return done(false); const r = e.target.closest('[data-r]'); if (r) r.dataset.r === '1' ? submit() : done(false); });
    document.addEventListener('keydown', key);
    document.body.appendChild(ov);
    (input ? $('#dlgIn', ov) : $('[data-r="1"]', ov)).focus();
  });
}
const confirmDialog = (o) => dialog(o);

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* iframe may block the clipboard API */ }
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}

/* ---------- shared staff building blocks ---------- */
const TAG_LABEL = { occasion: 'Special occasion', accessibility: 'Accessibility' };
const WAIT_LABEL = { normal: 'On track', attention: 'Attention', long: 'Long wait' };

/**
 * Transparent priority: every reason is shown to staff, nothing is a hidden score.
 * High: marked priority by the Rooms Controller, or waiting past the long-wait threshold,
 *       or past the attention threshold for a VIP or accessibility guest.
 * Attention: past the attention threshold, or VIP / accessibility.
 */
function priorityOf(g, cfg) {
  const waitingForRoom = ['waiting', 'room_assigned', 'preparing'].includes(g.status);
  const min = (nowMs() - Date.parse(g.timestamps.created)) / 60000;
  const wait = !waitingForRoom ? 'normal' : min >= cfg.alert ? 'long' : min >= cfg.warn ? 'attention' : 'normal';
  const reasons = [];
  if (g.priority) reasons.push({ k: 'manual', t: 'Marked priority', strong: true });
  if (wait !== 'normal') reasons.push({ k: 'wait', t: `Waiting ${fmtWait(min * 60)}`, strong: wait === 'long' });
  if (g.vipCode) reasons.push({ k: 'vip', t: `VIP ${g.vipCode.replace(/^VIP/i, '').trim()}`.trim() });
  (g.tags || []).forEach((t) => reasons.push({ k: t, t: TAG_LABEL[t] || t }));
  if (g.children) reasons.push({ k: 'family', t: `Family · ${g.children} ${g.children === 1 ? 'child' : 'children'}`, info: true });
  const sensitive = !!g.vipCode || (g.tags || []).includes('accessibility');
  const level = !waitingForRoom ? 'normal'
    : g.priority || wait === 'long' || (wait === 'attention' && sensitive) ? 'high'
    : wait === 'attention' || sensitive ? 'attention' : 'normal';
  return { level, wait, reasons, waitingForRoom };
}

const reasonChips = (p, max = 9) => p.reasons.slice(0, max).map((r) => `<span class="why ${r.strong ? 'strong' : ''} ${r.info ? 'info' : ''} why-${r.k}">${esc(r.t)}</span>`).join('');

/** Timeline: staff actions from the status history, plus real guest events (QR opened, saw "room ready"). */
function timelineHtml(g, history) {
  const ev = history.map((h) => {
    let t = STATUS_LABEL[h.to] || h.to;
    if (h.to === 'waiting' && !h.from) t = 'Waiting Guest created';
    else if (h.from === h.to && /^Room changed from/.test(h.note || '')) t = `Room changed to ${h.roomNumber} (was ${h.note.replace('Room changed from ', '')})`;
    else if (h.to === 'room_assigned' && h.from !== h.to) t = `Room ${h.roomNumber} assigned`;
    else if (h.to === 'preparing') t = 'Room preparation started';
    else if (h.to === 'ready') t = 'Room ready · guest page updated';
    else if (h.from === h.to) t = h.note || 'Updated';
    const note = h.from === h.to || h.to === 'room_assigned' ? '' : h.note;
    return { at: h.at, t, note, by: h.by, kind: h.to };
  });
  if (g.timestamps.qrOpened) ev.push({ at: g.timestamps.qrOpened, t: 'Guest opened their room status page', by: 'Guest', kind: 'guest' });
  if (g.timestamps.guestSawReady) {
    const d = (Date.parse(g.timestamps.guestSawReady) - Date.parse(g.timestamps.roomReady)) / 1000;
    ev.push({ at: g.timestamps.guestSawReady, t: `Guest saw "room ready" · ${fmtDuration(d)} after`, by: 'Guest', kind: 'guest' });
  }
  if (g.feedback) ev.push({ at: g.feedback.at, t: `Guest feedback · ${'★'.repeat(g.feedback.rating)}${g.feedback.helpful ? ` · status page helpful: ${g.feedback.helpful}` : ''}`, by: 'Guest', kind: 'guest' });
  ev.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  return `<ol class="tl">${ev.map((e) => `<li class="tl-${e.kind === 'guest' ? 'guest' : 'staff'}"><time>${fmtClock(e.at)}</time><div><b>${esc(e.t)}</b>${e.note ? `<span class="muted"> · ${esc(e.note)}</span>` : ''}${e.by ? `<small>${esc(e.by)}</small>` : ''}</div></li>`).join('')}</ol>`;
}

      ${row('Departure', fmtDate(g.departureDate))}

/** Guest engagement as one short line for staff. */
function engagementHtml(g) {
  if (g.timestamps.guestSawReady) return `<span class="eng ok">Guest has seen "room ready"</span>`;
  if (['ready', 'returned'].includes(g.status)) return g.timestamps.qrOpened ? `<span class="eng warn">Guest has not looked since the room became ready</span>` : `<span class="eng warn">Guest has not opened their page</span>`;
  if (g.timestamps.qrOpened) return `<span class="eng ok">Guest is following their status</span>`;
  return `<span class="eng">Guest has not opened their page yet</span>`;
}
